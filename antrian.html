<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ANTRIAN CHARGING</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        /* GLOBAL STYLE (DARK) */
        body {
            margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif;
            background-color: #0b101a; color: #fff;
            background-image: url('1763947427555.jpg'); 
            background-size: cover; background-attachment: fixed;
            padding-bottom: 100px;
        }
        body::before { content:''; position:fixed; inset:0; background:rgba(11, 16, 26, 0.95); z-index:-1; }

        /* HEADER */
        .header {
            padding: 15px; display: flex; align-items: center; gap: 15px;
            background: rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.1);
            position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px);
        }
        .btn-back { text-decoration: none; font-size: 24px; color: #00bcd4; width: 40px; height: 40px; border: 1px solid #00bcd4; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        h2 { margin: 0; font-family: 'Orbitron'; font-size: 18px; letter-spacing: 1px; }

        /* CONTAINER */
        .container { padding: 20px; max-width: 480px; margin: 0 auto; }

        /* FORM CARD */
        .card {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px; padding: 25px; margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        label { display: block; font-family: 'Orbitron'; font-size: 10px; color: #8899a6; margin-bottom: 8px; letter-spacing: 1px; }
        input {
            width: 100%; padding: 15px; background: rgba(0,0,0,0.3); border: 1px solid #333;
            border-radius: 12px; text-align: center; font-size: 20px; font-weight: 700;
            color: #fff; margin-bottom: 15px; outline: none; font-family: 'Rajdhani';
        }
        input:focus { border-color: #00bcd4; box-shadow: 0 0 10px rgba(0, 188, 212, 0.2); }
        
        .btn-daftar {
            width: 100%; padding: 18px; background: #00bcd4; color: #000;
            border: none; border-radius: 12px; font-family: 'Orbitron'; font-weight: 900;
            font-size: 16px; cursor: pointer; box-shadow: 0 0 20px rgba(0, 188, 212, 0.4);
            margin-top: 10px;
        }

        /* SLOT GRID */
        .status-head { text-align: center; font-family: 'Orbitron'; font-weight: bold; margin-bottom: 15px; color: #00bcd4; font-size: 12px; letter-spacing: 2px; }
        .status-head::before { content:'●'; margin-right:5px; }
        
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 30px; }
        .slot {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px; padding: 15px 5px; text-align: center; min-height: 180px;
            display: flex; flex-direction: column; justify-content: space-between; position: relative;
        }
        .slot.active { border-color: #00bcd4; background: rgba(0, 188, 212, 0.05); }

        /* BATERAI ICON (PERBAIKAN CENTER) */
        .bat-wrap {
            flex: 1; display: flex; align-items: center; justify-content: center; padding-bottom: 5px;
        }
        .bat-icon {
            width: 40px; height: 70px; border: 3px solid #555; border-radius: 6px;
            position: relative; display: flex; align-items: flex-end; padding: 3px;
        }
        .bat-icon::before { content: ''; position: absolute; top: -6px; left: 12px; width: 12px; height: 4px; background: #555; }
        .bat-fill { width: 100%; background: #00bcd4; border-radius: 2px; transition: height 0.5s; }
        .bat-bolt {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 28px; color: #fff; z-index: 2; text-shadow: 0 0 5px #000;
        }

        .plat-text { font-weight: 800; font-size: 16px; color: #fff; margin: 5px 0; }
        .timer-text { font-size: 18px; font-weight: 700; color: #00bcd4; font-family: 'Orbitron'; }

        .btn-act {
            width: 100%; padding: 10px; border-radius: 8px; border: none;
            font-weight: 800; cursor: pointer; font-size: 12px; font-family: 'Orbitron';
            border: 1px solid; background: transparent; margin-top: 5px;
        }
        .btn-start { border-color: #00bcd4; color: #00bcd4; }
        .btn-stop { border-color: #ff3b3b; color: #ff3b3b; background: rgba(255, 59, 59, 0.1); }

        /* QUEUE LIST */
        .wait-row { 
            display: flex; justify-content: space-between; padding: 15px; 
            border-bottom: 1px solid rgba(255,255,255,0.1); color: #ccc; font-size: 14px; 
        }
        
        /* MODAL & ADMIN */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; }
        .modal-box { background: #111; border: 1px solid #00bcd4; padding: 25px; border-radius: 15px; width: 85%; max-width: 320px; text-align: center; }
        .modal-btn { width: 100%; padding: 12px; background: #00bcd4; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        
        .admin-trigger { text-align: center; color: #666; font-size: 10px; margin-top: 30px; cursor: pointer; letter-spacing: 2px; }
        .admin-panel { display: none; background: #000; padding: 20px; border: 1px solid #ff3b3b; border-radius: 15px; margin-top: 20px; }
        
        /* INFO NEON */
        @keyframes neonP { 0%,100%{border-color:#ccff00} 50%{border-color:#fff} }
        .info-neon { 
            text-align: center; padding: 10px; border-radius: 10px; 
            background: rgba(204, 255, 0, 0.1); border: 2px solid #ccff00; 
            color: #ccff00; font-weight: bold; animation: neonP 1.5s infinite; 
            display: none; margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <audio id="alarm" loop><source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>
    <div id="mod" class="modal"><div class="modal-box"><h3 id="mt" style="color:#fff;margin:0 0 10px">TITLE</h3><p id="mm" style="color:#aaa;margin:0"></p><button onclick="document.getElementById('mod').style.display='none'" class="modal-btn">OK</button></div></div>

    <div class="header"><a href="index.html" class="btn-back">⬅</a><h2>ANTRIAN CHARGING</h2></div>

    <div class="container">
        <div class="card">
            <label>PLAT NOMOR</label><input id="uPlat" placeholder="B 1234 XYZ" style="text-transform:uppercase;">
            <label>WHATSAPP</label><input id="uWa" type="number" placeholder="08xxxxxxxxxx">
            <label>BATERAI (%)</label><input id="uBat" type="number" placeholder="0 - 99">
            <div id="info" class="info-neon"></div>
            <button class="btn-daftar" id="btnDaftar">DAFTAR ANTRIAN</button>
        </div>

        <div class="status-head">STATUS 3 SLOT</div>
        <div class="grid" id="slots"><div style="grid-column:1/-1;text-align:center;color:#555;padding:20px;">Loading System...</div></div>

        <div class="card" style="padding:0;">
            <div style="padding:15px; border-bottom:1px solid rgba(255,255,255,0.1); font-weight:bold; display:flex; justify-content:space-between;">
                <span style="color:#fff; font-family:'Orbitron'; font-size:12px;">DAFTAR TUNGGU</span>
                <span id="qCount" style="color:#00bcd4">0</span>
            </div>
            <div id="qList" style="padding:0 15px;"></div>
        </div>

        <div class="admin-trigger" onclick="adm()">🔒 ADMIN CONTROL</div>
        <div id="admPan" class="admin-panel">
            <h4 style="color:#ff3b3b;text-align:center;margin:0 0 15px;">MASTER CONTROL</h4>
            <button onclick="resAll()" class="modal-btn" style="background:transparent; border:1px solid #ff3b3b; color:#ff3b3b;">RESET DATA TOTAL</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, runTransaction, setDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        const FONNTE = ["Fc8dWb7jiKr7CXuEZXBx"];
        const FB = { apiKey: "AIzaSyALIlkIDALIk83K8s1htalvW6rmNNw02Go", authDomain: "sistem-antrian-b1c39.firebaseapp.com", projectId: "sistem-antrian-b1c39", storageBucket: "sistem-antrian-b1c39.firebasestorage.app", messagingSenderId: "454124587608", appId: "1:454124587608:web:34fbb0f5211067a67f982d" };
        
        const app = initializeApp(FB); const db = getFirestore(app); const ref = doc(db, "antrian", "utama");
        let isAdmin = false; let triggered = new Set(); const aud = document.getElementById('alarm');

        // EXPOSE FUNCTIONS
        window.adm = () => { if(prompt("PIN")==='1131') document.getElementById('admPan').style.display='block'; };
        window.resAll = () => { if(confirm('RESET?')) setDoc(ref,{chargingSlots:[null,null,null],waitingQueue:[],blockedList:[]}); };
        window.alertBox = (t,m) => { document.getElementById('mt').innerText=t; document.getElementById('mm').innerText=m; document.getElementById('mod').style.display='flex'; };

        function prime() { if(aud.paused) aud.play().then(()=>{setTimeout(()=>{aud.pause();aud.currentTime=0},100)}).catch(()=>{}); }
        document.body.addEventListener('click', prime);

        function sendWA(target, msg, sch=null) {
            let p = target.replace(/\D/g,''); if(p.startsWith('0')) p='62'+p.substring(1);
            const fd = new FormData(); fd.append("target", p); fd.append("message", msg); fd.append("countryCode", "62");
            fd.append("schedule", sch ? Math.floor(new Date(sch).getTime()/1000) : "0");
            try { fetch("https://api.fonnte.com/send", { method: "POST", headers: { "Authorization": FONNTE[0] }, body: fd }); } catch(e){}
        }
        
        function msg(t,p,e="") { return `*Halo Sahabat MLU!*\n\n${t} *${p}* ${e}.\n\nPesan ini dikirim otomatis oleh Admin MLU.`; }

        document.getElementById('btnDaftar').onclick = async () => {
            prime();
            const p = document.getElementById('uPlat').value.toUpperCase(); const w = document.getElementById('uWa').value; const b = parseInt(document.getElementById('uBat').value);
            if(!p || !w || isNaN(b)) return window.alertBox('ERROR','Isi Semua Data');
            
            await runTransaction(db, async(t)=>{
                const d=(await t.get(ref)).data()||{}; let s=d.chargingSlots||[null,null,null]; let q=d.waitingQueue||[];
                if(s.some(x=>x?.name===p)||q.some(x=>x?.name===p)) throw "Sudah Ada";
                let limit=100; if(q.length>2) limit=q.length>5?90:95;
                let dur=0; for(let i=b;i<limit;i++) dur+=(i>=90?2.2:(i>=80?1.5:0.8)); dur=Math.ceil(dur); if(dur<2) dur=2;
                const item={name:p, phone:w, startBattery:b, durationMinutes:dur, targetLimit:limit, startTime:null};
                const idx=s.indexOf(null); if(idx!==-1) s[idx]=item; else q.push(item);
                t.set(ref, {chargingSlots:s, waitingQueue:q}, {merge:true});
                if(w) sendWA(w, msg("Motor", p, "berhasil terdaftar"));
            });
            window.alertBox('SUKSES','Masuk Antrian'); document.getElementById('uPlat').value='';
        };

        window.act = (i, type) => {
            prime();
            runTransaction(db, async(t)=>{
                const d=(await t.get(ref)).data(); const s=d.chargingSlots;
                if(type==='stop') { s[i]=null; }
                else {
                    s[i].startTime = new Date();
                    if(s[i].phone) {
                        sendWA(s[i].phone, msg("Motor", s[i].name, "mulai dicas"));
                        const end = new Date(Date.now() + s[i].durationMinutes*60000);
                        sendWA(s[i].phone, msg("Motor", s[i].name, "selesai"), end);
                    }
                }
                t.update(ref, {chargingSlots:s});
            });
        };

        onSnapshot(ref, (snap) => {
            const d=snap.data()||{}; const s=d.chargingSlots||[null,null,null]; const q=d.waitingQueue||[];
            document.getElementById('qCount').innerText = q.length;
            document.getElementById('qList').innerHTML = q.map(x=>`<div class="wait-row"><b>${x.name}</b> <span>${x.startBattery}%</span></div>`).join('');
            const inf = document.getElementById('info');
            if(q.length>0) { inf.style.display='block'; inf.innerHTML=`ANTRIAN: ${q.length} <br> BATAS: ${q.length>2?(q.length>5?90:95):100}%`; } else inf.style.display='none';

            document.getElementById('slots').innerHTML = s.map((x,i)=>{
                if(!x) return `<div class="slot"><div class="bat-wrap"><div class="bat-icon"></div></div><small style="color:#555">KOSONG</small></div>`;
                const isRun=!!x.startTime;
                let btn = isRun ? `<button class="btn-act btn-stop" onclick="act(${i},'stop')">STOP</button>` : `<button class="btn-act btn-go" onclick="act(${i},'start')">MULAI</button>`;
                let txt="Tap Mulai"; let h=x.startBattery;
                if(isRun) {
                    const end = (x.startTime.seconds?x.startTime.seconds*1000:new Date(x.startTime).getTime()) + (x.durationMinutes*60000);
                    const diff = end - Date.now();
                    if(diff>0) { const m=Math.floor(diff/60000); const sc=Math.floor((diff%60000)/1000); txt=`${m}:${sc}`; h=100; }
                    else { txt="SELESAI"; const k=x.name+end; if(!triggered.has(k)){ triggered.add(k); aud.play().catch(()=>{}); window.alertBox('ALARM', 'Selesai!'); } }
                }
                return `<div class="slot ${isRun?'active':''}"><div class="bat-wrap"><div class="bat-icon"><div class="bat-fill" style="height:${h}%"></div><div class="bat-bolt">⚡</div></div></div><div class="plat-text">${x.name}</div><div class="timer-text" style="color:${txt==='SELESAI'?'#ff3b3b':'#00bcd4'}">${txt}</div>${btn}</div>`;
            }).join('');
        });
        
        // SYNC TIMER (PENTING AGAR TIDAK MACET SAAT MINIMIZE)
        setInterval(()=>{ 
            // Trigger onSnapshot logic akan handle update timer
        }, 1000); 
        
        // Manual refresh UI (Force Update)
        setInterval(()=>{ const slots = document.getElementById('slots'); if(slots) slots.style.opacity = slots.style.opacity === '0.99' ? '1' : '0.99'; }, 1000);

    </script>
</body>
</html>
