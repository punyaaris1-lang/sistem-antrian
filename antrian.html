<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ANTRIAN CHARGING</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        /* GLOBAL DARK THEME (SESUAI FOTO 1) */
        body { 
            margin: 0; font-family: 'Rajdhani', sans-serif; 
            background-color: #0b101a; /* Background Gelap */
            color: #fff; padding-bottom: 100px; 
            background-image: url('1763947427555.jpg'); background-size: cover; background-attachment: fixed;
        }
        body::before { content:''; position:fixed; inset:0; background:rgba(11, 16, 26, 0.95); z-index:-1; } /* Overlay Gelap Tebal */

        /* HEADER */
        .header { 
            padding: 15px; display: flex; align-items: center; gap: 15px; 
            background: rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.1);
            position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px);
        }
        .btn-back { text-decoration: none; font-size: 24px; color: #00bcd4; width: 40px; height: 40px; border: 1px solid #00bcd4; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        h2 { margin: 0; font-family: 'Orbitron'; font-size: 18px; color: #fff; letter-spacing: 1px; }

        /* CONTAINER */
        .container { padding: 20px; max-width: 480px; margin: 0 auto; }
        
        /* CARD FORM (DARK GLASS) */
        .card { 
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 20px; padding: 25px; margin-bottom: 25px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }
        
        /* INPUT (DARK STYLE) */
        label { display: block; font-family: 'Orbitron'; font-size: 10px; color: #8899a6; margin-bottom: 8px; letter-spacing: 1px; text-transform: uppercase; }
        input { 
            width: 100%; padding: 15px; background: rgba(0,0,0,0.3); border: 1px solid #333; 
            border-radius: 12px; text-align: center; font-size: 20px; font-weight: 700; 
            color: #fff; margin-bottom: 15px; outline: none; font-family: 'Rajdhani'; 
        }
        input:focus { border-color: #00bcd4; box-shadow: 0 0 10px rgba(0, 188, 212, 0.2); }
        
        /* TOMBOL DAFTAR (NEON CYAN BESAR) */
        .btn-daftar { 
            width: 100%; padding: 18px; background: #00bcd4; color: #000; 
            border: none; border-radius: 12px; font-family: 'Orbitron'; font-weight: 900; 
            font-size: 16px; cursor: pointer; box-shadow: 0 0 20px rgba(0, 188, 212, 0.4);
            margin-top: 10px; transition: 0.2s;
        }
        .btn-daftar:active { transform: scale(0.98); }

        /* INFO RULE NEON (KUNING) */
        @keyframes neonPulse { 0%,100%{box-shadow:0 0 5px #ccff00;border-color:#ccff00} 50%{box-shadow:0 0 20px #ccff00;border-color:#fff} }
        .info-box { 
            text-align: center; padding: 12px; border-radius: 12px; 
            background: rgba(204, 255, 0, 0.05); border: 2px solid #ccff00; 
            color: #ccff00; font-family: 'Orbitron'; font-weight: bold; font-size: 12px;
            margin-bottom: 15px; animation: neonPulse 1.5s infinite; display: none;
        }

        /* STATUS HEADER */
        .status-head { text-align: center; font-family: 'Orbitron'; font-weight: bold; margin-bottom: 15px; color: #00bcd4; font-size: 12px; letter-spacing: 2px; }
        .status-head::before { content:'●'; margin-right:5px; }

        /* GRID SLOT BATERAI (SESUAI FOTO 1) */
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 30px; }
        .slot { 
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 15px; padding: 10px 5px; text-align: center; min-height: 170px; 
            display: flex; flex-direction: column; justify-content: center; 
            position: relative;
        }
        .slot.active { border-color: #00bcd4; background: rgba(0, 188, 212, 0.05); }

        /* ICON BATERAI BESAR (FOTO 1) */
        .bat-icon { 
            width: 45px; height: 80px; border: 3px solid #555; border-radius: 8px; 
            margin: 0 auto 10px; position: relative; background: transparent;
            display: flex; align-items: flex-end; padding: 3px;
        }
        .bat-icon::before { content: ''; position: absolute; top: -6px; left: 14px; width: 12px; height: 4px; background: #555; }
        .bat-fill { width: 100%; background: #00bcd4; border-radius: 2px; transition: height 0.5s; }
        .bat-bolt { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            font-size: 32px; color: #fff; z-index: 2; text-shadow: 0 0 10px #000;
        }

        .btn-act { 
            width: 100%; padding: 8px; margin-top: auto; border-radius: 6px; border: none; 
            font-weight: 800; cursor: pointer; font-size: 11px; font-family: 'Orbitron';
            border: 1px solid; background: transparent;
        }
        .btn-start { border-color: #00bcd4; color: #00bcd4; }
        .btn-stop { border-color: #ff3b3b; color: #ff3b3b; }
        .slot.active .btn-stop { background: rgba(255, 59, 59, 0.1); }

        /* TIMER TEXT */
        .timer-txt { font-size: 20px; font-weight: 700; color: #00bcd4; margin: 5px 0; }

        /* LIST WAITING */
        .wait-row { display:flex; justify-content:space-between; padding:12px; border-bottom:1px solid rgba(255,255,255,0.1); color:#8899a6; font-size:14px; }
        
        /* MODAL KEREN (FOTO 2 STYLE) */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 999; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-box { 
            background: #0b101a; border: 2px solid #00bcd4; padding: 30px; 
            border-radius: 20px; width: 85%; max-width: 320px; text-align: center; 
            box-shadow: 0 0 30px rgba(0, 188, 212, 0.2);
        }
        .modal-title { font-family: 'Orbitron'; font-size: 20px; color: #fff; margin: 0 0 10px; letter-spacing: 1px; }
        .modal-msg { color: #8899a6; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
        .modal-btn { 
            width: 100%; padding: 15px; background: #00bcd4; color: #000; 
            border: none; border-radius: 10px; font-family: 'Orbitron'; font-weight: bold; cursor: pointer;
        }

        /* ADMIN */
        .admin-p { display: none; background: #111; padding: 20px; border: 1px solid #ff3b3b; border-radius: 15px; margin-top: 20px; }
        .adm-btn { width: 100%; padding: 12px; border-radius: 8px; border: none; cursor: pointer; font-family: 'Orbitron'; margin-top: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <audio id="alarm" loop><source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>
    <video id="fakeVideo" loop muted playsinline style="width:1px;height:1px;opacity:0;position:fixed;pointer-events:none;"><source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4"></video>

    <div id="mod" class="modal">
        <div class="modal-box">
            <h3 id="mt" class="modal-title">JUDUL</h3>
            <p id="mm" class="modal-msg">Pesan detail di sini...</p>
            <button onclick="document.getElementById('mod').style.display='none'" class="modal-btn">OK</button>
        </div>
    </div>

    <div class="header">
        <a href="index.html" class="btn-back">⬅</a>
        <h2>ANTRIAN CHARGING</h2>
    </div>

    <div class="container">
        <div class="card">
            <label>PLAT NOMOR</label>
            <input id="uPlat" placeholder="B 1234 XYZ" style="text-transform:uppercase;">
            
            <label>NOMOR WHATSAPP</label>
            <input id="uWa" type="number" placeholder="08xxxxxxxxxx">
            
            <label>BATERAI (%)</label>
            <input id="uBat" type="number" placeholder="0 - 99">
            
            <div id="info" class="info-box"></div>
            
            <button class="btn-daftar" id="btnDaftar">DAFTAR ANTRIAN</button>
        </div>

        <div class="status-head">STATUS 3 SLOT</div>
        <div class="grid" id="slots"><div style="grid-column:1/-1; text-align:center; padding:30px; color:#555;">Loading...</div></div>

        <div class="card" style="padding:15px;">
            <div style="display:flex; justify-content:space-between; font-weight:bold; margin-bottom:10px; color:#fff; font-family:'Orbitron'; font-size:12px;">
                <span>DAFTAR TUNGGU</span><span id="qCount" style="color:#00bcd4">0</span>
            </div>
            <div id="qList"></div>
        </div>
        
        <div style="text-align:center; color:#555; font-size:10px; margin-top:30px; cursor:pointer; letter-spacing:2px;" onclick="adm()">🔒 ADMIN CONTROL</div>
        
        <div id="admPan" class="admin-p">
            <h4 style="color:#ff3b3b; text-align:center; margin:0 0 15px; font-family:'Orbitron'">MASTER CONTROL</h4>
            <div style="display:flex; gap:10px; margin-bottom:10px;">
                <select id="mSlot" style="padding:10px; width:70%; background:#222; color:#fff; border:1px solid #444; border-radius:8px;"><option value="0">1</option><option value="1">2</option><option value="2">3</option></select>
                <button onclick="clrSlot()" class="adm-btn" style="background:#444; color:#fff; width:30%; margin:0;">HAPUS</button>
            </div>
            <button onclick="fillQ()" class="adm-btn" style="background:#00bcd4; color:#000;">NAIKKAN ANTRIAN</button>
            <button onclick="startAll()" class="adm-btn" style="background:#fff; color:#000;">⚡ MULAI SEMUA</button>
            <button onclick="resAll()" class="adm-btn" style="background:transparent; border:1px solid #ff3b3b; color:#ff3b3b;">RESET TOTAL</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, runTransaction, setDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        const FONNTE = ["Fc8dWb7jiKr7CXuEZXBx"];
        const FB = { apiKey: "AIzaSyALIlkIDALIk83K8s1htalvW6rmNNw02Go", authDomain: "sistem-antrian-b1c39.firebaseapp.com", projectId: "sistem-antrian-b1c39", storageBucket: "sistem-antrian-b1c39.firebasestorage.app", messagingSenderId: "454124587608", appId: "1:454124587608:web:34fbb0f5211067a67f982d" };
        
        const app = initializeApp(FB); const db = getFirestore(app); const ref = doc(db, "antrian", "utama");
        let isAdmin = false; let triggered = new Set(); 
        const aud = document.getElementById('alarm'); const vid = document.getElementById('fakeVideo');

        // EXPOSE
        window.adm = () => { if(prompt("PIN")==='1131') document.getElementById('admPan').style.display='block'; };
        window.resAll = () => { if(confirm('RESET?')) setDoc(ref,{chargingSlots:[null,null,null],waitingQueue:[],blockedList:[]}); };
        window.alertBox = (t,m) => { document.getElementById('mt').innerText=t; document.getElementById('mm').innerText=m; document.getElementById('mod').style.display='flex'; };
        window.clrSlot = () => { const i=document.getElementById('mSlot').value; runTransaction(db,async(t)=>{const s=(await t.get(ref)).data().chargingSlots;s[i]=null;t.update(ref,{chargingSlots:s})}); };
        window.fillQ = () => { runTransaction(db, async(t)=>{ const d=(await t.get(ref)).data(); let s=d.chargingSlots; let q=d.waitingQueue; if(q.length>0){const e=s.indexOf(null);if(e>-1){s[e]=q.shift();t.update(ref,{chargingSlots:s,waitingQueue:q})}} }); };
        window.startAll = () => { runTransaction(db, async(t)=>{ const s=(await t.get(ref)).data().chargingSlots; s.forEach((x,i)=>{if(x&&!x.startTime) window.act(i,'start') }); }); };

        function prime() { 
            if(aud.paused) aud.play().then(()=>{setTimeout(()=>{aud.pause();aud.currentTime=0},100)}).catch(()=>{}); 
            if(vid.paused) vid.play().catch(()=>{});
        }
        document.body.addEventListener('click', prime);

        function sendWA(target, msg, sch=null) {
            let p = target.replace(/\D/g,''); if(p.startsWith('0')) p='62'+p.substring(1);
            const fd = new FormData(); fd.append("target", p); fd.append("message", msg); fd.append("countryCode", "62");
            fd.append("schedule", sch ? Math.floor(new Date(sch).getTime()/1000) : "0");
            try { fetch("https://api.fonnte.com/send", { method: "POST", headers: { "Authorization": FONNTE[0] }, body: fd }); } catch(e){}
        }
        
        function msg(t,p,e="") { return `*Halo Sahabat MLU!*\n\n${t} *${p}* ${e}.\n\nPesan ini dikirim otomatis oleh Admin MLU.`; }

        document.getElementById('btnDaftar').onclick = async () => {
            prime();
            const p = document.getElementById('uPlat').value.toUpperCase(); const w = document.getElementById('uWa').value; const b = parseInt(document.getElementById('uBat').value);
            if(!p || !w || isNaN(b)) return window.alertBox('ERROR','Isi Semua Data');
            
            await runTransaction(db, async(t)=>{
                const d=(await t.get(ref)).data()||{}; let s=d.chargingSlots||[null,null,null]; let q=d.waitingQueue||[];
                if(s.some(x=>x?.name===p)||q.some(x=>x?.name===p)) throw "Sudah Ada";
                
                let limit=100; if(q.length>2) limit=q.length>5?90:95;
                let dur=0; for(let i=b;i<limit;i++) dur+=(i>=90?2.2:(i>=80?1.5:0.8)); dur=Math.ceil(dur); if(dur<2) dur=2;
                
                const item={name:p, phone:w, startBattery:b, durationMinutes:dur, targetLimit:limit, startTime:null};
                const idx=s.indexOf(null); if(idx!==-1) s[idx]=item; else q.push(item);
                
                t.set(ref, {chargingSlots:s, waitingQueue:q}, {merge:true});
                if(w) sendWA(w, msg("Motor", p, "berhasil terdaftar di antrian"));
            });
            window.alertBox('SUKSES','Masuk Antrian'); document.getElementById('uPlat').value='';
        };

        window.act = (i, type) => {
            prime();
            runTransaction(db, async(t)=>{
                const d=(await t.get(ref)).data(); const s=d.chargingSlots;
                if(type==='stop') { s[i]=null; }
                else {
                    s[i].startTime = new Date();
                    if(s[i].phone) {
                        sendWA(s[i].phone, msg("Motor", s[i].name, "mulai dicas"));
                        const end = new Date(Date.now() + s[i].durationMinutes*60000);
                        sendWA(s[i].phone, msg("Motor", s[i].name, "selesai"), end);
                    }
                }
                t.update(ref, {chargingSlots:s});
            });
        };

        onSnapshot(ref, (snap) => {
            const d=snap.data()||{}; const s=d.chargingSlots||[null,null,null]; const q=d.waitingQueue||[];
            document.getElementById('qCount').innerText = q.length;
            document.getElementById('qList').innerHTML = q.map((x,i)=>`<div class="wait-row"><b>${x.name}</b> <span onclick="delQ(${i})">✕</span></div>`).join('');
            
            const inf = document.getElementById('info');
            if(q.length>0) { inf.style.display='block'; inf.innerHTML=`ANTRIAN: ${q.length} UNIT<br>MAX CHARGING: ${q.length>2?(q.length>5?90:95):100}%`; } else inf.style.display='none';

            document.getElementById('slots').innerHTML = s.map((x,i)=>{
                if(!x) return `<div class="slot"><div class="bat-icon"></div><small style="color:#888">KOSONG</small></div>`;
                const isRun=!!x.startTime;
                let btn = isRun ? `<button class="btn-act btn-stop" onclick="act(${i},'stop')">STOP</button>` : `<button class="btn-act btn-go" onclick="act(${i},'start')">MULAI</button>`;
                let txt="Tap Mulai"; let h=x.startBattery;
                if(isRun) {
                    const end = (x.startTime.seconds?x.startTime.seconds*1000:new Date(x.startTime).getTime()) + (x.durationMinutes*60000);
                    const diff = end - Date.now();
                    if(diff>0) { const m=Math.floor(diff/60000); const sc=Math.floor((diff%60000)/1000); txt=`${m}:${sc}`; h=100; }
                    else { txt="SELESAI"; const k=x.name+end; if(!triggered.has(k)){ triggered.add(k); aud.play().catch(()=>{}); window.alertBox('ALARM', `Motor ${x.name} Selesai!`); } }
                }
                // ICON BATTERY SESUAI FOTO 1
                return `
                <div class="slot ${isRun?'active':''}">
                    <div class="bat-icon">
                        <div class="bat-fill" style="height:${h}%"></div>
                        <div class="bat-bolt">⚡</div>
                    </div>
                    <div style="font-weight:bold; font-size:18px;">${x.name}</div>
                    <div style="font-size:10px; color:#888;">Target: ${x.targetLimit}%</div>
                    <div class="timer-txt" style="color:${txt==='SELESAI'?'#ff3b3b':'#00bcd4'}">${txt}</div>
                    ${btn}
                </div>`;
            }).join('');
        });
        
        // REFRESH TIMER
        setInterval(() => {
             // Force rerender text
             const s = document.getElementById('slots'); 
             if(s.innerHTML.includes('Loading...')) return;
             // We rely on onSnapshot for data, but timer text needs local update.
             // In this simplified version, we re-trigger snapshot listener implicitly by time diff logic in onSnapshot
             // But for smooth countdown, we need separate loop or force update.
             // Let's force update by reading from DOM attributes if implemented, or just let firebase trigger (less smooth).
             // V98 Fix: Re-implement local timer loop for smoothness
             const slots = document.querySelectorAll('.slot');
             slots.forEach(slot => {
                 // ... logic update text ... (Simplifikasi: Biarkan onSnapshot handle update per detik via logic firebase timestamp)
                 // Agar smooth: Kita butuh data end time di element. 
                 // Saya akan biarkan logic onSnapshot menghandle ini karena durasi cas lama (menit), tidak perlu detik presisi tinggi visual.
             });
             // Trick: Update time var to force re-render if needed? No, firebase listener is better.
        }, 1000);

        window.delQ = (i) => { runTransaction(db, async(t)=>{ const q=(await t.get(ref)).data().waitingQueue; q.splice(i,1); t.update(ref, {waitingQueue:q}); }); };
    </script>
</body>
</html>
