<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ANTRIAN</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@600&display=swap" rel="stylesheet">
    <style>
        body { margin:0; font-family:'Rajdhani'; background:#0b101a url('1763947427555.jpg') center/cover fixed; color:#fff; padding-bottom:100px; }
        body::before { content:''; position:fixed; inset:0; background:rgba(11,16,26,0.95); z-index:-1; }
        .header { padding:15px; display:flex; gap:15px; align-items:center; background:rgba(255,255,255,0.05); backdrop-filter:blur(10px); position:sticky; top:0; z-index:100; border-bottom:1px solid rgba(255,255,255,0.1); }
        .btn-back { text-decoration:none; font-size:24px; color:#00bcd4; border:1px solid #00bcd4; width:40px; height:40px; border-radius:50%; display:flex; justify-content:center; align-items:center; }
        h2 { margin:0; font-family:'Orbitron'; font-size:18px; }
        .container { padding:20px; max-width:480px; margin:0 auto; }
        .card { background:rgba(255,255,255,0.05); padding:20px; border-radius:20px; border:1px solid rgba(255,255,255,0.1); margin-bottom:20px; }
        input { width:100%; padding:15px; background:rgba(0,0,0,0.3); border:1px solid #333; border-radius:12px; color:#fff; text-align:center; font-size:20px; margin-bottom:15px; outline:none; }
        .btn-big { width:100%; padding:18px; background:#00bcd4; border:none; border-radius:12px; font-family:'Orbitron'; font-weight:900; cursor:pointer; }
        .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:30px; }
        .slot { background:rgba(0,210,255,0.1); border:1px solid rgba(0,210,255,0.3); border-radius:15px; padding:10px 5px; text-align:center; height:260px; display:flex; flex-direction:column; position:relative; }
        .slot.active { background:rgba(0,210,255,0.2); border-color:#00bcd4; box-shadow:0 0 15px rgba(0,188,212,0.2); }
        .bat-icon { width:40px; height:70px; border:3px solid #fff; border-radius:6px; margin:10px auto; position:relative; display:flex; align-items:flex-end; padding:3px; }
        .bat-icon::before { content:''; position:absolute; top:-6px; left:50%; transform:translateX(-50%); width:14px; height:4px; background:#fff; border-radius:2px 2px 0 0; }
        .bat-fill { width:100%; background:#00bcd4; border-radius:2px; transition:0.5s; }
        .bat-bolt { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:28px; color:#fff; z-index:2; text-shadow:0 0 5px #000; }
        .timer { font-size:18px; font-weight:700; color:#00bcd4; font-family:'Orbitron'; margin:5px 0; }
        .btn-act { width:100%; padding:10px; border-radius:8px; border:1px solid #00bcd4; background:transparent; color:#00bcd4; font-family:'Orbitron'; font-size:11px; margin-top:auto; cursor:pointer; }
        .btn-stop { border-color:#ff3b3b; color:#ff3b3b; background:rgba(255,59,59,0.1); }
        .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:200; justify-content:center; align-items:center; }
        .modal-box { background:#0b101a; border:2px solid #00bcd4; padding:30px; border-radius:20px; width:85%; max-width:320px; text-align:center; }
    </style>
</head>
<body>
    <audio id="alarm" loop><source src="data:audio/mp3;base64,//uQxAAAAANIAAAAAExBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq//uQxAAAAANIAAAAAExBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq//uQxAAAAANIAAAAAExBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq//uQxAAAAANIAAAAAExBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq//uQxAAAAANIAAAAAExBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq//uQxAAAAANIAAAAAExBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq//uQxAAAAANIAAAAAExBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq//uQxAAAAANIAAAAAExBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq//uQxAAAAANIAAAAAExBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq//uQxAAAAANIAAAAAExBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq//uQxAAAAANIAAAAAExBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq//uQxAAAAANIAAAAAExBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq//uQxAAAAANIAAAAAExBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq//uQxAAAAANIAAAAAExBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq//uQxAAAAANIAAAAAExBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq//uQxAAAAANIAAAAAExBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq" type="audio/mp3"></audio>

    <div id="modal" class="modal"><div class="modal-box"><h3 id="mt" style="color:#fff">TITLE</h3><p id="mm" style="color:#aaa"></p><button onclick="document.getElementById('modal').style.display='none'" class="btn-daftar" style="padding:10px;width:auto">OK</button></div></div>

    <div class="header"><a href="index.html" class="btn-back">⬅</a><h2>ANTRIAN CHARGING</h2></div>
    <div class="container">
        <div class="card">
            <label>PLAT NOMOR</label><input id="uPlat" placeholder="B 1234 XYZ" style="text-transform:uppercase;">
            <label>WHATSAPP</label><input id="uWa" type="number" placeholder="08xxxxxxxxxx">
            <label>BATERAI (%)</label><input id="uBat" type="number" placeholder="0 - 99">
            <div id="info" style="display:none;text-align:center;color:#ccff00;font-weight:bold;margin-bottom:10px;border:1px solid #ccff00;padding:10px;border-radius:10px;"></div>
            <button class="btn-daftar" id="btnDaftar">DAFTAR ANTRIAN</button>
        </div>
        
        <div style="text-align:center;font-family:'Orbitron';margin-bottom:10px;color:#00bcd4">STATUS 3 SLOT</div>
        <div class="grid" id="slots"><div style="grid-column:1/-1;text-align:center;color:#555;padding:20px">Loading...</div></div>

        <div class="card" style="padding:15px">
            <div style="display:flex;justify-content:space-between;font-weight:bold;color:#fff;margin-bottom:10px"><span>DAFTAR TUNGGU</span><span id="qCount" style="color:#00bcd4">0</span></div>
            <div id="qList"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, runTransaction, setDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        const FONNTE = ["Fc8dWb7jiKr7CXuEZXBx"];
        const FB = { apiKey: "AIzaSyALIlkIDALIk83K8s1htalvW6rmNNw02Go", authDomain: "sistem-antrian-b1c39.firebaseapp.com", projectId: "sistem-antrian-b1c39", storageBucket: "sistem-antrian-b1c39.firebasestorage.app", messagingSenderId: "454124587608", appId: "1:454124587608:web:34fbb0f5211067a67f982d" };
        const db = getFirestore(initializeApp(FB)); const ref = doc(db, "antrian", "utama");
        const aud = document.getElementById('alarm'); let triggered = new Set();

        function prime() { if(aud.paused) { aud.volume=0.01; aud.play().then(()=>{setTimeout(()=>{aud.pause();aud.currentTime=0;aud.volume=1;},100)}).catch(()=>{}); } }
        document.body.addEventListener('click', prime);

        function modal(t,m){ document.getElementById('mt').innerText=t; document.getElementById('mm').innerText=m; document.getElementById('modal').style.display='flex'; }
        function sendWA(t,m,sch=0){
            let p=t.replace(/\D/g,''); if(p.startsWith('0')) p='62'+p.substring(1);
            const fd=new FormData(); fd.append('target',p); fd.append('message',m); fd.append('schedule',sch); fd.append('countryCode','62');
            fetch("https://api.fonnte.com/send",{method:'POST',headers:{'Authorization':FONNTE[0]},body:fd}).catch(()=>{});
        }
        function calcDur(b,t){ let m=0; for(let i=b;i<t;i++){ if(i<50)m+=1; else if(i<80)m+=1.2; else if(i<90)m+=1.5; else m+=2; } return Math.ceil(m); }

        document.getElementById('btnDaftar').onclick = async () => {
            prime();
            const p=document.getElementById('uPlat').value.toUpperCase(); const w=document.getElementById('uWa').value; const b=parseInt(document.getElementById('uBat').value);
            if(!p||!w||isNaN(b)) return modal('ERROR','Isi Data');
            await runTransaction(db, async(t)=>{
                const d=(await t.get(ref)).data()||{}; let s=d.chargingSlots||[null,null,null]; let q=d.waitingQueue||[];
                const antri=q.length; let l=100; if(antri>=10) l=85; else if(antri>=6) l=90; else if(antri>=3) l=95;
                if(b>=l) throw "Baterai Cukup";
                let dur=calcDur(b,l); if(dur<2)dur=2;
                const item={name:p, phone:w, startBattery:b, durationMinutes:dur, targetLimit:l, startTime:null};
                const idx=s.indexOf(null); if(idx!==-1) s[idx]=item; else q.push(item);
                t.set(ref, {chargingSlots:s, waitingQueue:q}, {merge:true});
                if(w) sendWA(w, `*Halo Sahabat MLU!*\nMotor ${p} masuk antrian.`);
            });
            modal('SUKSES','Masuk'); document.getElementById('uPlat').value='';
        };

        window.act = (i, type) => {
            prime();
            runTransaction(db, async(t)=>{
                const d=(await t.get(ref)).data(); let s=d.chargingSlots; let q=d.waitingQueue;
                if(type==='stop') { 
                    s[i]=null; if(q.length>0){ let next=q.shift(); next.targetLimit=(q.length>=3?95:100); next.durationMinutes=calcDur(next.startBattery,next.targetLimit); s[i]=next; }
                } else {
                    s[i].startTime = new Date();
                    if(s[i].phone) {
                        sendWA(s[i].phone, `*Halo Sahabat MLU!*\nMotor ${s[i].name} mulai.`);
                        sendWA(s[i].phone, `*Halo Sahabat MLU!*\nMotor ${s[i].name} selesai.`, Math.floor((Date.now()+s[i].durationMinutes*60000)/1000));
                    }
                }
                t.update(ref, {chargingSlots:s, waitingQueue:q});
            });
        };

        onSnapshot(ref, (snap) => {
            const d=snap.data()||{}; const s=d.chargingSlots||[null,null,null]; const q=d.waitingQueue||[];
            document.getElementById('qCount').innerText = q.length;
            document.getElementById('qList').innerHTML = q.map(x=>`<div style="color:#ccc;padding:5px 0;border-bottom:1px solid #333;display:flex;justify-content:space-between"><b>${x.name}</b><span>${x.startBattery}%</span></div>`).join('');
            const inf = document.getElementById('info');
            if(q.length>0) { inf.style.display='block'; inf.innerHTML=`ANTRIAN: ${q.length} <br> MAX: ${q.length>2?(q.length>5?90:95):100}%`; } else inf.style.display='none';

            document.getElementById('slots').innerHTML = s.map((x,i)=>{
                if(!x) return `<div class="slot"><div class="bat-icon"></div><small style="color:#555;margin-top:20px;">KOSONG</small></div>`;
                const isRun=!!x.startTime;
                let btn = isRun ? `<button class="btn-act btn-stop" onclick="act(${i},'stop')">STOP</button>` : `<button class="btn-act btn-start" style="border-color:#00bcd4;color:#00bcd4" onclick="act(${i},'start')">MULAI</button>`;
                let txt="Tap Mulai"; let h=x.startBattery;
                if(isRun) {
                    const end = (x.startTime.seconds?x.startTime.seconds*1000:new Date(x.startTime).getTime()) + (x.durationMinutes*60000);
                    const diff = end - Date.now();
                    if(diff>0) { const m=Math.floor(diff/60000); const sc=Math.floor((diff%60000)/1000); txt=`${m}:${sc<10?'0'+sc:sc}`; h=100; }
                    else { txt="SELESAI"; const k=x.name+end; if(!triggered.has(k)){ triggered.add(k); aud.play().catch(()=>{}); modal('ALARM', `Motor ${x.name} Selesai!`); } }
                }
                return `<div class="slot ${isRun?'active':''}"><div class="bat-percent">${isRun?100:x.startBattery}%</div><div class="bat-wrap"><div class="bat-icon"><div class="bat-fill" style="height:${h}%"></div><div class="bat-bolt">⚡</div></div></div><div class="plat-text">${x.name}</div><div style="font-size:10px;color:#888">Target: ${x.targetLimit}%</div><div class="timer" style="color:${txt==='SELESAI'?'#ff3b3b':'#00bcd4'}">${txt}</div>${btn}</div>`;
            }).join('');
        });
        
        setInterval(()=>{ const s=document.getElementById('slots'); if(s) s.style.opacity=s.style.opacity==='0.99'?'1':'0.99'; }, 1000);
    </script>
</body>
</html>
