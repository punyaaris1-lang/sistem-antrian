<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ANTRIAN CHARGING</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- STYLE GLOBAL (Dark Cyberpunk) --- */
        body { 
            margin: 0; font-family: 'Rajdhani', sans-serif; 
            background-color: #0b101a; color: #fff; padding-bottom: 100px; 
            background-image: url('1763947427555.jpg'); background-size: cover; background-attachment: fixed;
        }
        body::before { content:''; position:fixed; inset:0; background:rgba(11, 16, 26, 0.95); z-index:-1; }

        /* HEADER */
        .header { 
            padding: 15px; display: flex; align-items: center; gap: 15px; 
            background: rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.1);
            position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px);
        }
        .btn-back { text-decoration: none; font-size: 24px; color: #00bcd4; width: 40px; height: 40px; border: 1px solid #00bcd4; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        h2 { margin: 0; font-family: 'Orbitron'; font-size: 18px; letter-spacing: 1px; }

        /* CONTAINER */
        .container { padding: 20px; max-width: 480px; margin: 0 auto; }

        /* CARD FORM */
        .card { 
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 20px; padding: 25px; margin-bottom: 25px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }
        label { display: block; font-family: 'Orbitron'; font-size: 10px; color: #8899a6; margin-bottom: 8px; letter-spacing: 1px; }
        input { 
            width: 100%; padding: 15px; background: rgba(0,0,0,0.3); border: 1px solid #333; 
            border-radius: 12px; text-align: center; font-size: 20px; font-weight: 700; 
            color: #fff; margin-bottom: 15px; outline: none; font-family: 'Rajdhani'; 
        }
        input:focus { border-color: #00bcd4; }
        .btn-daftar { width: 100%; padding: 18px; background: #00bcd4; color: #000; border: none; border-radius: 12px; font-family: 'Orbitron'; font-weight: 900; font-size: 16px; cursor: pointer; margin-top: 10px; }
        
        /* INFO BOX (Sudah Diperbaiki) */
        .info-box { 
            text-align: center; padding: 15px; border-radius: 12px; 
            background: rgba(204, 255, 0, 0.1); border: 2px solid #ccff00; 
            color: #ccff00; font-family: 'Orbitron'; font-weight: bold; font-size: 12px;
            margin-bottom: 15px; display: none; line-height: 1.6;
            box-shadow: 0 0 15px rgba(204, 255, 0, 0.2);
        }

        .status-head { text-align: center; font-family: 'Orbitron'; font-weight: bold; margin-bottom: 15px; color: #00bcd4; font-size: 12px; letter-spacing: 2px; }

        /* GRID SLOT */
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 30px; }
        .slot { 
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 15px; padding: 10px 5px; text-align: center; height: 260px; 
            display: flex; flex-direction: column; justify-content: flex-start; position: relative;
            overflow: hidden;
        }
        .slot.active { border-color: #00bcd4; background: rgba(0, 188, 212, 0.05); }

        /* BATTERY ICON (FIX CENTER) */
        .bat-wrap { height: 90px; display: flex; align-items: center; justify-content: center; }
        .bat-icon { 
            width: 40px; height: 70px; border: 3px solid #555; border-radius: 6px; 
            position: relative; display: flex; align-items: flex-end; padding: 3px;
        }
        /* Perbaikan Posisi Kepala Baterai */
        .bat-icon::before { 
            content: ''; position: absolute; top: -7px; left: 50%; transform: translateX(-50%);
            width: 16px; height: 5px; background: #555; border-radius: 3px 3px 0 0;
        }
        .bat-fill { width: 100%; background: #00bcd4; border-radius: 2px; transition: height 0.5s; }
        .bat-bolt { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 28px; color: #fff; z-index: 2; text-shadow: 0 0 5px #000; }

        .plat-text { font-weight: 800; font-size: 14px; color: #fff; margin: 0; text-transform: uppercase; }
        .target-text { font-size: 10px; color: #888; margin-bottom: 5px; }
        .timer-text { font-size: 18px; font-weight: 700; color: #00bcd4; font-family: 'Orbitron'; margin-bottom: 5px; }
        .kosong-text { font-size: 12px; color: #555; font-weight: bold; }

        .btn-act { width: 100%; padding: 8px; border-radius: 6px; border: none; font-weight: 800; cursor: pointer; font-size: 10px; font-family: 'Orbitron'; margin-top: auto; }
        .btn-start { border-color: #00bcd4; color: #00bcd4; border: 1px solid; background: transparent; }
        .btn-stop { background: rgba(255, 59, 59, 0.2); color: #ff3b3b; border: 1px solid #ff3b3b; }

        /* WAITING LIST */
        .wait-row { display: flex; justify-content: space-between; padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); color: #ccc; font-size: 14px; }

        /* MODAL ADMIN */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; }
        .modal-box { background: #0b101a; border: 2px solid #00bcd4; padding: 25px; border-radius: 20px; width: 85%; max-width: 300px; text-align: center; box-shadow: 0 0 30px rgba(0, 188, 212, 0.2); }
        .modal-btn { width: 100%; padding: 12px; background: #00bcd4; color: #000; border: none; border-radius: 8px; font-weight: bold; margin-top: 15px; cursor: pointer; }
        .admin-p { display: none; background: #111; padding: 20px; border: 1px solid #ff3b3b; border-radius: 15px; margin-top: 20px; }
    </style>
</head>
<body>

    <audio id="alarm" loop><source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>
    <video id="fakeVideo" loop muted playsinline style="width:1px;height:1px;opacity:0;position:fixed;pointer-events:none;"><source src="https://www.w3schools.com/html/mov_bbb.mp4"></video>

    <div id="mod" class="modal">
        <div class="modal-box">
            <h3 id="mt" style="color:#fff;margin:0 0 10px;font-family:'Orbitron'">TITLE</h3>
            <p id="mm" style="color:#aaa;margin:0;font-size:14px;"></p>
            <div id="modalInputArea" style="display:none;margin-top:15px;">
                <input type="password" id="adminPinInput" placeholder="PIN" style="margin:0;font-size:16px;">
            </div>
            <button id="modalActionBtn" class="modal-btn">OK</button>
        </div>
    </div>

    <div class="header">
        <a href="index.html" class="btn-back">⬅</a>
        <h2>ANTRIAN CHARGING</h2>
    </div>

    <div class="container">
        <div class="card">
            <label>PLAT NOMOR</label><input id="uPlat" placeholder="B 1234 XYZ" style="text-transform:uppercase;">
            <label>WHATSAPP</label><input id="uWa" type="number" placeholder="08xxxxxxxxxx">
            <label>BATERAI (%)</label><input id="uBat" type="number" placeholder="0 - 99">
            <div id="info" class="info-box"></div>
            <button class="btn-daftar" id="btnDaftar">DAFTAR ANTRIAN</button>
        </div>

        <div class="status-head">STATUS 3 SLOT</div>
        <div class="grid" id="slots"></div>

        <div class="card" style="padding:0;">
            <div style="padding:15px; border-bottom:1px solid rgba(255,255,255,0.1); display:flex; justify-content:space-between; font-weight:bold;">
                <span style="color:#fff; font-family:'Orbitron'; font-size:12px;">DAFTAR TUNGGU</span>
                <span id="qCount" style="color:#00bcd4">0</span>
            </div>
            <div id="qList" style="padding:0 15px;"></div>
        </div>
        
        <div style="text-align:center; color:#555; font-size:10px; margin-top:30px; cursor:pointer; letter-spacing:2px;" onclick="showAdminLogin()">🔒 ADMIN CONTROL</div>
        <div id="admPan" class="admin-p">
            <h4 style="color:#ff3b3b; text-align:center; margin:0 0 15px; font-family:'Orbitron'">MASTER CONTROL</h4>
            <button onclick="clrSlot()" class="modal-btn" style="background:#444; color:#fff; margin-top:5px;">HAPUS SLOT (Pilih Manual)</button>
            <select id="mSlot" style="width:100%; padding:10px; background:#000; color:#fff; border:1px solid #444; margin-top:5px; border-radius:8px;"><option value="0">Slot 1</option><option value="1">Slot 2</option><option value="2">Slot 3</option></select>
            <button onclick="fillQ()" class="modal-btn" style="background:#00bcd4;">NAIKKAN ANTRIAN</button>
            <button onclick="startAll()" class="modal-btn" style="background:#fff; color:#000;">⚡ START ALL</button>
            <button onclick="resAll()" class="modal-btn" style="background:transparent; border:1px solid #ff3b3b; color:#ff3b3b;">RESET DATA</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, runTransaction, setDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        const FONNTE = ["Fc8dWb7jiKr7CXuEZXBx"];
        const FB = { apiKey: "AIzaSyALIlkIDALIk83K8s1htalvW6rmNNw02Go", authDomain: "sistem-antrian-b1c39.firebaseapp.com", projectId: "sistem-antrian-b1c39", storageBucket: "sistem-antrian-b1c39.firebasestorage.app", messagingSenderId: "454124587608", appId: "1:454124587608:web:34fbb0f5211067a67f982d" };
        const app = initializeApp(FB); const db = getFirestore(app); const ref = doc(db, "antrian", "utama");
        
        let isAdmin = false; let triggered = new Set(); 
        const aud = document.getElementById('alarm'); const vid = document.getElementById('fakeVideo');

        // UI MODAL
        function showModal(t, m, act=null, inp=false) {
            const mod=document.getElementById('mod'); document.getElementById('mt').innerText=t; document.getElementById('mm').innerText=m;
            document.getElementById('modalInputArea').style.display=inp?'block':'none';
            if(inp)document.getElementById('adminPinInput').value='';
            document.getElementById('modalActionBtn').onclick=()=>{if(act)act();else mod.style.display='none';};
            mod.style.display='flex';
        }
        window.showAdminLogin=()=>{showModal("ADMIN","PIN:",()=>{if(document.getElementById('adminPinInput').value==='1131'){document.getElementById('mod').style.display='none';document.getElementById('admPan').style.display='block';isAdmin=true;}else alert("SALAH")},true)};
        window.closeModal=()=>{document.getElementById('mod').style.display='none'};

        function prime() { if(aud.paused){aud.play().then(()=>{setTimeout(()=>{aud.pause();aud.currentTime=0},100)}).catch(()=>{});} if(vid.paused)vid.play().catch(()=>{}); }
        document.body.addEventListener('click', prime);

        function sendWA(target, msg, sch=null) {
            let p = target.replace(/\D/g,''); if(p.startsWith('0')) p='62'+p.substring(1);
            const fd = new FormData(); fd.append("target", p); fd.append("message", msg); fd.append("countryCode", "62");
            if(sch) fd.append("schedule", Math.floor(new Date(sch).getTime()/1000)); else fd.append("schedule", "0");
            try { fetch("https://api.fonnte.com/send", { method: "POST", headers: { "Authorization": FONNTE[0] }, body: fd }); } catch(e){}
        }
        function msg(t,p,e="") { return `*Halo Sahabat MLU!*\n\n${t} *${p}* ${e}.\n\nPesan ini dikirim otomatis oleh Admin MLU.`; }

        // RUMUS DURASI BARU (SESUAI FOTO)
        function calcDur(bat, target) {
            let m = 0;
            for(let i=bat; i<target; i++) {
                if(i<50) m+=1.0; else if(i<80) m+=1.2; else if(i<90) m+=1.5; else m+=2.0;
            }
            return Math.ceil(m);
        }

        document.getElementById('btnDaftar').onclick = async () => {
            prime();
            const p=document.getElementById('uPlat').value.toUpperCase(); const w=document.getElementById('uWa').value; const b=parseInt(document.getElementById('uBat').value);
            if(!p||!w||isNaN(b)) return showModal('ERROR','Isi Semua Data');
            
            await runTransaction(db, async(t)=>{
                const d=(await t.get(ref)).data()||{}; let s=d.chargingSlots||[null,null,null]; let q=d.waitingQueue||[];
                if(s.some(x=>x?.name===p)||q.some(x=>x?.name===p)) throw "Sudah Ada";
                
                // LOGIKA ANTRIAN: HANYA HITUNG JUMLAH Q
                const antri = q.length; 
                let limit = 100;
                if(antri >= 10) limit = 85; else if(antri >= 6) limit = 90; else if(antri >= 3) limit = 95;
                
                if(b >= limit) throw "Baterai Cukup";
                let dur = calcDur(b, limit); if(dur<2) dur=2;
                
                const item={name:p, phone:w, startBattery:b, durationMinutes:dur, targetLimit:limit, startTime:null};
                const idx=s.indexOf(null); if(idx!==-1) s[idx]=item; else q.push(item);
                
                t.set(ref, {chargingSlots:s, waitingQueue:q}, {merge:true});
                if(w) sendWA(w, msg("Motor", p, "masuk antrian"));
            });
            showModal('SUKSES','Masuk Antrian'); document.getElementById('uPlat').value='';
        };

        window.act = (i, type, pName) => {
            prime();
            runTransaction(db, async(t)=>{
                const d=(await t.get(ref)).data(); let s=d.chargingSlots; let q=d.waitingQueue;
                if(type==='stop') { 
                    s[i]=null; 
                    // AUTO FILL: JIKA ADA ANTRIAN, MASUKKAN KE SLOT KOSONG
                    if(q.length > 0) {
                        let next = q.shift();
                        // Hitung ulang target/durasi based on antrian SISA
                        const sisaAntri = q.length;
                        let newLimit = 100; 
                        if(sisaAntri >= 10) newLimit = 85; else if(sisaAntri >= 6) newLimit = 90; else if(sisaAntri >= 3) newLimit = 95;
                        
                        let newDur = calcDur(next.startBattery, newLimit); if(newDur<2) newDur=2;
                        next.targetLimit = newLimit; next.durationMinutes = newDur;
                        s[i] = next;
                    }
                } else {
                    s[i].startTime = new Date();
                    if(s[i].phone) {
                        sendWA(s[i].phone, msg("Motor", s[i].name, "mulai dicas"));
                        const end = new Date(Date.now()+s[i].durationMinutes*60000);
                        sendWA(s[i].phone, msg("Motor", s[i].name, "selesai"), end);
                    }
                }
                t.update(ref, {chargingSlots:s, waitingQueue:q});
            });
        };

        // RENDER UI
        onSnapshot(ref, (snap) => {
            const d=snap.data()||{}; const s=d.chargingSlots||[null,null,null]; const q=d.waitingQueue||[];
            document.getElementById('qCount').innerText = q.length;
            document.getElementById('qList').innerHTML = q.map((x,i)=>`<div class="wait-row"><div><b>${x.name}</b> (${x.startBattery}%)</div><div style="cursor:pointer;color:#ff3b3b" onclick="delQ(${i},'${x.name}')">✕</div></div>`).join('');
            
            const inf = document.getElementById('info');
            if(q.length>0) { 
                let l=100; if(q.length>=10) l=85; else if(q.length>=6) l=90; else if(q.length>=3) l=95;
                inf.style.display='block'; inf.innerHTML=`ANTRIAN: ${q.length} UNIT<br>BATAS CAS: ${l}%`; 
            } else inf.style.display='none';

            document.getElementById('slots').innerHTML = s.map((x,i)=>{
                if(!x) return `<div class="slot"><div class="bat-wrap"><div class="bat-icon"></div></div><div class="kosong-text">KOSONG</div></div>`;
                const isRun=!!x.startTime;
                let btn = isRun ? `<button class="btn-act btn-stop" onclick="act(${i},'stop','${x.name}')">STOP</button>` : `<button class="btn-act btn-start" onclick="act(${i},'start','${x.name}')">MULAI</button>`;
                let txt="Tap Mulai"; let h=x.startBattery;
                if(isRun) {
                    // TIMER PINTAR: MENGHITUNG SELISIH WAKTU SERVER
                    const end = (x.startTime.seconds?x.startTime.seconds*1000:new Date(x.startTime).getTime()) + (x.durationMinutes*60000);
                    const diff = end - Date.now();
                    if(diff>0) { const m=Math.floor(diff/60000); const sc=Math.floor((diff%60000)/1000); txt=`${m}:${sc<10?'0'+sc:sc}`; h=100; }
                    else { txt="SELESAI"; const k=x.name+end; if(!triggered.has(k)){ triggered.add(k); aud.play().catch(()=>{}); showModal('ALARM', `Motor ${x.name} Selesai!`); } }
                }
                return `<div class="slot ${isRun?'active':''}">
                    <div class="bat-percent">${isRun?100:x.startBattery}%</div>
                    <div class="bat-wrap"><div class="bat-icon"><div class="bat-fill" style="height:${h}%"></div><div class="bat-bolt">⚡</div></div></div>
                    <div class="slot-content">
                        <div class="plat-text">${x.name}</div>
                        <div class="target-text">Target: ${x.targetLimit}%</div>
                        <div class="timer-text" style="color:${txt==='SELESAI'?'#ff3b3b':'#00bcd4'}">${txt}</div>
                        ${btn}
                    </div>
                </div>`;
            }).join('');
        });

        // TIMER LOOP (SELF CORRECTING)
        setInterval(()=>{ 
            // Trigger UI update manual agar timer jalan di layar tanpa perlu fetch database
            const s = document.getElementById('slots'); if(s) s.style.opacity = s.style.opacity==='0.99'?'1':'0.99';
        }, 1000);

        // ADMIN
        window.clrSlot=()=>{const i=document.getElementById('mSlot').value; runTransaction(db,async(t)=>{const s=(await t.get(ref)).data().chargingSlots;s[i]=null;t.update(ref,{chargingSlots:s})});};
        window.fillQ=()=>{runTransaction(db,async(t)=>{const d=(await t.get(ref)).data();let s=d.chargingSlots;let q=d.waitingQueue;if(q.length>0&&s.includes(null)){s[s.indexOf(null)]=q.shift();t.update(ref,{chargingSlots:s,waitingQueue:q})}});};
        window.startAll=()=>{runTransaction(db,async(t)=>{const s=(await t.get(ref)).data().chargingSlots; s.forEach((x,i)=>{if(x&&!x.startTime)window.act(i,'start')});});};
        window.resAll=()=>{if(confirm('RESET?')) setDoc(ref,{chargingSlots:[null,null,null],waitingQueue:[],blockedList:[]});};
        window.blockUser=async()=>{const p=document.getElementById('blockPlatInput').value.toUpperCase().trim();if(!p)return;await runTransaction(db,async(t)=>{const d=(await t.get(ref)).data();const l=d.blockedList||[];if(!l.includes(p))l.push(p);t.update(ref,{blockedList:l});});showModal('BLOKIR',`Plat ${p} diblokir.`);};
        window.delQ=(i,name)=>{if(isAdmin||localStorage.getItem('myPlat')===name) runTransaction(db,async(t)=>{const q=(await t.get(ref)).data().waitingQueue;q.splice(i,1);t.update(ref,{waitingQueue:q});}); else showModal('AKSES DITOLAK','Bukan antrian Anda!');};
    </script>
</body>
</html>
