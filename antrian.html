    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, runTransaction, setDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        // --- KONFIGURASI ---
        const FONNTE_TOKEN = "Fc8dWb7jiKr7CXuEZXBx"; // Token Anda
        const FB = { apiKey: "AIzaSyALIlkIDALIk83K8s1htalvW6rmNNw02Go", authDomain: "sistem-antrian-b1c39.firebaseapp.com", projectId: "sistem-antrian-b1c39", storageBucket: "sistem-antrian-b1c39.firebasestorage.app", messagingSenderId: "454124587608", appId: "1:454124587608:web:34fbb0f5211067a67f982d" };
        
        const app = initializeApp(FB); 
        const db = getFirestore(app); 
        const ref = doc(db, "antrian", "utama");
        
        let isAdmin = false; 
        let triggered = new Set(); 
        const aud = document.getElementById('alarm');
        let wakeLock = null;

        // --- FUNGSI AKTIVASI AUDIO & WAKELOCK ---
        window.activateSystem = async () => {
            aud.volume = 1.0;
            try { await aud.play(); aud.pause(); aud.currentTime = 0; } catch (e) {}
            try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
            document.getElementById('activation-overlay').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
        };

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e){}
            }
        });

        // --- FUNGSI SEND WA (DENGAN SCHEDULING) ---
        function sendWA(target, message, scheduleTime = null) {
            let p = target.replace(/\D/g,''); 
            if(p.startsWith('0')) p='62'+p.substring(1);
            
            const fd = new FormData(); 
            fd.append("target", p); 
            fd.append("message", message); 
            fd.append("countryCode", "62");
            
            // JIKA ADA SCHEDULE, FONNTE AKAN MENYIMPAN PESAN DAN BARU KIRIM NANTI
            if (scheduleTime) {
                // Convert timestamp ms ke unix timestamp (detik) untuk Fonnte
                // Fonnte butuh format YYYY-MM-DD HH:mm:ss atau Unix Timestamp dalam detik
                const unixTime = Math.floor(scheduleTime / 1000);
                fd.append("schedule", unixTime);
                console.log("WA Dijadwalkan untuk:", new Date(scheduleTime));
            }

            try { 
                fetch("https://api.fonnte.com/send", { 
                    method: "POST", 
                    headers: { "Authorization": FONNTE_TOKEN }, 
                    body: fd 
                }); 
            } catch(e){ console.log("WA Error", e); }
        }

        function msg(t,p,e="") { return `*Halo Sahabat MLU!*\n\n${t} *${p}* ${e}.\n\nPesan ini dikirim otomatis oleh Admin MLU.`; }

        // --- LOGIKA REAL-TIME ---
        const slotState = { 0: {lp:null, lt:null}, 1: {lp:null, lt:null}, 2: {lp:null, lt:null} };
        function updateRealTimeCharging(slotIdx, percentNow, targetLimit) {
            const now = Date.now(); const state = slotState[slotIdx];
            if (state.lp === null || percentNow < state.lp) { state.lp = percentNow; state.lt = now; return null; }
            if (percentNow > state.lp) {
                const timeDiffSec = (now - state.lt) / 1000; const diffPercent = percentNow - state.lp;
                const timePerPercent = timeDiffSec / diffPercent;
                const remainingPercent = targetLimit - percentNow;
                const etaSec = remainingPercent * timePerPercent;
                state.lp = percentNow; state.lt = now;
                return etaSec;
            }
            return null;
        }

        // --- HELPER ---
        function calculateDuration(bat, target) { let min = 0; for (let i = bat; i < target; i++) { if (i < 50) min += 1.0; else if (i < 80) min += 1.2; else if (i < 90) min += 1.5; else min += 2.0; } return Math.ceil(min); }
        function showModal(title, msg, action=null, showInput=false) {
            const mod = document.getElementById('mod'); document.getElementById('mt').innerText = title; document.getElementById('mm').innerText = msg;
            const inp = document.getElementById('adminPinInput'); const btn = document.getElementById('modalActionBtn');
            inp.style.display = showInput ? 'block' : 'none'; if(showInput) inp.value = '';
            btn.onclick = () => { if(action) action(); else stopAlarm(); }; mod.style.display = 'flex';
        }
        window.stopAlarm = () => { aud.pause(); aud.currentTime = 0; document.getElementById('mod').style.display = 'none'; };
        window.showAdminLogin = () => { showModal("ADMIN LOGIN", "PIN:", () => { if(document.getElementById('adminPinInput').value === '1131') { document.getElementById('mod').style.display='none'; document.getElementById('admPan').style.display='block'; isAdmin=true; } else alert("PIN SALAH!"); }, true); };

        // --- BUTTON HANDLERS ---
        document.getElementById('btnDaftar').onclick = async () => {
            const p = document.getElementById('uPlat').value.toUpperCase(); const w = document.getElementById('uWa').value; const b = parseInt(document.getElementById('uBat').value);
            if(!p || !w || isNaN(b)) return showModal('ERROR','Isi Semua Data');
            await runTransaction(db, async(t)=>{
                const d=(await t.get(ref)).data()||{}; let s=d.chargingSlots||[null,null,null]; let q=d.waitingQueue||[];
                if(s.some(x=>x?.name===p)||q.some(x=>x?.name===p)) throw "Sudah Ada";
                const antri = q.length; let limit = 100; if(antri >= 10) limit = 85; else if(antri >= 6) limit = 90; else if(antri >= 3) limit = 95;
                if(b >= limit) throw "Baterai Cukup";
                let dur = calculateDuration(b, limit); if(dur<2) dur=2;
                const item={name:p, phone:w, startBattery:b, durationMinutes:dur, targetLimit:limit, startTime:null};
                const idx=s.indexOf(null); if(idx!==-1) s[idx]=item; else q.push(item);
                t.set(ref, {chargingSlots:s, waitingQueue:q}, {merge:true});
                
                // Kirim WA Konfirmasi Masuk Antrian (Langsung)
                if(w) sendWA(w, msg("Motor", p, "berhasil masuk antrian. Mohon menunggu giliran"));
            });
            showModal('SUKSES','Masuk Antrian'); document.getElementById('uPlat').value='';
        };

        // --- FUNGSI ACT (MODIFIKASI PENTING) ---
        window.act = (i, type) => {
            runTransaction(db, async(t)=>{
                const d=(await t.get(ref)).data(); let s=d.chargingSlots; let q=d.waitingQueue;
                
                if(type === 'stop') { 
                    s[i]=null; slotState[i] = {lp:null, lt:null};
                    // Jika ada antrian, masukkan ke slot
                    if(q.length > 0) {
                        let nextUser = q.shift(); const antri = q.length; let limit = 100; if(antri >= 10) limit = 85; else if(antri >= 6) limit = 90; else if(antri >= 3) limit = 95;
                        let dur = calculateDuration(nextUser.startBattery, limit); if(dur<2) dur=2; nextUser.targetLimit = limit; nextUser.durationMinutes = dur; s[i] = nextUser;
                    }
                } else { 
                    // SAAT TOMBOL MULAI DITEKAN
                    s[i].startTime = new Date(); 
                    slotState[i] = {lp: s[i].startBattery, lt: Date.now()};
                    
                    if(s[i].phone) {
                        // 1. Kirim WA "Mulai" (Langsung)
                        sendWA(s[i].phone, msg("Motor", s[i].name, "Mulai Dicas Sekarang"));
                        
                        // 2. JADWALKAN WA "Selesai" (Langsung kirim request ke Fonnte utk masa depan)
                        // Hitung waktu selesai dalam miliseconds
                        const durationMs = s[i].durationMinutes * 60 * 1000;
                        const endTimeMs = Date.now() + durationMs;
                        
                        // Kirim request ke Fonnte dengan parameter 'schedule'
                        // Pesan ini akan "disimpan" Fonnte dan dikirim otomatis nanti, meski HP mati.
                        sendWA(s[i].phone, msg("Motor", s[i].name, "SUDAH SELESAI (Penuh/Limit). Silakan dipindahkan"), endTimeMs);
                    }
                }
                t.update(ref, {chargingSlots:s, waitingQueue:q});
            });
        };

        window.clrSlot=()=>{const i=document.getElementById('mSlot').value; runTransaction(db,async(t)=>{const s=(await t.get(ref)).data().chargingSlots;s[i]=null; slotState[i]={lp:null,lt:null}; t.update(ref,{chargingSlots:s})});};
        window.fillQ=()=>{runTransaction(db,async(t)=>{const d=(await t.get(ref)).data();let s=d.chargingSlots;let q=d.waitingQueue;if(q.length>0 && s.includes(null)){s[s.indexOf(null)]=q.shift();t.update(ref,{chargingSlots:s,waitingQueue:q})}} );};
        window.startAll=()=>{runTransaction(db,async(t)=>{const s=(await t.get(ref)).data().chargingSlots; s.forEach((x,i)=>{if(x&&!x.startTime) window.act(i,'start') }); });};
        window.stopAll=()=>{runTransaction(db,async(t)=>{const s=(await t.get(ref)).data().chargingSlots; s.forEach((x,i)=>{if(x) window.act(i,'stop') }); });};
        window.resAll=()=>{if(confirm('RESET?')) setDoc(ref,{chargingSlots:[null,null,null],waitingQueue:[],blockedList:[]});};
        window.blockUser=async()=>{const p=document.getElementById('blockPlatInput').value.toUpperCase().trim();if(!p)return;await runTransaction(db,async(t)=>{const d=(await t.get(ref)).data();const l=d.blockedList||[];if(!l.includes(p))l.push(p);t.update(ref,{blockedList:l});});showModal('BLOKIR',`Plat ${p} diblokir.`);};
        window.delQ=(i,name)=>{if(isAdmin||localStorage.getItem('myPlat')===name) runTransaction(db,async(t)=>{const q=(await t.get(ref)).data().waitingQueue;q.splice(i,1);t.update(ref,{waitingQueue:q});}); else showModal('AKSES DITOLAK', 'Bukan antrian Anda!');};

        onSnapshot(ref, (snap) => {
            const d=snap.data()||{}; const s=d.chargingSlots||[null,null,null]; const q=d.waitingQueue||[];
            document.getElementById('qCount').innerText = q.length;
            document.getElementById('qList').innerHTML = q.map((x,i)=>`<div class="wait-row"><div><b>${x.name}</b> (${x.startBattery}%)</div><div style="color:${isAdmin?'#ff3b3b':'#888'}; font-weight:bold; cursor:pointer;" onclick="delQ(${i}, '${x.name}')">✕</div></div>`).join('');
            const inf = document.getElementById('info');
            if(q.length>0) { let l=100; const total = q.length + s.filter(x=>x!==null).length; if(total>=10) l=85; else if(total>=6) l=90; else if(total>=3) l=95; inf.style.display='block'; inf.innerHTML=`ANTRIAN: ${q.length} UNIT<br>MAX CHARGE: ${l}%`; } else inf.style.display='none';

            document.getElementById('slots').innerHTML = s.map((x,i)=>{
                if(!x) { slotState[i] = {lp:null, lt:null}; return `<div class="slot"><div class="bat-wrap"><div class="bat-icon"></div></div><small style="color:#888">KOSONG</small></div>`; }
                const isRun=!!x.startTime;
                if(isRun) updateRealTimeCharging(i, x.startBattery, x.targetLimit);

                let btn = isRun ? `<button class="btn-act btn-stop" onclick="act(${i},'stop')">STOP</button>` : `<button class="btn-act btn-start" onclick="act(${i},'start')">MULAI</button>`;
                let txt="Tap Mulai"; let h=x.startBattery; let cssClass=""; let endTime = 0;
                if(isRun) {
                    endTime = (x.startTime.seconds?x.startTime.seconds*1000:new Date(x.startTime).getTime()) + (x.durationMinutes*60000);
                    const diff = endTime - Date.now();
                    if(diff>0) { const m=Math.floor(diff/60000); const sc=Math.floor((diff%60000)/1000); txt=`${m}:${sc<10?'0'+sc:sc}`; h=100; } 
                    else { 
                        txt="SELESAI"; cssClass="done"; const k=x.name+endTime; 
                        // Cek triggered hanya agar alarm bunyi SEKALI, tapi tidak mempengaruhi WA karena WA sudah dijadwal di awal
                        if(!triggered.has(k)){ triggered.add(k); aud.volume=1.0; aud.play().catch(e=>console.log(e)); showModal('ALARM', `Motor ${x.name} Selesai!`); } 
                    }
                }
                return `<div class="slot ${isRun?'active':''}"><div class="bat-percent">${isRun?100:x.startBattery}%</div><div class="bat-wrap"><div class="bat-icon"><div class="bat-fill" style="height:${h}%"></div><div class="bat-bolt">⚡</div></div></div><div class="plat-text">${x.name}</div><div style="font-size:10px; color:#888;">Target: ${x.targetLimit}%</div><div class="timer-text ${cssClass}" data-end="${endTime}" data-name="${x.name}">${txt}</div>${btn}</div>`;
            }).join('');
        });

        // Loop UI Update (Visual Only)
        setInterval(() => {
            document.querySelectorAll('.timer-text').forEach(el => {
                const end = parseInt(el.getAttribute('data-end'));
                if(end > 0) {
                    const diff = end - Date.now();
                    if(diff > 0) { const m=Math.floor(diff/60000); const sc=Math.floor((diff%60000)/1000); el.innerText = `${m}:${sc<10?'0'+sc:sc}`; el.classList.remove('done'); } 
                    else { if(el.innerText !== "SELESAI") { el.innerText = "SELESAI"; el.classList.add('done'); const name = el.getAttribute('data-name'); const key = name + end; if(!triggered.has(key)) { triggered.add(key); aud.volume=1.0; aud.play().catch(e=>console.log(e)); showModal('ALARM', `Motor ${name} Selesai!`); } } }
                }
            });
        }, 1000);
    </script>
