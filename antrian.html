<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ANTRIAN CHARGING</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        /* === GLOBAL THEME: DEEP SPACE BLUE === */
        :root {
            --neon-blue: #00f3ff;
            --deep-blue: #0a192f;
            --glass-bg: rgba(10, 25, 47, 0.7);
            --glass-border: rgba(0, 243, 255, 0.3);
            --danger: #ff2a6d;
        }

        body { 
            margin: 0; font-family: 'Rajdhani', sans-serif; 
            background-color: #050b14; color: #fff; padding-bottom: 80px; 
            background-image: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('1763947427555.jpg'); 
            background-size: cover; background-position: center; background-attachment: fixed;
            -webkit-tap-highlight-color: transparent;
        }

        .header { 
            padding: 15px; display: flex; align-items: center; gap: 15px; 
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border); 
            position: sticky; top: 0; z-index: 100; box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
        }
        .btn-back { 
            text-decoration: none; font-size: 20px; color: var(--neon-blue); 
            width: 35px; height: 35px; border: 1px solid var(--neon-blue); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }
        h2 { margin: 0; font-family: 'Orbitron'; font-size: 16px; color: #fff; letter-spacing: 2px; }

        .container { padding: 15px; max-width: 480px; margin: 0 auto; }

        /* FORM COMPACT */
        .card { 
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px; padding: 20px; margin-bottom: 20px; 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        label { display: block; font-family: 'Orbitron'; font-size: 10px; color: var(--neon-blue); margin-bottom: 5px; text-transform: uppercase; }
        input { 
            width: 100%; padding: 10px; background: rgba(0, 0, 0, 0.4); 
            border: 1px solid #333; border-radius: 8px; 
            text-align: center; font-size: 16px; font-weight: 700; color: #fff; 
            margin-bottom: 10px; outline: none; font-family: 'Rajdhani';
        }
        input:focus { border-color: var(--neon-blue); box-shadow: 0 0 10px rgba(0, 243, 255, 0.2); }
        
        .btn-daftar { 
            width: 100%; padding: 12px; background: linear-gradient(90deg, #00c6ff, #0072ff); 
            color: #fff; border: none; border-radius: 8px; font-family: 'Orbitron'; font-weight: 900; font-size: 14px; 
            cursor: pointer; margin-top: 5px; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(0, 114, 255, 0.4);
        }

        /* SLOT GRID COMPACT */
        .status-head { text-align: center; font-family: 'Orbitron'; font-weight: bold; margin-bottom: 10px; color: #fff; font-size: 12px; letter-spacing: 2px; }
        
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
        
        .slot { 
            background: rgba(0, 10, 20, 0.6); border: 1px solid var(--glass-border); 
            border-radius: 12px; padding: 8px 4px; text-align: center; 
            height: 230px; 
            display: flex; flex-direction: column; position: relative; overflow: hidden;
        }
        .slot.active { background: rgba(0, 243, 255, 0.05); border-color: var(--neon-blue); box-shadow: 0 0 15px rgba(0, 243, 255, 0.15); }

        .slot-label-top { font-size: 9px; color: #888; font-weight: bold; margin-bottom: 5px; font-family: 'Orbitron'; border-bottom: 1px solid #333; padding-bottom: 2px; text-transform: uppercase;}
        .slot.active .slot-label-top { color: var(--neon-blue); border-color: var(--neon-blue); }

        /* BATERAI COMPACT */
        .bat-wrap { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; padding: 5px 0; }
        .bat-icon { 
            width: 40px; height: 70px; 
            border: 2px solid #fff; border-radius: 6px; 
            position: relative; display: flex; align-items: flex-end; padding: 3px; box-sizing: border-box;
            background: rgba(255,255,255,0.05);
        }
        .bat-icon::before { content: ''; position: absolute; top: -5px; left: 50%; margin-left: -8px; width: 16px; height: 3px; background: #fff; border-radius: 3px 3px 0 0; }
        
        .bat-fill { width: 100%; background: #00e5ff; border-radius: 2px; transition: height 0.5s; box-shadow: 0 0 10px var(--neon-blue); }
        .bat-bolt { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 28px; color: #fff; z-index: 2; text-shadow: 0 0 5px #000; }

        .bat-percent { font-family: 'Orbitron'; font-size: 16px; font-weight: bold; margin-top: 2px; color: #fff; }
        .target-limit-badge { 
            position: absolute; top: -18px; right: -8px; 
            background: #000; border: 1px solid var(--neon-blue); color: var(--neon-blue); 
            font-size: 8px; padding: 1px 4px; border-radius: 4px; font-family: 'Orbitron';
        }

        .plat-text { font-weight: 800; font-size: 13px; margin: 3px 0; text-transform: uppercase; color: #fff; }
        .timer-text { font-size: 16px; font-weight: 700; color: var(--neon-blue); font-family: 'Orbitron'; margin-bottom: 5px; }
        
        /* TOMBOL KECIL */
        .btn-act { 
            width: 100%; padding: 8px; border-radius: 6px; font-weight: 800; cursor: pointer; font-size: 10px; font-family: 'Orbitron'; 
            margin-top: auto; transition: 0.2s; border: none;
        }
        .btn-start { background: transparent; border: 1px solid var(--neon-blue); color: var(--neon-blue); }
        .btn-stop { background: rgba(255, 42, 109, 0.1); border: 1px solid var(--danger); color: var(--danger); }
        
        /* EMPTY STATE */
        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #444; }
        .empty-icon { font-size: 24px; margin-bottom: 5px; opacity: 0.3; }
        .empty-text { font-size: 9px; font-family: 'Orbitron'; letter-spacing: 1px; color: #555; }

        /* DASHBOARD INFO */
        .queue-dashboard {
            background: rgba(0, 0, 0, 0.6); border-top: 2px solid var(--neon-blue); border-bottom: 2px solid var(--neon-blue); 
            padding: 10px; text-align: center; margin-bottom: 20px; box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
        }
        .qd-title { font-family: 'Orbitron'; font-size: 9px; color: #aaa; letter-spacing: 2px; margin-bottom: 2px; }
        .qd-main { font-size: 22px; font-weight: 800; color: #fff; margin: 2px 0; text-shadow: 0 0 10px var(--neon-blue); }
        .qd-info { font-size: 10px; color: #000; font-weight: bold; background: var(--neon-blue); padding: 3px 10px; border-radius: 4px; display: inline-block; margin-top: 3px; }

        /* WAITING LIST */
        .wait-card { 
            background: rgba(255, 255, 255, 0.05); border-left: 3px solid #555; border-radius: 8px; padding: 12px; margin-bottom: 8px; 
            display: flex; justify-content: space-between; align-items: center; font-size: 12px; backdrop-filter: blur(5px);
        }
        .wait-card.active { border-left-color: var(--neon-blue); background: rgba(0, 243, 255, 0.05); }
        .wait-info h4 { margin: 0; font-family: 'Orbitron'; font-size: 13px; color: #fff; }
        .wait-info p { margin: 2px 0 0; font-size: 10px; color: #aaa; }
        .wait-stat { text-align: right; font-weight: bold; color: var(--neon-blue); }
        .btn-del-q { padding: 5px; color: #666; font-size: 14px; }

        /* MODAL & ADMIN */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; }
        .modal-box { background: #0b101a; border: 2px solid var(--neon-blue); padding: 25px; border-radius: 15px; width: 80%; max-width: 300px; text-align: center; }
        .modal-btn { width: 100%; padding: 12px; background: var(--neon-blue); color: #000; border: none; border-radius: 8px; font-weight: bold; margin-top: 15px; font-family: 'Orbitron'; }
        
        .admin-p { display: none; background: #111; padding: 15px; border: 1px solid var(--danger); border-radius: 12px; margin-top: 20px; position: relative; }
        .adm-btn { width: 100%; padding: 10px; border-radius: 6px; border: none; margin-top: 8px; font-weight: bold; font-size: 11px; font-family: 'Orbitron'; }
        .btn-blue { background: var(--neon-blue); color: #000; } .btn-red { background: var(--danger); color: #fff; } .btn-dark { background: #333; color: #fff; }
        .btn-close-admin { position: absolute; top: 5px; right: 10px; background: none; border: none; color: #888; font-size: 16px; font-weight: bold; }

        .loc-status { text-align:center; font-size:10px; color:var(--neon-blue); margin-top:5px; display:none; font-family: 'Orbitron'; }

        #activation-overlay { position: fixed; inset: 0; z-index: 9999; background: rgba(5, 10, 20, 0.98); backdrop-filter: blur(10px); display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
        .btn-activate { background: transparent; color: var(--neon-blue); border: 2px solid var(--neon-blue); padding: 15px 30px; font-family: 'Orbitron'; font-size: 14px; font-weight: bold; border-radius: 50px; box-shadow: 0 0 30px rgba(0, 243, 255, 0.2); margin-top: 20px; }
    </style>
</head>

qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq" type="audio/mp3">

    <div id="activation-overlay">
        <h1 style="font-family:'Orbitron'; color:#fff; margin-bottom:5px;">SYSTEM CONNECTED</h1>

    <script>
        // CONFIG
        const STATION_LAT = -6.171583; 
        const STATION_LNG = 106.899884; 
        const MAX_DISTANCE_METERS = 200; 
        const SLOT_LABELS = ["Slot 3 (Kiri)", "Slot 2 (Tengah)", "Slot 1 (Kanan)"];

        function forceOpen() {
            document.getElementById('activation-overlay').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
            setTimeout(async () => {
                const aud = document.getElementById('alarm');
                try { aud.volume = 1.0; await aud.play(); aud.pause(); aud.currentTime = 0; } catch (e) {}
                try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {}
            }, 100);
        }

        function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
            var R = 6371; var dLat = deg2rad(lat2-lat1); var dLon = deg2rad(lon2-lon1); 
            var a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * Math.sin(dLon/2) * Math.sin(dLon/2); 
            var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); var d = R * c; return d * 1000; 
        }
        function deg2rad(deg) { return deg * (Math.PI/180); }

        function getDynamicLimit(queueLength) {
            if (queueLength > 10) return 85;
            if (queueLength >= 6) return 90;
            if (queueLength >= 3) return 95;
            return 100;
        }

        document.addEventListener("DOMContentLoaded", function() {
            const FONNTE_TOKEN = "Fc8dWb7jiKr7CXuEZXBx"; 
            const firebaseConfig = { apiKey: "AIzaSyALIlkIDALIk83K8s1htalvW6rmNNw02Go", authDomain: "sistem-antrian-b1c39.firebaseapp.com", projectId: "sistem-antrian-b1c39", storageBucket: "sistem-antrian-b1c39.firebasestorage.app", messagingSenderId: "454124587608", appId: "1:454124587608:web:34fbb0f5211067a67f982d" };

            if (typeof firebase === 'undefined') { document.getElementById('slots').innerHTML = "<div style='color:red; padding:20px;'>Gagal Load Database.</div>"; return; }

            try {
                firebase.initializeApp(firebaseConfig);
                const db = firebase.firestore();
                const ref = db.collection("antrian").doc("utama");

                let isAdmin = false; 
                let triggered = new Set(); 
                const aud = document.getElementById('alarm');

                function sendWA(target, message, scheduleTime = null) {
                    let p = target.replace(/\D/g,''); if(p.startsWith('0')) p='62'+p.substring(1);
                    const fd = new FormData(); fd.append("target", p); fd.append("message", message); fd.append("countryCode", "62");
                    if (scheduleTime) { const unixTime = Math.floor(scheduleTime / 1000); fd.append("schedule", unixTime); }
                    try { fetch("https://api.fonnte.com/send", { method: "POST", headers: { "Authorization": FONNTE_TOKEN }, body: fd }); } catch(e){}
                }
                function msg(t,p,e="") { return `*Halo Sahabat MLU!*\n\n${t} *${p}* ${e}.\n\nPesan ini dikirim otomatis oleh Admin MLU.`; }

                // --- KALIBRASI RUMUS MESIN ASLI ---
                function calculateDuration(bat, target) {
                    let min = 0;
                    for (let i = bat; i < target; i++) {
                        if (i < 60) min += 0.6;       // 0-60%: Super Cepat (0.6 m/%)
                        else if (i < 85) min += 1.0;  // 60-85%: Normal (1.0 m/%)
                        else min += 1.5;              // 85-100%: Lambat (1.5 m/%)
                    }
                    return Math.ceil(min);
                }
                
                function showModal(title, msg, action=null, showInput=false) {
                    const mod = document.getElementById('mod'); document.getElementById('mt').innerText = title; document.getElementById('mm').innerText = msg;
                    const inp = document.getElementById('adminPinInput'); const btn = document.getElementById('modalActionBtn');
                    inp.style.display = showInput ? 'block' : 'none'; if(showInput) inp.value = '';
                    btn.onclick = () => { if(action) action(); else stopAlarm(); }; mod.style.display = 'flex';
                }
                window.stopAlarm = () => { aud.pause(); aud.currentTime = 0; document.getElementById('mod').style.display = 'none'; };
                window.showAdminLogin = () => { showModal("ADMIN LOGIN", "PIN:", () => { if(document.getElementById('adminPinInput').value === '1131') { document.getElementById('mod').style.display='none'; document.getElementById('admPan').style.display='block'; isAdmin=true; } else alert("PIN SALAH!"); }, true); };

                document.getElementById('btnDaftar').onclick = function() {
                    const p = document.getElementById('uPlat').value.toUpperCase(); 
                    const w = document.getElementById('uWa').value; 
                    const b = parseInt(document.getElementById('uBat').value);
                    const btn = document.getElementById('btnDaftar');
                    const statusLoc = document.getElementById('locStatus');

                    if(!p || !w || isNaN(b)) return showModal('ERROR','Isi Semua Data');

                    localStorage.setItem('myPlat', p);

                    btn.innerText = "CEK LOKASI..."; btn.disabled = true; statusLoc.style.display = 'block'; statusLoc.innerText = "Meminta izin lokasi...";

                    if (!navigator.geolocation) {
                        btn.innerText = "DAFTAR ANTRIAN"; btn.disabled = false;
                        return showModal("ERROR", "Browser tidak support GPS.");
                    }

                    navigator.geolocation.getCurrentPosition(
                        async (position) => {
                            const dist = getDistanceFromLatLonInKm(position.coords.latitude, position.coords.longitude, STATION_LAT, STATION_LNG);
                            
                            if (dist > MAX_DISTANCE_METERS && !isAdmin) {
                                btn.innerText = "DAFTAR ANTRIAN"; btn.disabled = false;
                                statusLoc.innerText = `DI TOLAK, MASIH (${dist.toFixed(0)}m) DARI FC. GA BISA DAFTAR.`;
                                return showModal("JANGAN CURANG CUKK", `LU MASIH JAUH BANGSAT, GW UDAH TAU AKAL2AN LU. LU MASIH ${dist.toFixed(0)}m LAGI DARI FC KELAPA GADING. 
                                KL UDAH DEKET BARU DAFTAR JANCUKK.`);
                            }

                            statusLoc.innerText = "Lokasi Terverifikasi ✅"; btn.innerText = "MEMPROSES...";
                            
                            await db.runTransaction(async (t) => {
                                const docSnap = await t.get(ref);
                                const d = docSnap.data() || {};
                                let s = d.chargingSlots || [null,null,null]; 
                                let q = d.waitingQueue || [];
                                
                                if(s.some(x=>x?.name===p)||q.some(x=>x?.name===p)) throw "Sudah Ada";
                                
                                let emptyIdx = s.findIndex(x => !x);
                                
                                if (emptyIdx !== -1) {
                                    const limit = getDynamicLimit(q.length);
                                    const dur = calculateDuration(b, limit);
                                    s[emptyIdx] = {
                                        name: p, phone: w, startBattery: b, 
                                        durationMinutes: dur, targetLimit: limit, startTime: null
                                    };
                                } else {
                                    q.push({name:p, phone:w, startBattery:b, durationMinutes:0, targetLimit:100, startTime:null});
                                }

                                t.set(ref, {chargingSlots:s, waitingQueue:q}, {merge:true});
                                if(w) sendWA(w, msg("Motor", p, "berhasil didaftarkan."));
                            }).then(() => { 
                                showModal('SUKSES','Pendaftaran Berhasil'); document.getElementById('uPlat').value='';
                                btn.innerText = "DAFTAR ANTRIAN"; btn.disabled = false;
                            }).catch((err) => { showModal('GAGAL', "Error / Sudah Ada"); btn.innerText = "DAFTAR ANTRIAN"; btn.disabled = false; });
                        },
                        (error) => {
                            btn.innerText = "DAFTAR ANTRIAN"; btn.disabled = false;
                            statusLoc.innerText = "Gagal deteksi lokasi ❌";
                            showModal("GPS ERROR", "Aktifkan GPS & Izinkan Lokasi.");
                        },
                        { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                    );
                };

                window.act = (i, type) => {
                    db.runTransaction(async (t) => {
                        const docSnap = await t.get(ref);
                        const d = docSnap.data();
                        let s = d.chargingSlots; let q = d.waitingQueue;
                        const currentSlot = s[i];

                        if (type === 'stop') {
                            const myPlat = localStorage.getItem('myPlat');
                            if (!isAdmin && (!currentSlot || currentSlot.name !== myPlat)) {
                                throw "Bukan Motor Anda"; 
                            }

                            s[i] = null; 
                            if(q.length > 0) {
                                let nextUser = q.shift(); 
                                let limit = getDynamicLimit(q.length);
                                let dur = calculateDuration(nextUser.startBattery, limit);
                                nextUser.targetLimit = limit; 
                                nextUser.durationMinutes = dur; 
                                s[i] = nextUser;
                            }
                        } else { 
                            let limit = getDynamicLimit(q.length);
                            let dur = calculateDuration(currentSlot.startBattery, limit);
                            s[i].targetLimit = limit;
                            s[i].durationMinutes = dur;
                            s[i].startTime = new Date(); 
                        }
                        t.update(ref, {chargingSlots:s, waitingQueue:q});
                        return { type, slotItem: s[i], slotIndex: i }; 
                    }).then((res) => {
                        if (res.type === 'start' && res.slotItem && res.slotItem.phone) {
                            const item = res.slotItem;
                            const slotName = SLOT_LABELS[res.slotIndex]; 
                            const limitMsg = `Target Cas: ${item.targetLimit}%`;
                            sendWA(item.phone, msg("Motor", item.name, `Mulai Dicas di *${slotName}*. ${limitMsg}`));
                            const durationMs = item.durationMinutes * 60 * 1000;
                            const endTimeMs = Date.now() + durationMs;
                            sendWA(item.phone, msg("Motor", item.name, `SUDAH SELESAI di *${slotName}*. Silakan dipindahkan`), endTimeMs);
                        }
                    }).catch((err) => {
                        if(err === "Bukan Motor Anda") showModal("AKSES DITOLAK", "Hanya Admin atau Pemilik Motor yang bisa Stop.");
                    });
                };

                window.clrSlot=()=>{const i=document.getElementById('mSlot').value; db.runTransaction(async(t)=>{const s=(await t.get(ref)).data().chargingSlots;s[i]=null; t.update(ref,{chargingSlots:s})});};
                window.fillQ=()=>{db.runTransaction(async(t)=>{const d=(await t.get(ref)).data();let s=d.chargingSlots;let q=d.waitingQueue;if(q.length>0 && s.includes(null)){
                    let idx = s.indexOf(null); let nextUser = q.shift(); let limit = getDynamicLimit(q.length); nextUser.targetLimit = limit; nextUser.durationMinutes = calculateDuration(nextUser.startBattery, limit); s[idx] = nextUser; t.update(ref,{chargingSlots:s,waitingQueue:q});
                }} );};
                window.startAll=()=>{db.runTransaction(async(t)=>{const s=(await t.get(ref)).data().chargingSlots; s.forEach((x,i)=>{if(x&&!x.startTime) window.act(i,'start') }); });};
                window.stopAll=()=>{db.runTransaction(async(t)=>{const s=(await t.get(ref)).data().chargingSlots; s.forEach((x,i)=>{if(x) window.act(i,'stop') }); });};
                window.resAll=()=>{if(confirm('RESET SEMUA DATA?')) ref.set({chargingSlots:[null,null,null],waitingQueue:[],blockedList:[]});};
                
                window.fixSlots=()=>{
                    if(confirm('Fix Data Slot?')) {
                        db.runTransaction(async(t)=>{
                            const d=(await t.get(ref)).data(); 
                            let s = d.chargingSlots;
                            s = s.map(x => (x && x.name) ? x : null);
                            t.update(ref,{chargingSlots:s});
                        });
                        showModal('FIX', 'Data Slot Diperbaiki');
                    }
                };

                window.blockUser=async()=>{const p=document.getElementById('blockPlatInput').value.toUpperCase().trim();if(!p)return;await db.runTransaction(async(t)=>{const d=(await t.get(ref)).data();const l=d.blockedList||[];if(!l.includes(p))l.push(p);t.update(ref,{blockedList:l});});showModal('BLOKIR',`Plat ${p} diblokir.`);};
                window.delQ=(i,name)=>{if(isAdmin||localStorage.getItem('myPlat')===name) db.runTransaction(async(t)=>{const q=(await t.get(ref)).data().waitingQueue;q.splice(i,1);t.update(ref,{waitingQueue:q});}); else showModal('AKSES DITOLAK', 'Bukan antrian Anda!');};

                ref.onSnapshot((snap) => {
                    const d=snap.data()||{}; const s=d.chargingSlots||[null,null,null]; const q=d.waitingQueue||[];
                    
                    const qLen = q.length;
                    document.getElementById('dash-q-count').innerText = `${qLen} ANTRIAN`;
                    document.getElementById('dash-limit').innerText = `MAX CAS: ${getDynamicLimit(qLen)}%`;
                    
                    const listContainer = document.getElementById('qListContainer');
                    if (qLen === 0) {
                        listContainer.innerHTML = '<div style="text-align:center; color:#555; font-size:12px; margin-top:20px;">- Belum ada antrian -</div>';
                    } else {
                        listContainer.innerHTML = q.map((x,i)=>`
                            <div class="wait-card ${i===0 ? 'active' : ''}">
                                <div class="wait-info"><h4>${x.name}</h4><p>${x.phone ? x.phone.substring(0,4)+'****'+x.phone.substring(x.phone.length-2) : 'No WA'}</p></div>
                                <div class="wait-stat"><div class="bat">${x.startBattery}%</div></div>
                                <div class="btn-del-q" onclick="delQ(${i}, '${x.name}')">✕</div>
                            </div>
                        `).join('');
                    }

                    document.getElementById('slots').innerHTML = s.map((x,i)=>{
                        const slotLabel = SLOT_LABELS[i];
                        if(!x || !x.name) { 
                            return `<div class="slot"><div class="slot-label-top">${slotLabel}</div><div class="empty-state"><div class="empty-icon">🔌</div><div class="empty-text">READY</div></div></div>`; 
                        }
                        const isRun=!!x.startTime;
                        let btn = isRun ? `<button class="btn-act btn-stop" onclick="act(${i},'stop')">STOP</button>` : `<button class="btn-act btn-start" onclick="act(${i},'start')">MULAI</button>`;
                        let txt="Tap Mulai"; let h=x.startBattery; let cssClass=""; let endTime = 0;
                        let targetDisplay = x.targetLimit || 100;

                        if(isRun) {
                            let startMs = 0; if(x.startTime && typeof x.startTime.toMillis === 'function') { startMs = x.startTime.toMillis(); } else if (x.startTime) { startMs = new Date(x.startTime).getTime(); }
                            endTime = startMs + (x.durationMinutes*60000);
                            const diff = endTime - Date.now();
                            if(diff>0) { const m=Math.floor(diff/60000); const sc=Math.floor((diff%60000)/1000); txt=`${m}:${sc<10?'0'+sc:sc}`; h=100; } 
                            else { 
                                txt="SELESAI"; cssClass="done"; const k=x.name+endTime; 
                                if(!triggered.has(k)){ triggered.add(k); aud.volume=1.0; aud.play().catch(e=>console.log(e)); showModal('ALARM', `Motor ${x.name} Selesai!`); } 
                            }
                        }
                        
                        return `
                        <div class="slot ${isRun?'active':''}">
                            <div class="slot-label-top">${slotLabel}</div>
                            <div class="bat-percent">${isRun?targetDisplay:x.startBattery}% <div class="target-limit-badge">Limit ${targetDisplay}%</div></div>
                            <div class="bat-wrap"><div class="bat-icon"><div class="bat-fill" style="height:${h}%"></div><div class="bat-bolt">⚡</div></div></div>
                            <div class="plat-text">${x.name}</div>
                            <div class="timer-text ${cssClass}" data-end="${endTime}" data-name="${x.name}">${txt}</div>
                            ${btn}
                        </div>`;
                    }).join('');
                });

                setInterval(() => {
                    document.querySelectorAll('.timer-text').forEach(el => {
                        const end = parseInt(el.getAttribute('data-end'));
                        if(end > 0) {
                            const diff = end - Date.now();
                            if(diff > 0) { const m=Math.floor(diff/60000); const sc=Math.floor((diff%60000)/1000); el.innerText = `${m}:${sc<10?'0'+sc:sc}`; el.classList.remove('done'); } 
                            else { if(el.innerText !== "SELESAI") { el.innerText = "SELESAI"; el.classList.add('done'); const name = el.getAttribute('data-name'); const key = name + end; if(!triggered.has(key)) { triggered.add(key); aud.volume=1.0; aud.play().catch(e=>console.log(e)); showModal('ALARM', `Motor ${name} Selesai!`); } } }
                        }
                    });
                }, 1000);

            } catch (error) { document.getElementById('slots').innerHTML = "<div style='color:red;'>Terjadi Kesalahan Aplikasi. Hubungi Admin.</div>"; }
        });
    </script>
</body>
</html>
