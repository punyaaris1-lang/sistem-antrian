<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badge Kokoh Pea - Mode Rusak</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Orbitron:wght@700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* === BADGE KOKOH PEA: MODE RUSAK === */
        :root {
            --neon-purple: #D000FF;
            --neon-green: #39FF14;
        }

        .badge-kokoh-pea-chaos {
            width: 100%;
            max-width: 160px;
            height: 60px;
            /* Background Disko Halus */
            background: linear-gradient(135deg, #1a051a, #000, #1a051a);
            background-size: 200% 200%;
            border: 2px dashed var(--neon-purple); /* Border Putus-putus */
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px var(--neon-purple);
            animation: borderRun 0.5s infinite linear, bgDisco 2s infinite alternate;
        }

        /* FOTO YANG MANGGUT-MANGGUT */
        .pea-img-chaos {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid #fff;
            overflow: hidden;
            background: #000;
            z-index: 5;
            position: relative;
            box-shadow: 0 0 15px #fff;
            /* Animasi Manggut-Manggut & Getar */
            animation: headBang 0.2s infinite alternate, shakeImg 2s infinite; 
        }

        .pea-img-chaos img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* AREA TEKS GLITCH */
        .pea-text-chaos {
            flex: 1;
            text-align: center;
            z-index: 5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .pea-word-chaos {
            font-family: 'Press Start 2P', cursive; /* Font Pixel Rusak */
            font-size: 10px; 
            color: #fff;
            text-shadow: 2px 2px 0px var(--neon-purple);
            line-height: 1.2;
            animation: glitchText 0.3s infinite; /* Teks Goyang */
        }

        .pea-sub-chaos {
            font-family: 'Orbitron', sans-serif;
            font-size: 7px;
            color: var(--neon-green);
            font-weight: bold;
            margin-top: 4px;
            background: #000;
            padding: 2px;
            border: 1px solid var(--neon-green);
            animation: blinkTag 0.5s infinite; /* Kedap Kedip Cepat */
        }

        /* EFEK LISTRIK/KILAT */
        .badge-kokoh-pea-chaos::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(transparent, rgba(255, 0, 255, 0.3), transparent 30%);
            animation: spinChaos 1s infinite linear;
            z-index: 1;
        }

        /* === KUMPULAN ANIMASI PEA === */
        
        /* 1. Border Jalan */
        @keyframes borderRun {
            0% { border-color: var(--neon-purple); box-shadow: 0 0 10px var(--neon-purple); }
            50% { border-color: #fff; box-shadow: 0 0 20px #fff; }
            100% { border-color: var(--neon-green); box-shadow: 0 0 10px var(--neon-green); }
        }

        /* 2. Kepala Manggut-Manggut */
        @keyframes headBang {
            0% { transform: rotate(-10deg) scale(1); }
            100% { transform: rotate(10deg) scale(1.1); }
        }

        /* 3. Teks Glitch (Goyang Kanan Kiri) */
        @keyframes glitchText {
            0% { transform: translate(0,0); text-shadow: 2px 2px 0 var(--neon-purple); }
            25% { transform: translate(-2px,1px); text-shadow: -2px -2px 0 var(--neon-green); }
            50% { transform: translate(1px,-1px); text-shadow: 2px -2px 0 red; }
            75% { transform: translate(-1px,2px); text-shadow: -2px 2px 0 blue; }
            100% { transform: translate(0,0); text-shadow: 2px 2px 0 var(--neon-purple); }
        }

        /* 4. Background Disco */
        @keyframes bgDisco {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* 5. Subtitle Kedip */
        @keyframes blinkTag {
            0%, 100% { opacity: 1; background: #000; color: var(--neon-green); }
            50% { opacity: 1; background: var(--neon-green); color: #000; }
        }

        @keyframes spinChaos {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

    </style>
</head>
<body>

    <div class="badge-kokoh-pea-chaos">
        <div class="pea-img-chaos">
            <img src="cris.png" alt="PEA">
        </div>
        <div class="pea-text-chaos">
            <div class="pea-word-chaos">KOKOH<br>PEA</div>
            <div class="pea-sub-chaos">404 WARAS NOT FOUND</div>
        </div>
    </div>

</body>
</html>
