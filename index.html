<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fast Charging V37 (Clean)</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        /* TEMA V33 (SUPER CLEAN DARK) */
        :root { 
            --bg: #0b101a; 
            --text: #ffffff; 
            --cyan: #00e5ff; 
            --soft-red: #ff6b6b; 
            --card-bg: rgba(255,255,255,0.05); 
            --border: #333;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; font-family: 'Rajdhani', sans-serif; 
            background-color: var(--bg); color: var(--text); 
            padding: 20px; padding-bottom: 120px; 
        }

        .container { max-width: 480px; margin: 0 auto; }
        
        h1 { 
            font-family: 'Orbitron'; font-size: 24px; color: var(--cyan); 
            text-align: center; margin-bottom: 25px; 
            text-shadow: 0 0 10px var(--cyan); 
        }

        /* GRID SLOT */
        .slots-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 30px; }
        .slot-box { 
            background: var(--card-bg); border: 1px solid var(--border); 
            border-radius: 15px; padding: 10px 5px; text-align: center; 
            min-height: 120px; display: flex; flex-direction: column; justify-content: center; 
        }
        .slot-box.active { border-color: var(--cyan); background: rgba(0, 229, 255, 0.1); }
        .slot-title { font-size: 20px; font-weight: bold; margin-bottom: 5px; }
        .slot-timer { font-size: 18px; font-weight: bold; color: var(--cyan); margin: 5px 0; }
        
        /* FORM DAFTAR */
        .glass-card { 
            background: var(--card-bg); padding: 20px; 
            border-radius: 15px; margin-bottom: 20px; 
            border: 1px solid var(--border); 
        }
        
        input.field { 
            width: 100%; padding: 12px; margin-bottom: 10px; 
            background: #000; border: 1px solid #555; 
            color: #fff; text-align: center; 
            font-family: 'Orbitron'; font-size: 16px; 
            border-radius: 8px; outline: none;
        }
        input.field:focus { border-color: var(--cyan); }
        
        .btn-cyan { 
            width: 100%; padding: 15px; background: var(--cyan); 
            border: none; font-weight: bold; cursor: pointer; 
            border-radius: 8px; font-family: 'Orbitron'; font-size: 16px; 
            color: #000; box-shadow: 0 0 15px rgba(0,229,255,0.2);
            transition: 0.2s;
        }
        .btn-cyan:active { transform: scale(0.98); }

        /* BUTTON SMALL */
        .btn-small {
            background: #333; color: #fff; border: 1px solid #555;
            padding: 5px 10px; border-radius: 5px; cursor: pointer;
            font-family: 'Rajdhani'; font-weight: bold; margin-top: 5px;
        }
        .btn-start { background: var(--cyan); color: #000; border: none; }
        .btn-stop { background: var(--soft-red); color: #fff; border: none; }

        /* MODAL */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 999; align-items: center; justify-content: center; }
        .modal-box { background: #111; border: 2px solid var(--soft-red); padding: 30px; border-radius: 15px; text-align: center; width: 85%; animation: pop 0.3s; }
        @keyframes pop { from{transform:scale(0.8)} to{transform:scale(1)} }
        
        .btn-stop-alarm { 
            background: var(--soft-red); color: white; padding: 15px; 
            width: 100%; border: none; font-size: 18px; font-weight: bold; 
            margin-top: 15px; border-radius: 8px; cursor: pointer; 
        }

        /* ADMIN & FOOTER */
        .admin-link {
            text-align: center; margin-top: 30px; font-size: 12px; 
            color: #444; cursor: pointer; letter-spacing: 1px;
        }
        
        .admin-panel { display: none; background: #000; padding: 15px; border: 1px solid #333; margin-top: 15px; border-radius: 10px; }
        .adm-btn { width: 100%; padding: 10px; margin-top: 5px; background: #333; color: #fff; border: 1px solid #555; cursor: pointer; }

    </style>
</head>
<body>

    <audio id="alarmSound" loop preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mp3">
    </audio>

    <div class="container">
        <h1>FAST CHARGING</h1>
        
        <div class="glass-card">
            <input id="userPlat" class="field" placeholder="PLAT NOMOR" style="text-transform:uppercase;">
            <input id="userBattery" type="number" class="field" placeholder="BATERAI (%)">
            <button id="btnDaftar" class="btn-cyan">DAFTAR ANTRIAN</button>
        </div>

        <div class="slots-grid" id="slotsContainer">
            <div style="grid-column:1/-1; text-align:center; padding:20px; color:#666;">Loading...</div>
        </div>

        <div class="glass-card" style="padding:15px; min-height:80px;">
            <div style="font-family:'Orbitron'; font-size:12px; margin-bottom:10px; color:#888; border-bottom:1px solid #333; padding-bottom:5px;">
                ANTRIAN : <span id="qCount" style="color:var(--cyan)">0</span>
            </div>
            <div id="queueList"></div>
        </div>

        <div class="admin-link" onclick="openAdminLogin()">🔒 ADMIN LOGIN</div>

        <div id="adminPanel" class="admin-panel">
            <h4 style="margin:0 0 10px; color:var(--soft-red); text-align:center;">ADMIN CONTROL</h4>
            <input id="blockPlatInput" class="field" placeholder="Blokir Plat" style="font-size:14px; padding:8px;">
            <button onclick="blockUser()" class="adm-btn">BLOKIR</button>
            <button onclick="stopAll()" class="adm-btn" style="background:var(--soft-red);">STOP SEMUA</button>
            <button onclick="resetAll()" class="adm-btn" style="margin-top:15px; color:var(--soft-red); border-color:var(--soft-red); background:transparent;">RESET TOTAL</button>
        </div>
    </div>

    <div id="alarmModal" class="modal">
        <div class="modal-box">
            <div style="font-size:50px;">🚨</div>
            <h2 style="color:var(--soft-red); font-family:'Orbitron'; margin:10px 0;">SELESAI!</h2>
            <p id="alarmText" style="color:#fff; font-size:24px; font-weight:bold;">...</p>
            <button class="btn-stop-alarm" onclick="matikanAlarm()">MATIKAN ALARM</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, runTransaction, setDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyALIlkIDALIk83K8s1htalvW6rmNNw02Go",
            authDomain: "sistem-antrian-b1c39.firebaseapp.com",
            projectId: "sistem-antrian-b1c39",
            storageBucket: "sistem-antrian-b1c39.firebasestorage.app",
            messagingSenderId: "454124587608",
            appId: "1:454124587608:web:34fbb0f5211067a67f982d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const ref = doc(db, "antrian", "utama");

        // --- SISTEM SILENT (SUARA & LAYAR) ---
        let isAdminLoggedIn = false;
        let triggeredAlarms = new Set();
        let wakeLock = null;
        const alarmAudio = document.getElementById('alarmSound');

        // Fungsi Aktivasi Gabungan (Jalan diam-diam)
        async function activateSystem() {
            // 1. Kunci Layar (Tanpa Notif)
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => {}); 
                }
            } catch (err) { /* Biarkan error diam */ }

            // 2. Unlock Audio (Play 0.1 detik super cepat & senyap)
            try {
                alarmAudio.volume = 1.0;
                alarmAudio.muted = false;
                await alarmAudio.play();
                setTimeout(() => { alarmAudio.pause(); alarmAudio.currentTime = 0; }, 50); 
            } catch (e) { /* Biarkan error diam */ }
        }

        // AUTO ACTIVATE: Saat user klik APA SAJA di halaman ini pertama kali
        document.body.addEventListener('click', activateSystem, { once: true });
        // RE-ACTIVATE: Jika user balik dari tab lain
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') activateSystem();
        });

        // --- ALARM LOGIC ---
        function triggerAlarm(name) {
            const myPlat = localStorage.getItem('myPlat');
            
            if((myPlat && name === myPlat) || isAdminLoggedIn) {
                document.getElementById('alarmText').innerText = `Plat ${name}`;
                document.getElementById('alarmModal').style.display = 'flex';
                
                alarmAudio.currentTime = 0;
                alarmAudio.loop = true;
                alarmAudio.play().catch(e => console.log("Audio block"));
                
                if(navigator.vibrate) navigator.vibrate([1000, 500, 1000]);
            }
        }

        window.matikanAlarm = () => {
            alarmAudio.pause();
            alarmAudio.currentTime = 0;
            document.getElementById('alarmModal').style.display = 'none';
        };

        // --- LOGIC APLIKASI ---
        document.getElementById('btnDaftar').onclick = async () => {
            await activateSystem(); // Pastikan sistem hidup
            
            const btn = document.getElementById('btnDaftar');
            const plat = document.getElementById('userPlat').value.toUpperCase().trim();
            const bat = parseInt(document.getElementById('userBattery').value);

            if(!plat || isNaN(bat)) return alert("Isi Data Lengkap!");
            btn.disabled=true; btn.innerText="PROSES...";

            localStorage.setItem('myPlat', plat);

            try {
                await runTransaction(db, async(t)=>{
                    const d = (await t.get(ref)).data() || {};
                    let s = d.chargingSlots || [null,null,null];
                    let q = d.waitingQueue || [];

                    if((d.blockedList||[]).includes(plat)) throw "Plat DIBLOKIR!";
                    if(s.some(x=>x?.name===plat) || q.some(x=>x?.name===plat)) throw "Sudah Terdaftar!";

                    let dur = 0; 
                    if(bat >= 90) dur = Math.ceil((100-bat) * 2.2); 
                    else if(bat >= 80) dur = Math.ceil((100-bat) * 1.5);
                    else dur = Math.ceil((100-bat) * 0.8);
                    if(dur < 5) dur = 5;

                    const item = { name:plat, startBattery:bat, durationMinutes:dur, startTime:null };
                    const empty = s.findIndex(x=>x===null);
                    
                    if(empty!==-1) s[empty] = item; else q.push(item);
                    t.set(ref, {chargingSlots:s, waitingQueue:q}, {merge:true});
                });
                document.getElementById('userPlat').value=''; 
                document.getElementById('userBattery').value='';
            } catch(e) { alert(e); }
            btn.disabled=false; btn.innerText="DAFTAR ANTRIAN";
        };

        // --- RENDER ---
        setInterval(() => {
            document.querySelectorAll('[data-end]').forEach(el => {
                const end = parseInt(el.dataset.end);
                const name = el.dataset.name;
                const diff = end - Date.now();
                if(diff > 0) {
                    const m = Math.floor(diff/60000);
                    const s = Math.floor((diff%60000)/1000);
                    el.innerText = `${m}:${s<10?'0'+s:s}`;
                } else {
                    el.innerText = "SELESAI"; el.style.color = "var(--soft-red)";
                    const key = name+end;
                    if(!triggeredAlarms.has(key)) { 
                        triggeredAlarms.add(key); 
                        triggerAlarm(name); 
                    }
                }
            });
        }, 1000);

        onSnapshot(ref, (snap) => {
            const d = snap.data() || {};
            const slots = d.chargingSlots || [null,null,null];
            
            document.getElementById('slotsContainer').innerHTML = slots.map((x,i)=>{
                if(!x) return `
                    <div class="slot-box" style="opacity:0.5; border-style:dashed;">
                        <div style="font-size:12px; color:#888;">SLOT ${i+1} KOSONG</div>
                    </div>`;

                const isRun = !!x.startTime;
                let btn = isRun ? 
                    `<button class="btn-small btn-stop" onclick="window.act(${i},'stop', '${x.name}')">STOP</button>` :
                    `<button class="btn-small btn-start" onclick="window.act(${i},'start', '${x.name}')">MULAI</button>`;
                
                let time = `<div style="font-size:12px; color:#888;">Tap MULAI</div>`;
                
                if(isRun) {
                    const start = x.startTime.seconds ? x.startTime.seconds*1000 : new Date(x.startTime).getTime();
                    const end = start + (x.durationMinutes*60000);
                    time = `<div class="slot-timer" data-end="${end}" data-name="${x.name}">...</div>`;
                }
                
                return `
                    <div class="slot-box active">
                        <div class="slot-title">${x.name}</div>
                        ${time}
                        ${btn}
                    </div>`;
            }).join('');

            const q = d.waitingQueue || [];
            document.getElementById('qCount').innerText = q.length;
            document.getElementById('queueList').innerHTML = q.length ? q.map((x,i)=>`
                <div style="display:flex; justify-content:space-between; padding:8px; border-bottom:1px solid #333;">
                    <div><b>${x.name}</b> <span style="font-size:12px; color:#888">(${x.startBattery}%)</span></div>
                    <button onclick="window.delQ(${i}, '${x.name}')" style="background:none; border:none; color:var(--soft-red); cursor:pointer;">✕</button>
                </div>
            `).join('') : '<div style="text-align:center; color:#555; font-size:12px; padding:10px;">Tidak ada antrian</div>';
        });

        // --- ACTIONS ---
        window.act = (i, type, platName) => {
            activateSystem(); 
            const myPlat = localStorage.getItem('myPlat');

            if(type === 'stop' && !isAdminLoggedIn && myPlat !== platName) {
                return alert('Bukan kendaraan Anda!');
            }

            if(type==='stop') {
                if(confirm(`Hapus Slot ${i+1}?`)) {
                    runTransaction(db, async(t)=>{
                        const d = (await t.get(ref)).data();
                        let s = d.chargingSlots; let q = d.waitingQueue;
                        s[i]=null; if(q.length){ s[i]={...q.shift(), startTime:null}; }
                        t.update(ref, {chargingSlots:s, waitingQueue:q});
                    });
                    window.matikanAlarm();
                }
            } else {
                runTransaction(db, async(t)=>{
                    const s = (await t.get(ref)).data().chargingSlots;
                    if(s[i]) s[i].startTime = new Date();
                    t.update(ref, {chargingSlots:s});
                });
            }
        };

        window.delQ = (i, platName) => {
            const myPlat = localStorage.getItem('myPlat');
            if(!isAdminLoggedIn && myPlat !== platName) return alert('Bukan antrian Anda!');
            if(confirm('Hapus antrian ini?')) {
                runTransaction(db, async(t)=>{
                    const q = (await t.get(ref)).data().waitingQueue;
                    q.splice(i,1); t.update(ref, {waitingQueue:q});
                });
            }
        };

        window.openAdminLogin = () => {
            const p = prompt("Masukkan PIN Admin:");
            if(p === '1131') {
                document.getElementById('adminPanel').style.display = 'block';
                isAdminLoggedIn = true;
                activateSystem(); 
                alert("Mode Admin Aktif! (Suara & Layar On)");
            } else if(p) {
                alert("PIN Salah");
            }
        };

        window.blockUser = async () => {
            const p = document.getElementById('blockPlatInput').value.toUpperCase().trim();
            if(!p) return;
            await runTransaction(db, async (t) => {
                const d = (await t.get(ref)).data(); const l = d.blockedList || [];
                if (!l.includes(p)) l.push(p); t.update(ref, {blockedList: l});
            });
            alert(`Plat ${p} diblokir.`);
        };
        
        window.stopAll = () => {
            if(confirm("Stop SEMUA slot?")) runTransaction(db, async(t)=>{ t.update(ref, {chargingSlots:[null,null,null]}); });
        };
        
        window.resetAll = () => {
            if(confirm("RESET TOTAL?")) setDoc(ref, {chargingSlots:[null,null,null], waitingQueue:[], blockedList:[]});
        };
    </script>
</body>
</html>
