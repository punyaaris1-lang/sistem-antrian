<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fast Charging V34 (ANTI-SLEEP)</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0b101a; --text: #ffffff; --cyan: #00e5ff; --soft-red: #ff6b6b; --card-bg: rgba(255,255,255,0.05); }
        body { margin: 0; font-family: 'Rajdhani', sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; padding-bottom: 120px; }
        .container { max-width: 480px; margin: 0 auto; }
        h1 { font-family: 'Orbitron'; font-size: 24px; color: var(--cyan); text-align: center; margin-bottom: 20px; text-shadow: 0 0 10px var(--cyan); }
        
        /* INDIKATOR LAYAR */
        .screen-status { text-align: center; margin-bottom: 15px; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 12px; letter-spacing: 1px; }
        .screen-on { background: rgba(0, 255, 0, 0.2); border: 1px solid #00ff00; color: #00ff00; }
        .screen-off { background: rgba(255, 0, 0, 0.2); border: 1px solid red; color: red; }

        .btn-test { width: 100%; background: #222; color: #fff; padding: 15px; border: 1px solid #555; border-radius: 8px; margin-bottom: 20px; font-weight: bold; cursor: pointer; display:flex; align-items:center; justify-content:center; gap:10px; }
        .btn-test:active { background: #444; }

        .slots-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 30px; }
        .slot-box { background: var(--card-bg); border: 1px solid #333; border-radius: 15px; padding: 10px 5px; text-align: center; min-height: 120px; display: flex; flex-direction: column; justify-content: center; }
        .slot-box.active { border-color: var(--cyan); background: rgba(0, 229, 255, 0.1); }
        
        .glass-card { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #333; }
        input.field { width: 100%; padding: 12px; margin-bottom: 10px; background: #000; border: 1px solid #555; color: #fff; text-align: center; font-family: 'Orbitron'; font-size: 16px; border-radius: 5px; box-sizing: border-box; }
        .btn-cyan { width: 100%; padding: 12px; background: var(--cyan); border: none; font-weight: bold; cursor: pointer; border-radius: 5px; font-family: 'Orbitron'; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 999; align-items: center; justify-content: center; }
        .modal-box { background: #111; border: 2px solid var(--soft-red); padding: 30px; border-radius: 15px; text-align: center; width: 85%; animation: pop 0.3s; }
        @keyframes pop { from{transform:scale(0.8)} to{transform:scale(1)} }
        .btn-stop-alarm { background: var(--soft-red); color: white; padding: 15px; width: 100%; border: none; font-size: 18px; font-weight: bold; margin-top: 15px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <h1>FAST CHARGING V34</h1>
        
        <div id="screenStat" class="screen-status screen-off">
            ⚠️ LAYAR TIDAK TERKUNCI (BISA MATI)
        </div>

        <button class="btn-test" onclick="initSystem()">
            <span>🔊</span>
            <span>KLIK AKTIFKAN SUARA & LAYAR</span>
        </button>

        <div class="glass-card">
            <input id="userPlat" class="field" placeholder="PLAT NOMOR (CONTOH: B 1234)">
            <button onclick="daftar()" class="btn-cyan">DAFTAR CEPAT (1 MENIT)</button>
        </div>

        <div class="slots-grid" id="slotsContainer">
            <div style="grid-column:1/-1; text-align:center;">Loading System...</div>
        </div>
        
        <div style="text-align:center; color:#666; font-size:11px; margin-top:30px; line-height:1.5;">
            PASTIKAN INDIKATOR LAYAR BERWARNA HIJAU.<br>
            JANGAN MEMATIKAN LAYAR HP SECARA MANUAL.<br>
            BIARKAN HALAMAN INI TERBUKA TERUS.
        </div>
    </div>

    <div id="alarmModal" class="modal">
        <div class="modal-box">
            <div style="font-size:50px;">🚨</div>
            <h2 style="color:var(--soft-red); font-family:'Orbitron'; margin:10px 0;">SELESAI!</h2>
            <p id="alarmText" style="color:#fff; font-size:20px; font-weight:bold;">...</p>
            <button class="btn-stop-alarm" onclick="matikanAlarm()">MATIKAN ALARM</button>
        </div>
    </div>

    <audio id="audioElement" loop preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mp3">
    </audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, runTransaction } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyALIlkIDALIk83K8s1htalvW6rmNNw02Go",
            authDomain: "sistem-antrian-b1c39.firebaseapp.com",
            projectId: "sistem-antrian-b1c39",
            storageBucket: "sistem-antrian-b1c39.firebasestorage.app",
            messagingSenderId: "454124587608",
            appId: "1:454124587608:web:34fbb0f5211067a67f982d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const ref = doc(db, "antrian", "utama");
        
        const audio = document.getElementById('audioElement');
        let triggeredAlarms = new Set();
        let wakeLock = null;

        // --- 1. FITUR "JAGA LAYAR" (WAKE LOCK) ---
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    updateScreenStatus(true);
                    wakeLock.addEventListener('release', () => updateScreenStatus(false));
                } else {
                    alert("Browser ini tidak mendukung fitur Jaga Layar otomatis. Mohon setel HP agar tidak tidur (Auto-lock: Never).");
                }
            } catch (err) {
                console.log(`${err.name}, ${err.message}`);
                updateScreenStatus(false);
            }
        }

        // Jika user pindah tab lalu kembali, minta kunci layar lagi
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });

        function updateScreenStatus(isActive) {
            const el = document.getElementById('screenStat');
            if(isActive) {
                el.className = "screen-status screen-on";
                el.innerHTML = "✅ LAYAR TERJAGA (ANTI-SLEEP AKTIF)";
            } else {
                el.className = "screen-status screen-off";
                el.innerHTML = "⚠️ LAYAR BISA MATI SENDIRI<br>Klik tombol Aktifkan di bawah!";
            }
        }

        // --- 2. SISTEM AUDIO & INISIALISASI ---
        window.initSystem = async () => {
            // A. Aktifkan Audio
            audio.volume = 1.0; // Paksa volume 100%
            audio.muted = false;
            try {
                await audio.play();
                setTimeout(() => { audio.pause(); audio.currentTime = 0; }, 500); // Bunyi sebentar lalu stop
            } catch(e) { alert("Audio Gagal: " + e); }

            // B. Aktifkan Layar (Wake Lock)
            await requestWakeLock();
        };

        window.matikanAlarm = () => {
            audio.pause();
            audio.currentTime = 0;
            document.getElementById('alarmModal').style.display = 'none';
        };

        // --- 3. LOGIKA FIREBASE ---
        onSnapshot(ref, (snap) => {
            const d = snap.data() || {};
            const slots = d.chargingSlots || [null,null,null];

            const html = slots.map((x, i) => {
                if(!x) return `<div class="slot-box" style="opacity:0.5">SLOT ${i+1}<br>KOSONG</div>`;
                
                let timerText = "Tap MULAI";
                if(x.startTime) {
                    const end = x.startTime.seconds ? (x.startTime.seconds * 1000) + (x.durationMinutes * 60000) 
                                                    : new Date(x.startTime).getTime() + (x.durationMinutes * 60000);
                    
                    const now = Date.now();
                    const diff = end - now;
                    const alarmKey = x.name + "_" + end;

                    if(diff <= 0) {
                        // ALARM TRIGGER
                        if(!triggeredAlarms.has(alarmKey)) {
                            triggeredAlarms.add(alarmKey);
                            document.getElementById('alarmText').innerText = `Plat ${x.name}`;
                            document.getElementById('alarmModal').style.display = 'flex';
                            
                            audio.currentTime = 0;
                            audio.play().catch(e => console.log("Audio block:", e));
                            if(navigator.vibrate) navigator.vibrate([1000, 500, 1000]);
                        }
                        return `<span style="color:var(--soft-red); font-weight:bold;">SELESAI</span>`;
                    } else {
                        const m = Math.floor(diff/60000);
                        const s = Math.floor((diff%60000)/1000);
                        return `<span style="color:var(--cyan); font-size:24px; font-weight:bold;">${m}:${s<10?'0'+s:s}</span>`;
                    }
                }
                return `
                    <div class="slot-box active">
                        <div style="font-size:20px; font-weight:bold;">${x.name}</div>
                        <div style="margin:10px 0;">${timerText}</div>
                        ${!x.startTime ? `<button onclick="mulai(${i})" class="btn-cyan" style="padding:5px; font-size:12px;">MULAI</button>` : ''}
                    </div>
                `;
            }).join('');
            
            document.getElementById('slotsContainer').innerHTML = html;
        });

        // Update tampilan timer per detik (Visual saja)
        setInterval(() => {
            // Trik untuk memicu refresh visual firebase (optional, tapi onSnapshot sudah cukup reaktif)
        }, 1000);

        // --- 4. FUNGSI DAFTAR CEPAT ---
        window.daftar = async () => {
            const p = document.getElementById('userPlat').value.toUpperCase();
            if(!p) return alert("Isi Plat");
            await runTransaction(db, async(t) => {
                const d = (await t.get(ref)).data();
                let s = d.chargingSlots || [null,null,null];
                const idx = s.findIndex(x => x === null);
                if(idx === -1) return alert("Penuh");
                s[idx] = { name: p, durationMinutes: 1, startTime: null, startBattery: 50 }; // 1 Menit Test
                t.update(ref, { chargingSlots: s });
            });
        };

        window.mulai = (i) => {
            runTransaction(db, async(t)=>{
                const s = (await t.get(ref)).data().chargingSlots;
                s[i].startTime = new Date();
                t.update(ref, {chargingSlots:s});
            });
        };
    </script>
</body>
</html>
