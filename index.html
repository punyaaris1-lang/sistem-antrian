<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistem Antrian</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- === UI ASLI KAMU TIDAK DIUBAH SAMA SEKALI === -->
  <div class="container">
    <h1>Sistem Antrian Servis</h1>

    <label>Plat Nomor:</label>
    <input id="platInput" type="text" placeholder="B 1234 CD">

    <button id="btnDaftar">DAFTAR</button>

    <div id="notifBox" style="display:none;"></div>

    <div id="output"></div>
  </div>

  <!-- Alarm embedded (tidak mengubah tampilan) -->
  <audio id="alarmAudio"
    src="data:audio/mp3;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAACcQCAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA="
    preload="auto">
  </audio>

  <!-- ========================= -->
  <!-- === SCRIPT FIREBASE === -->
  <!-- ========================= -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import {
      getFirestore, doc, getDoc, setDoc, updateDoc, runTransaction
    } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    import {
      getMessaging,
      getToken,
      onMessage
    } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging.js";

    /* === Firebase Config ASLI KAMU === */
    const firebaseConfig = {
      apiKey: "AIzaSyALIlkIDALIk83K8s1htalvW6rmNNw02Go",
      authDomain: "sistem-antrian-b1c39.firebaseapp.com",
      projectId: "sistem-antrian-b1c39",
      storageBucket: "sistem-antrian-b1c39.firebasestorage.app",
      messagingSenderId: "454124587608",
      appId: "1:454124587608:web:34fbb0f5211067a67f982d"
    };

    /* ================================ */
    /* INIT */
    /* ================================ */
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let messagingSafe = null;
    try {
      messagingSafe = getMessaging(app);
    } catch (e) {
      console.warn("Messaging unavailable:", e);
      messagingSafe = null;
    }

    /* ================================ */
    /* AUDIO UNLOCK (DIPANGGIL SAAT USER KLIK) */
    /* ================================ */
    async function unlockAudioOnce() {
      if (window.__audioUnlocked) return true;
      let a = document.getElementById("alarmAudio");
      try {
        await a.play();
        a.pause();
        a.currentTime = 0;
        window.__audioUnlocked = true;
        console.log("Audio unlocked!");
        return true;
      } catch (e) {
        console.warn("Cannot unlock audio:", e);
        return false;
      }
    }

    /* ================================ */
    /* FUNGSI MAIN */
    /* ================================ */
    const btn = document.getElementById("btnDaftar");

    btn.onclick = async () => {
      await unlockAudioOnce(); // PENTING!

      const plat = document.getElementById("platInput").value.trim().toUpperCase();
      if (!plat) return alert("Masukkan plat dulu!");

      localStorage.setItem("myPlat", plat);

      document.getElementById("notifBox").style.display = "block";
      document.getElementById("notifBox").innerHTML = "Mengirim permintaan...";

      // kirim request antrian (kode ASLI KAMU TIDAK DIUBAH)
      try {
        const qRef = doc(db, "antrian", "data");
        await runTransaction(db, async (t) => {
          const snap = await t.get(qRef);
          let d = snap.data();
          if (!d) d = { total: 0 };
          d.total++;
          t.update(qRef, { total: d.total });
        });

        document.getElementById("notifBox").innerHTML =
          "Berhasil daftar! Menunggu notifikasi...";
      } catch (e) {
        console.error(e);
        document.getElementById("notifBox").innerHTML = "GAGAL upload!";
      }
    };

    /* ================================ */
    /* FOREGROUND FCM */
    /* ================================ */
    if (messagingSafe) {
      onMessage(messagingSafe, (payload) => {
        console.log("Foreground FCM:", payload);
        const data = payload.data || {};

        const myPlat = localStorage.getItem("myPlat");
        if (data.plat === myPlat) {
          alert("Motor " + data.plat + " sudah selesai!");

          const a = document.getElementById("alarmAudio");
          a.play().catch(() => { });
        }
      });
    }

    /* ================================ */
    /* SW REGISTER + TOKEN */
    /* ================================ */
    window.addEventListener("load", async () => {
      if (!("serviceWorker" in navigator)) return;

      try {
        const reg = await navigator.serviceWorker.register("/firebase-messaging-sw.js");

        if (messagingSafe) {
          const token = await getToken(messagingSafe, {
            vapidKey: "ra2uPkrLOs_lECdkHUD8bLfgePr9T2C7sgWMivJdmVA",
            serviceWorkerRegistration: reg
          });

          console.log("FCM Token:", token);
        }
      } catch (e) {
        console.error("SW register error:", e);
      }
    });

    /* ================================ */
    /* SW → PAGE MESSAGE (NOTIF CLICK) */
    /* ================================ */
    navigator.serviceWorker.addEventListener("message", (e) => {
      const d = e.data || {};
      if (d.type === "ALARM_TRIGGER") {
        const myPlat = localStorage.getItem("myPlat");
        if (d.plat === myPlat) {
          alert("Motor " + d.plat + " selesai!");

          const a = document.getElementById("alarmAudio");
          a.play().catch(() => { });
        }
      }
    });

  </script>
</body>
</html>
