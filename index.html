<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MLU SUPER APP</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b101a">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; height: 100vh; overflow: hidden; background-color: #0b101a;
            background-image: url('1763947427555.jpg'); background-size: cover; background-position: center; 
            font-family: 'Rajdhani', sans-serif; display: flex; flex-direction: column; align-items: center; 
        }
        body::before { content: ''; position: absolute; inset: 0; background: rgba(0, 0, 0, 0.85); z-index: -1; }

        /* INSTALL SCREEN */
        #installScreen {
            position: fixed; inset: 0; z-index: 9999; background: rgba(11, 16, 26, 0.98); 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: transform 0.5s ease; transform: translateY(0);
        }
        #installScreen.hidden { transform: translateY(-100%); }

        .welcome-title { font-family: 'Orbitron'; font-size: 24px; color: #fff; margin-bottom: 20px; letter-spacing: 2px; }
        .btn-install {
            background: #ccff00; color: #000; border: none; padding: 15px 40px; border-radius: 30px;
            font-family: 'Orbitron'; font-weight: 900; font-size: 16px; cursor: pointer; 
            box-shadow: 0 0 20px rgba(204, 255, 0, 0.5); margin-bottom: 20px;
        }
        .btn-skip { background: none; border: none; color: #666; font-size: 12px; text-decoration: underline; }

        /* MENU */
        .logo-area { text-align: center; margin-top: 50px; margin-bottom: 20px; z-index: 10; }
        h1 { font-family: 'Orbitron'; font-size: 42px; margin: 0; color: #fff; text-shadow: 0 0 20px #00bcd4; }
        .menu-grid { display: grid; gap: 15px; width: 85%; max-width: 400px; margin-top: 10px; z-index: 10; }
        .menu-btn {
            background: rgba(255, 255, 255, 0.1); border: 1px solid #00bcd4; padding: 20px; border-radius: 20px; 
            display: flex; align-items: center; gap: 20px; text-decoration: none; color: #fff;
        }
        .menu-icon { font-size: 28px; }
        .menu-text h3 { margin: 0; font-family: 'Orbitron'; font-size: 16px; }
        .menu-text span { font-size: 11px; color: #aaa; }

        /* DEBUG STATUS */
        #pwa-status { position: absolute; bottom: 10px; font-size: 10px; color: #555; font-family: monospace; }
    </style>
</head>
<body>

    <div id="installScreen">
        <div class="welcome-title">HALO SAHABAT MLU</div>
        <button id="btnInstall" class="btn-install">📲 INSTALL SEKARANG</button>
        <button onclick="closeInstall()" class="btn-skip">Lanjut di Browser >></button>
        <p id="debug-msg" style="color:red; font-size:10px; margin-top:20px;"></p>
    </div>

    <div class="logo-area"><h1>MLU APPS</h1></div>

    <div class="menu-grid">
        <a href="lokasi.html" class="menu-btn"><div class="menu-icon">📍</div><div class="menu-text"><h3>LOKASI FC</h3><span>Cari Station</span></div></a>
        <a href="sos.html" class="menu-btn"><div class="menu-icon">🆘</div><div class="menu-text"><h3>MAKA SOS</h3><span>Bantuan</span></div></a>
        <a href="antrian.html" class="menu-btn"><div class="menu-icon">⚡</div><div class="menu-text"><h3>FC CHARGING</h3><span>Antrian</span></div></a>
    </div>

    <a href="artikel.html" class="menu-btn" style="margin-top:15px; justify-content:center;">📰 INFO & EVENT</a>

    <div id="pwa-status">System Check...</div>

    <script>
        const statusEl = document.getElementById('pwa-status');
        const debugEl = document.getElementById('debug-msg');
        let deferredPrompt;

        function updateStatus(msg) { statusEl.innerText = msg; console.log(msg); }

        // 1. REGISTER SW
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => updateStatus("SW Aktif ✅"))
                .catch(err => {
                    updateStatus("SW Gagal ❌");
                    debugEl.innerText = "Error: " + err.message;
                });
        } else {
            updateStatus("Browser tidak support PWA");
        }

        // 2. CEK MODE APLIKASI
        window.addEventListener('load', () => {
            if (window.matchMedia('(display-mode: standalone)').matches) {
                document.getElementById('installScreen').style.display = 'none';
            }
        });

        // 3. TANGKAP EVENT INSTALL
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            updateStatus("Install Ready ✅");
            debugEl.innerText = ""; // Hapus error jika ada
        });

        // 4. TOMBOL CLICK
        document.getElementById('btnInstall').addEventListener('click', () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((result) => {
                    if (result.outcome === 'accepted') {
                        closeInstall();
                    }
                    deferredPrompt = null;
                });
            } else {
                alert("⚠️ INSTALL MANUAL:\nKlik titik tiga (⋮) di pojok kanan atas -> 'Install App' / 'Tambahkan ke Layar Utama'");
                closeInstall();
            }
        });

        window.closeInstall = () => { document.getElementById('installScreen').classList.add('hidden'); };
    </script>
</body>
</html>
