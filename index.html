<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MLU SUPER APP</title>
    
    <link rel="manifest" href="manifest.json">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; height: 100vh; overflow: hidden;
            background-color: #0b101a;
            background-image: url('1763947427555.jpg'); 
            background-size: cover; background-position: center; background-attachment: fixed;
            font-family: 'Rajdhani', sans-serif;
            display: flex; flex-direction: column; align-items: center; 
        }

        /* OVERLAY GELAP BACKGROUND */
        body::before {
            content: ''; position: absolute; inset: 0;
            background: rgba(0, 0, 0, 0.75); z-index: -1;
        }

        /* === WELCOME SCREEN INSTALLER (FIXED) === */
        #installScreen {
            position: fixed; inset: 0; z-index: 9999;
            background: rgba(11, 16, 26, 0.98); /* Gelap Hampir Solid */
            display: flex; flex-direction: column; 
            align-items: center; justify-content: center;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: translateY(-100%); /* Default Sembunyi di Atas */
        }
        
        #installScreen.show { transform: translateY(0); /* Muncul ke Tengah */ }

        .welcome-logo {
            width: 130px; height: 130px; border-radius: 50%;
            background: url('1763947427555.jpg') center/cover;
            box-shadow: 0 0 30px #00bcd4;
            margin-bottom: 30px; border: 4px solid #fff;
            animation: pulseLogo 2s infinite;
        }
        @keyframes pulseLogo { 0%{box-shadow:0 0 30px #00bcd4} 50%{box-shadow:0 0 60px #00bcd4} 100%{box-shadow:0 0 30px #00bcd4} }

        .welcome-title {
            font-family: 'Orbitron'; font-size: 26px; color: #fff;
            text-align: center; margin-bottom: 10px; letter-spacing: 2px;
        }
        .welcome-desc {
            color: #aaa; text-align: center; font-size: 14px;
            max-width: 80%; margin-bottom: 40px; line-height: 1.6;
        }

        .btn-install-big {
            background: #ccff00; color: #000; border: none;
            padding: 18px 40px; border-radius: 50px;
            font-family: 'Orbitron'; font-weight: 900; font-size: 16px;
            box-shadow: 0 0 25px rgba(204, 255, 0, 0.6);
            cursor: pointer; transition: 0.2s; text-transform: uppercase;
            display: flex; align-items: center; gap: 10px;
        }
        .btn-install-big:active { transform: scale(0.95); }

        .btn-skip {
            margin-top: 25px; background: none; border: none;
            color: #666; font-size: 13px; text-decoration: underline;
            cursor: pointer; padding: 10px;
        }

        /* === HALAMAN UTAMA (RESTORED V91) === */
        .logo-area { text-align: center; margin-top: 60px; margin-bottom: 30px; z-index: 10; }
        h1 { font-family: 'Orbitron', sans-serif; font-size: 42px; margin: 0; color: #fff; letter-spacing: 3px; text-shadow: 0 0 20px #00bcd4; }
        
        .squad-text {
            font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: bold; 
            color: #000; background: #ccff00; padding: 5px 15px; border-radius: 5px; 
            margin-top: 5px; display: inline-block; border: 2px solid #fff;
            animation: blink 1.5s infinite; letter-spacing: 1px;
        }
        @keyframes blink { 50% { opacity: 0.6; } }

        .menu-grid { display: grid; gap: 15px; width: 85%; max-width: 400px; margin-top: 10px; z-index: 10; }
        
        .menu-btn {
            background: rgba(255, 255, 255, 0.1); border: 1px solid #00bcd4; 
            padding: 20px; border-radius: 20px; cursor: pointer;
            display: flex; align-items: center; gap: 20px; text-decoration: none; 
            backdrop-filter: blur(10px); transition: 0.2s; 
            box-shadow: 0 0 15px rgba(0, 188, 212, 0.1);
        }
        .menu-btn:active { transform: scale(0.96); background: #00bcd4; }
        .menu-btn:active h3, .menu-btn:active span { color: #000; }
        
        .menu-icon { 
            font-size: 28px; width: 55px; height: 55px;
            background: rgba(0, 229, 255, 0.1);
