<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { font-family: Arial; background:#111; color:#fff; padding:15px; }

/* ---------- QUEUE UI ---------- */
.slot {
    background:#1b1b1b;
    padding:12px;
    border-radius:10px;
    margin-bottom:10px;
    border:1px solid #333;
}

/* ---------- iOS BUBBLE ---------- */
#iosBubble {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.7);
    padding: 18px 25px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 25px;
    color: #fff;
    font-size: 18px;
    text-align: center;
    opacity: 0;
    transition: 0.25s ease;
    z-index: 9999;
}

#iosBubble.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
}

/* Buttons */
button {
    padding:7px 14px;
    background:#0a84ff;
    border:none;
    border-radius:8px;
    color:white;
    font-size:15px;
}
button.red { background:#ff3b30; }
</style>
</head>

<body>

<h2>Sistem Charging</h2>

<!-- input -->
Nama: <input id="inName" placeholder="Nama Motor"><br><br>
WA: <input id="inPhone" placeholder="Nomor WhatsApp"><br><br>
Durasi (menit): <input id="inMin" type="number" value="30"><br><br>

<button onclick="addQueue()">+ Tambah ke Antrian</button>

<hr>

<h3>Antrian:</h3>
<div id="queueBox"></div>

<!-- iOS Bubble -->
<div id="iosBubble"></div>

<script>
/* ======================================================
   GLOBAL STATE
====================================================== */
let queue = [];
let current = null;
let wakeLock = null;

let alarm = new Audio("alarm.mp3");
alarm.loop = true;
let audioPrimed = false;

/* ======================================================
   PRIMER AUDIO + WAKELOCK (WAJIB)
====================================================== */
document.body.addEventListener("click", () => {
    if (audioPrimed) return;
    audioPrimed = true;

    alarm.volume = 0.1;
    alarm.play().then(() => {
        setTimeout(() => {
            alarm.pause();
            alarm.volume = 1;
            alarm.currentTime = 0;
        }, 150);
    }).catch(()=>{});

    if ("wakeLock" in navigator) {
        navigator.wakeLock.request("screen")
            .then(w => wakeLock = w)
            .catch(()=>{});
    }
});

/* ======================================================
   UTILS
====================================================== */
function sendWA(phone, msg) {
    let f = new FormData();
    f.append("target", phone);
    f.append("message", msg);
    f.append("schedule", 0);

    fetch("https://api.fonnte.com/send", {
        method:"POST",
        headers:{ "Authorization":"FONNTE_TOKEN" },
        body:f
    }).catch(()=>{});
}

function showIOS(msg) {
    let b = document.getElementById("iosBubble");
    b.innerHTML = msg;
    b.classList.add("show");
    setTimeout(()=>{ b.classList.remove("show"); }, 3000);
}

/* ======================================================
   TAMBAH ANTRIAN
====================================================== */
function addQueue() {
    let name = inName.value.trim();
    let phone = inPhone.value.trim();
    let min = parseInt(inMin.value);

    if (!name || !phone || min < 1) {
        alert("Input tidak valid");
        return;
    }

    queue.push({
        id: Date.now(),
        name,
        phone,
        min,
        sec: min * 60,
        timer: null
    });

    renderQueue();

    // jika belum ada yg berjalan → mulai
    if (!current) startNext();
}

/* ======================================================
   MULAI SLOT SELANJUTNYA
====================================================== */
function startNext() {
    if (queue.length === 0) {
        current = null;
        return;
    }

    current = queue[0];

    sendWA(current.phone, `🔌 Charging motor *${current.name}* dimulai.`);

    current.timer = setInterval(() => {
        current.sec--;
        renderQueue();

        if (current.sec <= 0) finishCurrent();

    }, 1000);
}

/* ======================================================
   SELESAI SATU SLOT
====================================================== */
function finishCurrent() {
    clearInterval(current.timer);

    // Alarm
    alarm.currentTime = 0;
    alarm.play().catch(()=>{});

    // Notifikasi iOS
    showIOS(`⚡ Charging selesai<br>${current.name}`);

    // WA Finish
    sendWA(current.phone, `⚡ Charging motor *${current.name}* telah selesai.`);

    // Hentikan alarm setelah 15 dtk
    setTimeout(() => {
        alarm.pause();
        alarm.currentTime = 0;
    }, 15000);

    // Hapus dari queue
    queue.shift();
    current = null;

    renderQueue();
    startNext();
}

/* ======================================================
   HAPUS ANTRIAN
====================================================== */
function delQ(id) {
    if (current && current.id === id) {
        clearInterval(current.timer);
        alarm.pause();
        alarm.currentTime = 0;
    }

    queue = queue.filter(x => x.id !== id);

    renderQueue();

    if (!current) startNext();
}

/* ======================================================
   RENDER UI
====================================================== */
function renderQueue() {
    let box = document.getElementById("queueBox");
    box.innerHTML = "";

    queue.forEach((x, i) => {
        let m = Math.floor(x.sec / 60);
        let s = x.sec % 60;

        box.innerHTML += `
            <div class="slot">
                <b>${i === 0 ? "Sedang Berjalan" : "Antrian"}</b><br>
                Motor: ${x.name}<br>
                WA: ${x.phone}<br>
                Durasi: ${x.min} menit<br>
                Waktu: ${m}:${String(s).padStart(2,'0')}<br>
                <button class="red" onclick="delQ(${x.id})">Hapus</button>
            </div>
        `;
    });
}
</script>

</body>
</html>
