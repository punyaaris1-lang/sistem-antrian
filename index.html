<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAKA FONTE SYSTEM</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --c-cyan: #00F0FF; --c-green: #00E676; --c-red: #FF1744; --c-gold: #FFD700;
            --bg: #050505; --panel: #111;
        }
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 15px; background-color: var(--bg); color: #fff;
            font-family: 'Inter', sans-serif; min-height: 100vh; padding-bottom: 140px; overflow-x: hidden;
        }

        /* BACKGROUND */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px; z-index: -2; opacity: 0.3; pointer-events: none;
        }

        /* HEADER */
        .hud-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--c-cyan); padding-bottom: 15px; margin-bottom: 20px;
        }
        .brand { font-family: 'Orbitron'; font-weight: 900; font-size: 24px; color: #fff; letter-spacing: 1px; }
        .brand span { color: var(--c-green); }
        .adm-btn { font-size: 24px; padding: 10px; cursor: pointer; color: #666; transition: 0.3s; }
        .adm-btn:hover { color: #fff; transform: rotate(90deg); }

        /* VIEW MANAGER */
        .view-section { display: none; animation: fadeIn 0.5s; }
        .view-section.active { display: block; }

        /* 1. FORMULIR */
        .reg-box {
            background: var(--panel); border: 1px solid #333; padding: 25px; border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .inp-label { font-size: 11px; color: #aaa; margin-bottom: 8px; display: block; font-weight: 800; letter-spacing: 1px; }
        .cy-input {
            width: 100%; background: #000; border: 1px solid #444; color: #fff;
            padding: 16px; font-family: 'Orbitron'; font-size: 20px; text-align: center;
            outline: none; margin-bottom: 20px; border-radius: 8px; transition: 0.3s;
        }
        .cy-input:focus { border-color: var(--c-cyan); box-shadow: 0 0 15px rgba(0,240,255,0.2); }

        /* 2. REAKTOR RAKSASA */
        .focus-wrap { text-align: center; margin-top: 10px; }
        .reactor-container { position: relative; width: 300px; height: 300px; margin: 0 auto 30px; display: flex; align-items: center; justify-content: center; }
        .ring-outer { position: absolute; width: 100%; height: 100%; border: 2px dashed #333; border-radius: 50%; animation: spin 30s linear infinite; }
        .ring-inner { position: absolute; width: 85%; height: 85%; border-radius: 50%; border: 4px solid transparent; border-top: 4px solid var(--c-cyan); border-bottom: 4px solid var(--c-cyan); animation: spin 8s linear infinite reverse; }
        .ring-progress { position: absolute; width: 94%; height: 94%; transform: rotate(-90deg); }
        .ring-progress circle { fill: none; stroke-width: 10; stroke: #111; }
        .ring-progress .fill { stroke: var(--c-green); stroke-dasharray: 816; stroke-dashoffset: 816; transition: 1s; filter: drop-shadow(0 0 15px var(--c-green)); }
        
        .r-content { z-index: 10; text-align: center; }
        .r-val { font-family: 'Orbitron'; font-size: 80px; font-weight: 900; line-height: 1; text-shadow: 0 0 30px var(--c-green); }
        .r-sub { font-size: 16px; color: var(--c-cyan); font-weight: 800; letter-spacing: 2px; margin-top: 5px; }
        
        .timer-display { font-family: 'Orbitron'; font-size: 42px; color: #fff; font-weight: bold; margin-bottom: 25px; font-variant-numeric: tabular-nums; }
        .status-badge { display: inline-block; background: #222; color: #aaa; padding: 8px 20px; border-radius: 20px; font-weight: bold; font-size: 12px; margin-bottom: 25px; }

        /* TOMBOL SHINY */
        .btn-act {
            width: 100%; padding: 18px; font-family: 'Orbitron'; font-weight: 900; font-size: 16px;
            border: none; cursor: pointer; border-radius: 8px; position: relative; overflow: hidden;
            text-transform: uppercase; letter-spacing: 1px; margin-top: 10px;
        }
        .btn-act::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
            animation: sheen 3s infinite;
        }
        .btn-blue { background: var(--c-cyan); color: #000; }
        .btn-green { background: var(--c-green); color: #000; }
        .btn-red { background: var(--c-red); color: #fff; }

        /* 3. MONITOR BAWAH */
        .monitor-area { margin-top: 40px; border-top: 1px solid #333; padding-top: 20px; }
        .sec-title { font-size: 11px; color: #888; font-weight: 900; margin-bottom: 10px; letter-spacing: 1px; }
        .slot-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #222; font-size: 14px; font-weight: bold; color: #666; }
        .slot-row b { color: #fff; font-family: 'Orbitron'; }
        .slot-row .hl { color: var(--c-cyan); }

        /* 4. ADMIN PANEL */
        #adminView { border: 1px solid var(--c-red); padding: 15px; background: #0a0a0a; margin-top: 20px; border-radius: 8px; }
        .adm-head { text-align: center; color: var(--c-red); font-weight: 900; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .adm-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
        .adm-box { background: #000; border: 1px solid #444; padding: 10px; text-align: center; border-radius: 4px; }
        .adm-box h2 { margin: 0; font-family: 'Orbitron'; font-size: 18px; color: #fff; }
        .adm-box small { display: block; font-size: 9px; color: #888; margin-top: 2px; }
        .adm-row { display: flex; gap: 8px; margin-bottom: 8px; }
        .adm-inp { background: #111; border: 1px solid #444; color: #fff; padding: 10px; flex: 1; text-align: center; font-weight: bold; border-radius: 4px; }
        .adm-click { padding: 10px; background: #222; border: 1px solid #555; color: #fff; flex: 1; cursor: pointer; font-size: 10px; font-weight: bold; border-radius: 4px; }
        .adm-click:hover { background: #333; border-color: #fff; }

        /* Music */
        .music-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #000; border-top: 2px solid var(--c-cyan); z-index: 100; }
        .music-toggle { text-align: center; padding: 10px; font-weight: bold; font-size: 12px; color: var(--c-cyan); cursor: pointer; }
        #musicFrame { width: 100%; height: 0px; border: none; transition: 0.3s; }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes sheen { 0% { left: -100%; } 20% { left: 100%; } 100% { left: 100%; } }
        @keyframes fadeIn { from {opacity:0} to {opacity:1} }
    </style>
</head>
<body>

    <div class="hud-header">
        <div class="brand">FC <span>GADING</span></div>
        <div class="adm-btn" onclick="toggleAdmin()">⚙️</div>
    </div>

    <div id="v-form" class="view-section">
        <div class="reg-box">
            <h3 style="margin-top:0; text-align:center; margin-bottom:20px; font-family:'Orbitron'">FORMULIR ANTRIAN</h3>
            <span class="inp-label">PLAT NOMOR</span>
            <input id="rp" class="cy-input" placeholder="B 1234 ABC" style="text-transform:uppercase">
            <span class="inp-label">NAMA PENGENDARA</span>
            <input id="rn" class="cy-input" placeholder="NAMA ANDA">
            <div style="display:flex; gap:10px;">
                <div style="flex:1"><span class="inp-label">BATERAI (%)</span><input id="rb" type="number" class="cy-input" placeholder="0-99"></div>
                <div style="flex:1"><span class="inp-label">WHATSAPP</span><input id="rw" type="number" class="cy-input" placeholder="08xxx"></div>
            </div>
            <button onclick="reg()" class="btn-act btn-blue">AMBIL NOMOR ANTRIAN</button>
        </div>
    </div>

    <div id="v-focus" class="view-section">
        <div class="focus-wrap">
            <div id="f-badge" class="status-badge">MEMUAT STATUS...</div>
            <div class="reactor-container">
                <div class="ring-outer"></div><div class="ring-inner"></div>
                <svg class="ring-progress" width="300" height="300">
                    <circle cx="150" cy="150" r="130"></circle>
                    <circle id="f-ring" class="fill" cx="150" cy="150" r="130" style="stroke-dashoffset: 816;"></circle>
                </svg>
                <div class="r-content" style="position: absolute;">
                    <div id="f-val" class="r-val">0%</div>
                    <div id="f-sub" class="r-sub">TARGET</div>
                </div>
            </div>
            <div id="f-timer" class="timer-display">--:--</div>
            <div id="f-controls"></div>
        </div>
    </div>

    <div id="v-admin" class="view-section">
        <div id="adminView">
            <div class="adm-head">PANEL ADMIN</div>
            <div class="adm-grid" id="adm-mon"></div>
            
            <span class="inp-label" style="color:#aaa">MANUAL ASSIGN</span>
            <div class="adm-row">
                <select id="as" class="adm-inp"><option value="0">SLOT 1</option><option value="1">SLOT 2</option><option value="2">SLOT 3</option></select>
                <input id="ap" class="adm-inp" placeholder="PLAT">
                <input id="ab" class="adm-inp" placeholder="%" style="width:50px">
            </div>
            <button onclick="admForce()" class="btn-act btn-green" style="padding:10px; font-size:12px; margin-bottom:20px;">ISI SLOT MANUAL</button>

            <span class="inp-label" style="color:#aaa">QUEUE CONTROL</span>
            <div class="adm-row">
                <select id="aq" class="adm-inp" style="flex:2"></select>
                <button onclick="admMove()" class="adm-click" style="color:var(--c-main)">MOVE</button>
                <button onclick="admDel()" class="adm-click" style="color:var(--c-red)">HAPUS</button>
            </div>

            <span class="inp-label" style="color:#aaa">DARURAT</span>
            <div class="adm-row">
                <button onclick="admClear()" class="adm-click">CLEAR SLOT</button>
                <button onclick="admReset()" class="adm-click">RESET DB</button>
                <button onclick="logout()" class="adm-click" style="background:#333; color:#fff;">LOGOUT</button>
            </div>
        </div>
    </div>

    <div class="monitor-area">
        <div class="sec-title">STATUS SLOT LAIN</div>
        <div id="slot-list"></div>
        <div style="text-align:center; margin-top:20px; font-size:12px; font-weight:bold; color:#666;" id="q-stat">ANTRIAN: 0</div>
    </div>

    <div class="music-bar">
        <div class="music-toggle" onclick="toggleMusic()">🎵 AUDIO PLAYER (KLIK)</div>
        <iframe id="musicFrame" src="https://punyaaris1-lang.github.io/music/"></iframe>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, runTransaction, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const app = initializeApp({ apiKey: "AIzaSyALIlkIDALIk83K8s1htalvW6rmNNw02Go", authDomain: "sistem-antrian-b1c39.firebaseapp.com", projectId: "sistem-antrian-b1c39", storageBucket: "sistem-antrian-b1c39.firebasestorage.app", messagingSenderId: "454124587608", appId: "1:454124587608:web:34fbb0f5211067a67f982d" });
        const db = getFirestore(app);
        const ref = doc(db, "antrian", "utama");

        // --- CONFIG FONTE & WA ---
        // ISIKAN TOKEN FONNTE ANDA DI BAWAH INI
        const FONTE_TOKEN = "MASUKAN_TOKEN_FONNTE_DISINI"; 
        const WA_MSG = "*FC GADING ALERT*\n\nHalo *[nama]*,\nMotor: *[plat]*\n\nPengisian daya telah SELESAI atau DIHENTIKAN. Mohon segera pindahkan unit agar antrian berikutnya dapat masuk.\n\nTerima Kasih.";

        let slots = [null,null,null], queue = [], myPlat = localStorage.getItem('myPlat'), isAdmin = localStorage.getItem('superAdminAuth') === 'true';
        let processing = [false, false, false];

        // AUTO FILL
        try { const raw = localStorage.getItem('maka_user'); if(raw) { const p = JSON.parse(raw); document.getElementById('rp').value = p.plat||''; document.getElementById('rn').value = p.nama||''; } } catch(e){}

        // CLOCK
        setInterval(() => document.getElementById('clock').innerText = new Date().toLocaleTimeString('id-ID'), 1000);

        // MATH
        const CURVE = [[100,0], [99,1], [95,4], [90,17], [89,18], [85,22], [81,25], [72,33], [61,45], [50,50], [20,68], [0,86]];
        function getCurveTime(v) { for(let i=0;i<CURVE.length-1;i++){ if(v<=CURVE[i][0]&&v>=CURVE[i+1][0]){ const r=(CURVE[i][0]-v)/(CURVE[i][0]-CURVE[i+1][0]); return CURVE[i][1]+r*(CURVE[i+1][1]-CURVE[i][1]); } } return 0; }
        function getDur(s, t) { if(s>=t) return 5; return Math.max(1, Math.ceil(getCurveTime(s)-getCurveTime(t))); }
        function getTar(l) { return l>=11?85:(l>=6?90:(l>=3?95:100)); }

        // --- FONTE SENDER ---
        async function sendFonnte(target, name, plat) {
            if(!target || target.length < 5 || target === '-') return;
            const msg = WA_MSG.replace('[nama]', name).replace('[plat]', plat);
            
            const data = new FormData();
            data.append('target', target);
            data.append('message', msg);
            data.append('countryCode', '62');

            try {
                await fetch("https://api.fonnte.com/send", {
                    method: "POST",
                    headers: { "Authorization": FONTE_TOKEN },
                    body: data
                });
                console.log("WA Sent to " + target);
            } catch (e) { console.error("Fonte Error", e); }
        }

        // --- UPDATE ENGINE ---
        function updateUI() {
            let myS = -1, myQ = -1;
            for(let i=0; i<slots.length; i++) if(slots[i] && slots[i].plat === myPlat) myS = i;
            for(let i=0; i<queue.length; i++) if(queue[i].plat === myPlat) myQ = i;

            const vForm = document.getElementById('v-form');
            const vFocus = document.getElementById('v-focus');
            const vAdmin = document.getElementById('v-admin');

            vForm.style.display = 'none'; vFocus.style.display = 'none'; vAdmin.style.display = 'none';

            if(isAdmin) {
                vAdmin.style.display = 'block';
                updateAdminMon(); updateAdminQ();
            } else if (myS !== -1) {
                vFocus.style.display = 'block';
                updateFocus(slots[myS], myS, 'charging');
            } else if (myQ !== -1) {
                vFocus.style.display = 'block';
                updateFocus(queue[myQ], myQ, 'waiting');
            } else {
                vForm.style.display = 'block';
            }

            updateSlotList();
            document.getElementById('q-stat').innerText = "ANTRIAN MENUNGGU: " + queue.length;
        }

        // FOKUS USER
        function updateFocus(data, idx, type) {
            const elBadge = document.getElementById('f-badge');
            const elVal = document.getElementById('f-val');
            const elSub = document.getElementById('f-sub');
            const elTimer = document.getElementById('f-timer');
            const elRing = document.getElementById('f-ring');
            const elCtrl = document.getElementById('f-controls');

            if (type === 'charging') {
                const tar = data.targetLimit || 100;
                let pct = data.startBattery;
                let timeStr = "CALC";

                if (data.startTime) {
                    const st = data.startTime.toDate();
                    const dur = data.durationMinutes;
                    const rem = Math.max(0, Math.ceil((st.getTime() + dur*60000 - new Date().getTime())/1000));
                    let m = Math.floor(rem/60); let s = rem % 60;
                    timeStr = `${m}:${s<10?'0'+s:s}`;
                    const gain = (tar - data.startBattery) * ((dur*60 - rem)/(dur*60));
                    pct = Math.min(tar, Math.floor(data.startBattery + gain));
                }

                elBadge.innerText = `SLOT ${idx+1} AKTIF`;
                elVal.innerText = pct + "%";
                elSub.innerText = "TARGET: " + tar + "%";
                elTimer.innerText = timeStr;
                const offset = 816 - ((pct/tar) * 816);
                elRing.style.strokeDashoffset = offset;
                elRing.style.stroke = "var(--c-green)";

                if(!data.startTime) elCtrl.innerHTML = `<button onclick="window.actStart(${idx})" class="btn-act btn-blue">MULAI PENGISIAN</button>`;
                else elCtrl.innerHTML = `<div style="display:flex; gap:10px;"><button onclick="window.actEdit(${idx})" class="btn-act btn-blue" style="flex:1">EDIT TIMER</button><button onclick="window.actStop(${idx})" class="btn-act btn-red" style="flex:1">STOP</button></div>`;

            } else {
                elBadge.innerText = "MENUNGGU GILIRAN";
                elVal.innerText = "#" + (idx+1);
                elSub.innerText = "URUTAN";
                elTimer.innerText = "EST: " + ((idx+1)*20) + " MENIT";
                elRing.style.strokeDashoffset = 0; elRing.style.stroke = "var(--c-cyan)";
                elCtrl.innerHTML = `<button onclick="window.actCancel(${idx})" class="btn-act btn-red">BATALKAN ANTRIAN</button>`;
            }
        }

        // LIST BAWAH
        function updateSlotList() {
            const c = document.getElementById('slot-list');
            let html = '';
            slots.forEach((s, i) => {
                if(!isAdmin && s && s.plat === myPlat) return;
                if(!s) html += `<div class="slot-row"><span class="sr-left">SLOT ${i+1}</span><span class="sr-val" style="color:#444">KOSONG</span></div>`;
                else {
                    let st = "SIAP CAS"; let pct = s.startBattery;
                    if(s.startTime) {
                        const stt=s.startTime.toDate(); const dur=s.durationMinutes;
                        const rem=Math.max(0, Math.ceil((new Date(stt.getTime()+dur*60000)-new Date())/60000));
                        const gain=((s.targetLimit||100)-s.startBattery)*((dur*60-rem)/(dur*60));
                        pct=Math.min(s.targetLimit||100, Math.floor(s.startBattery+gain));
                        st = "MENGISI";
                    }
                    html += `<div class="slot-row"><span class="sr-left">SLOT ${i+1}</span><div class="sr-right"><div class="sr-val hl">BAT: ${pct}%</div><div class="sr-stat">${st}</div></div></div>`;
                }
            });
            c.innerHTML = html;
        }

        // ADMIN FUNCTIONS
        function updateAdminMon() {
            document.getElementById('adm-mon').innerHTML = slots.map((s,i) => {
                if(!s) return `<div class="adm-box"><h4>SLOT ${i+1}</h4><h2>--</h2><small>KOSONG</small></div>`;
                let pct = s.startBattery;
                if(s.startTime) {
                    const stt=s.startTime.toDate(); const dur=s.durationMinutes;
                    const rem=Math.max(0, Math.ceil((new Date(stt.getTime()+dur*60000)-new Date())/60000));
                    const gain=((s.targetLimit||100)-s.startBattery)*((dur*60-rem)/(dur*60));
                    pct=Math.min(s.targetLimit||100, Math.floor(s.startBattery+gain));
                }
                return `<div class="adm-box" style="border-color:${s.startTime?'var(--c-green)':'var(--c-cyan)'}"><h4>SLOT ${i+1}</h4><h2>${pct}%</h2><small>${s.plat}</small></div>`;
            }).join('');
        }
        function updateAdminQ() { document.getElementById('aq').innerHTML = queue.map((q,i)=>`<option value="${i}">#${i+1} ${q.plat}</option>`).join(''); }

        // --- DATABASE ---
        onSnapshot(ref, (d) => {
            if(d.exists()) {
                const data = d.data();
                slots = data.chargingSlots || [null,null,null];
                queue = data.waitingQueue || [];
                updateUI();
            }
        });

        // --- AUTO KILL & FONTE TRIGGER ---
        setInterval(() => {
            let needsUpdate = false;
            const now = new Date();
            slots.forEach((s, i) => {
                if (s && s.startTime) needsUpdate = true;
                if (s && s.startTime && !processing[i]) {
                    const st = s.startTime.toDate();
                    const dur = s.durationMinutes;
                    
                    // JIKA WAKTU HABIS
                    if (st.getTime() + dur * 60000 - now.getTime() <= 0) {
                        processing[i] = true;
                        
                        // KIRIM WA DULU
                        sendFonnte(s.wa, s.userName, s.plat);

                        // HAPUS & NEXT
                        runTransaction(db, async(t) => {
                            const d = (await t.get(ref)).data();
                            d.chargingSlots[i] = null;
                            if (d.waitingQueue.length > 0) {
                                const nextUser = d.waitingQueue.shift();
                                const tar = getTar(d.waitingQueue.length);
                                d.chargingSlots[i] = { ...nextUser, startTime: null, targetLimit: tar, durationMinutes: getDur(nextUser.startBattery, tar) };
                            }
                            t.update(ref, d);
                        }).then(() => processing[i] = false).catch(() => processing[i] = false);
                    }
                }
            });
            if(needsUpdate) updateUI();
        }, 1000);

        // --- ACTIONS ---
        window.reg = () => {
            const p=document.getElementById('rp').value.toUpperCase().replace(/\s/g,'');
            const n=document.getElementById('rn').value, b=parseInt(document.getElementById('rb').value);
            const w=document.getElementById('rw').value || '-';
            if(!p||isNaN(b)) return alert("Isi Data!");
            localStorage.setItem('myPlat', p); myPlat=p;
            
            runTransaction(db, async(t)=>{
                const d=(await t.get(ref)).data();
                let q=d.waitingQueue||[], s=d.chargingSlots||[null,null,null];
                if(q.find(x=>x.plat===p)) throw "Sudah Antri";
                
                const newUser = {plat:p, userName:n, wa:w, startBattery:b, targetLimit:100, durationMinutes:0, startTime:null};
                let emptyIndex = -1;
                for(let i=0; i<3; i++) { if(s[i] == null) { emptyIndex = i; break; } }

                if(emptyIndex !== -1) {
                    const tar = getTar(q.length);
                    newUser.targetLimit = tar;
                    newUser.durationMinutes = getDur(b, tar);
                    s[emptyIndex] = newUser;
                    t.update(ref, {chargingSlots: s});
                } else {
                    q.push(newUser);
                    t.update(ref, {waitingQueue: q});
                }
            }).catch(e=>alert(e));
        };

        window.actStart = (i) => runTransaction(db, async(t)=>{ const d=(await t.get(ref)).data(); const s=d.chargingSlots[i]; s.startTime=new Date(); s.targetLimit=getTar(d.waitingQueue.length); s.durationMinutes=getDur(s.startBattery,s.targetLimit); t.update(ref,d); });
        
        window.actStop = (i) => { 
            if(confirm("Stop Pengisian?")) {
                const s = slots[i];
                if(s) sendFonnte(s.wa, s.userName, s.plat); // MANUAL STOP JUGA KIRIM WA

                runTransaction(db, async(t)=>{ 
                    const d=(await t.get(ref)).data(); d.chargingSlots[i]=null; 
                    if(d.waitingQueue.length>0){
                        const n=d.waitingQueue.shift(); 
                        const tl=getTar(d.waitingQueue.length); 
                        d.chargingSlots[i]={...n, startTime:null, targetLimit:tl, durationMinutes:getDur(n.startBattery,tl)};
                    } 
                    t.update(ref,d); 
                });
            }
        };
        
        window.actEdit = (i) => { const m=prompt("Menit:"); if(m&&!isNaN(m)) runTransaction(db, async(t)=>{ const d=(await t.get(ref)).data(); d.chargingSlots[i].startTime=new Date(); d.chargingSlots[i].durationMinutes=parseInt(m); t.update(ref,d); }); };
        window.actCancel = (i) => { if(confirm("Batal?")) runTransaction(db, async(t)=>{ const d=(await t.get(ref)).data(); d.waitingQueue.splice(i,1); t.update(ref,{waitingQueue:d.waitingQueue}); }).then(()=>{localStorage.removeItem('myPlat'); myPlat=null; location.reload();}); };

        window.toggleAdmin = () => { const p=prompt("Pass:"); if(p==="admin123"){ localStorage.setItem('superAdminAuth','true'); location.reload(); }};
        window.logout = () => { localStorage.clear(); location.reload(); };
        window.admForce = () => { const s=document.getElementById('as').value, p=document.getElementById('ap').value.toUpperCase(), b=parseInt(document.getElementById('ab').value); if(p) runTransaction(db, async(t)=>{ const d=(await t.get(ref)).data(); d.chargingSlots[s]={plat:p, userName:'ADM', startBattery:b||50, targetLimit:100, durationMinutes:60, startTime:new Date()}; t.update(ref,d); }); };
        window.admClear = () => window.actStop(document.getElementById('as').value);
        window.admReset = () => { if(confirm("RESET?")) setDoc(ref,{chargingSlots:[null,null,null],waitingQueue:[]}); };
        window.admMove = () => { const qi=document.getElementById('aq').value, si=document.getElementById('as').value; runTransaction(db, async(t)=>{ const d=(await t.get(ref)).data(); if(d.chargingSlots[si]) throw "Busy"; const i=d.waitingQueue.splice(qi,1)[0]; const tar=getTar(d.waitingQueue.length); d.chargingSlots[si]={...i, startTime:null, targetLimit:tar, durationMinutes:getDur(i.startBattery,tar)}; t.update(ref,d); }); };
        window.admDel = () => { const qi=document.getElementById('aq').value; runTransaction(db, async(t)=>{ const d=(await t.get(ref)).data(); d.waitingQueue.splice(qi,1); t.update(ref,{waitingQueue:d.waitingQueue}); }); };

        window.toggleMusic = () => { const f=document.getElementById('musicFrame'); f.style.height = f.style.height==='0px'?'150px':'0px'; };
    </script>
</body>
</html>
