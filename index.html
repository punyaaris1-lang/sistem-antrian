<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fast Charging V46 (Full Control)</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        /* --- TEMA CYBERPUNK PREMIUM --- */
        :root {
            --bg: #0b101a;
            --glass: rgba(255, 255, 255, 0.05);
            --text: #ffffff;
            --text-muted: #8899a6;
            --cyan: #00e5ff;
            --cyan-dim: rgba(0, 229, 255, 0.1);
            --soft-red: #ff6b6b;
            --neon-yellow: #ccff00; /* KUNING STABILO */
            --border: rgba(255, 255, 255, 0.1);
            --card-bg: rgba(255,255,255,0.03);
            --input-bg: rgba(0, 0, 0, 0.4);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: 'Rajdhani', sans-serif; background-color: var(--bg); color: var(--text); min-height: 100vh; padding: 20px; padding-bottom: 120px; }
        .container { max-width: 480px; margin: 0 auto; position: relative; }

        .header-row { display: flex; justify-content: center; align-items: center; margin-top: 20px; margin-bottom: 5px; }
        h1 { font-family: 'Orbitron', sans-serif; font-size: 24px; margin: 0; background: linear-gradient(to right, #fff, var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 20px rgba(0, 229, 255, 0.3); letter-spacing: 1px; }
        .subtitle { text-align: center; color: var(--text-muted); font-size: 10px; letter-spacing: 2px; margin-bottom: 25px; font-weight: bold; text-transform: uppercase; border-bottom: 1px solid var(--border); padding-bottom: 15px; }

        .glass-card { background: var(--glass); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 20px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-bottom: 25px; }
        label { display: block; font-family: 'Orbitron'; font-size: 10px; color: var(--text-muted); margin-bottom: 8px; letter-spacing: 1px; }
        input.field { width: 100%; background: var(--input-bg); border: 1px solid var(--border); color: var(--text); padding: 15px; border-radius: 10px; font-family: 'Rajdhani'; font-size: 20px; font-weight: 700; outline: none; transition: 0.3s; margin-bottom: 15px; text-align: center; }
        input.field:focus { border-color: var(--cyan); box-shadow: 0 0 10px var(--cyan-dim); }

        .btn-cyan { width: 100%; background: linear-gradient(90deg, var(--cyan), #00bcd4); border: none; padding: 16px; border-radius: 10px; color: #000; font-family: 'Orbitron'; font-weight: 800; font-size: 16px; cursor: pointer; box-shadow: 0 0 20px var(--cyan-dim); margin-top: 5px; }
        
        .slots-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 30px; }
        .slot-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 15px; padding: 10px 5px; text-align: center; min-height: 160px; display: flex; flex-direction: column; justify-content: center; position: relative; }
        .slot-box.active { border-color: var(--cyan); background: var(--cyan-dim); }

        .bat-icon { width: 36px; height: 60px; border: 2px solid var(--text-muted); border-radius: 6px; position: relative; margin: 0 auto 10px; display: flex; align-items: flex-end; padding: 2px; }
        .bat-icon::before { content: ''; position: absolute; top: -5px; left: 10px; width: 12px; height: 3px; background: var(--text-muted); }
        .bat-fill { width: 100%; background: var(--cyan); border-radius: 3px; transition: height 0.5s; box-shadow: 0 0 10px var(--cyan); }
        .bat-bolt { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 20px; color: #fff; text-shadow: 0 0 5px #000; z-index: 2; }
        .slot-box.active .bat-icon { border-color: var(--cyan); }
        
        .btn-act { width: 100%; padding: 8px; border-radius: 6px; border: none; font-weight: bold; font-family: 'Orbitron'; font-size: 11px; margin-top: auto; cursor: pointer; }
        .btn-start { background: var(--cyan); color: #000; }
        .btn-stop { background: rgba(255, 107, 107, 0.1); border: 1px solid var(--soft-red); color: var(--soft-red); }

        /* INFO BOX NEON BERKEDIP (PERMINTAAN BARU) */
        @keyframes neonPulse {
            0% { box-shadow: 0 0 5px var(--neon-yellow); border-color: var(--neon-yellow); opacity: 1; }
            50% { box-shadow: 0 0 20px var(--neon-yellow), 0 0 10px var(--neon-yellow) inset; border-color: #fff; opacity: 0.8; }
            100% { box-shadow: 0 0 5px var(--neon-yellow); border-color: var(--neon-yellow); opacity: 1; }
        }
        
        .rule-info { 
            font-size: 16px; color: var(--neon-yellow); text-align: center; 
            margin-top: 15px; font-family: 'Orbitron'; font-weight: bold;
            padding: 15px; border-radius: 10px; border: 2px solid var(--neon-yellow);
            background: rgba(204, 255, 0, 0.05);
            animation: neonPulse 1.5s infinite alternate; /* KEDIP */
            text-shadow: 0 0 10px var(--neon-yellow);
            display: none; /* Hidden by default */
        }

        /* MODAL */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-box { background: var(--bg); border: 2px solid var(--cyan); padding: 25px; border-radius: 20px; width: 85%; max-width: 320px; text-align: center; animation: pop 0.3s; }
        .modal-btns { display: flex; gap: 10px; }
        .btn-modal { flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-family: 'Orbitron'; background: #333; color: #fff; }
        .btn-modal.primary { background: var(--cyan); color: #000; }
        .btn-modal.danger { background: var(--soft-red); color: #fff; }

        .admin-trigger { text-align: center; margin-top: 40px; padding: 12px; font-size: 12px; letter-spacing: 2px; color: #333; cursor: pointer; font-weight: bold; border-radius: 8px; transition: 0.3s; }
        .admin-trigger:hover { color: var(--cyan); text-shadow: 0 0 10px var(--cyan); }
        
        .admin-panel { display: none; background: #000; padding: 20px; border-radius: 15px; border: 1px solid var(--soft-red); margin-top: 20px; box-shadow: 0 0 20px rgba(255, 107, 107, 0.2); }
        .adm-btn { width: 100%; padding: 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; font-family: 'Orbitron'; margin-bottom: 8px; font-size: 12px; letter-spacing: 1px; transition: 0.2s; }
        .adm-btn:active { transform: scale(0.98); }
        .adm-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .adm-input { background: #222; border: 1px solid #444; color: #fff; padding: 10px; width: 100%; border-radius: 6px; }

        .footer { text-align: center; margin-top: 40px; font-family: 'Orbitron'; font-size: 12px; color: var(--cyan); font-weight: 900; letter-spacing: 2px; text-shadow: 0 0 15px var(--cyan-dim); }
        @keyframes pop { from{transform:scale(0.8); opacity:0} to{transform:scale(1); opacity:1} }
    </style>
</head>
<body>

    <audio id="alarmSound" loop preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mp3">
    </audio>

    <div id="masterModal" class="modal">
        <div id="modalBox" class="modal-box">
            <span id="mIcon" style="font-size:40px; display:block; margin-bottom:10px;">✅</span>
            <h3 id="mTitle" style="font-family:'Orbitron'; margin:0 0 10px; color:var(--text)">TITLE</h3>
            <p id="mMsg" style="color:var(--text-muted); font-size:14px; margin-bottom:20px;">Message</p>
            <input type="password" id="mInput" style="display:none; width:100%; padding:10px; text-align:center; margin-bottom:15px; border-radius:5px;" placeholder="PIN">
            <div class="modal-btns">
                <button id="mBtnCancel" class="btn-modal" style="display:none;">BATAL</button>
                <button id="mBtnOk" class="btn-modal primary">OK</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="header-row"><h1>FAST CHARGING</h1></div>
        <div class="subtitle">KELAPA GADING | HOME OF MLU</div>

        <div class="glass-card">
            <label>PLAT NOMOR</label>
            <input id="userPlat" class="field" placeholder="B 1234 XYZ" style="text-transform:uppercase;">
            <label>NOMOR WHATSAPP</label>
            <input id="userWa" class="field" type="number" placeholder="08xxxxxxxxxx">
            <label>BATERAI (%)</label>
            <input id="userBattery" type="number" class="field" placeholder="0 - 99">
            
            <div id="ruleInfo" class="rule-info"></div>
            
            <button id="btnDaftar" class="btn-cyan">DAFTAR ANTRIAN</button>
        </div>

        <div style="display:flex; align-items:center; gap:10px; margin-bottom:15px;">
            <div style="width:8px; height:8px; background:var(--cyan); border-radius:50%; box-shadow:0 0 10px var(--cyan);"></div>
            <span style="font-family:'Orbitron'; font-size:12px; color:var(--text);">STATUS 3 SLOT</span>
        </div>

        <div class="slots-grid" id="slotsContainer">
            <div style="grid-column:1/-1; text-align:center; padding:30px; color:var(--text-muted);">Loading System...</div>
        </div>

        <div class="glass-card" style="padding:15px; min-height:100px;">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px; border-bottom:1px solid var(--border); padding-bottom:10px;">
                <span style="font-family:'Orbitron'; font-size:12px; color:var(--text);">DAFTAR TUNGGU</span>
                <span id="qCount" style="font-size:12px; color:var(--cyan);">0</span>
            </div>
            <div id="queueList"></div>
        </div>

        <div class="admin-trigger" onclick="openAdminLogin()">🔒 ADMIN CONTROL PANEL</div>
        <div id="adminPanel" class="admin-panel">
            <h4 style="color:var(--soft-red); text-align:center; margin-top:0;">MASTER CONTROL</h4>
            
            <label style="color:#fff; margin-top:10px;">MANAJEMEN SLOT</label>
            <div class="adm-row">
                <select id="manSlot" class="adm-input" style="width:70%"><option value="0">Slot 1</option><option value="1">Slot 2</option><option value="2">Slot 3</option></select>
                <button onclick="clearSlotManual()" class="adm-btn" style="background:#444; color:#fff; width:30%;">HAPUS</button>
            </div>

            <label style="color:#fff; margin-top:5px;">AKSI MASSAL</label>
            <button onclick="fillFromQueue()" class="adm-btn" style="background:var(--cyan); color:#000;">⬆️ NAIKKAN ANTRIAN (AUTO)</button>
            <button onclick="startAllSlots()" class="adm-btn" style="background:var(--neon-yellow); color:#000;">⚡ MULAI SEMUA SLOT</button>
            
            <label style="color:#fff; margin-top:10px;">KEAMANAN</label>
            <div class="adm-row">
                <input id="blockPlatInput" placeholder="Plat Blokir" class="adm-input">
                <button onclick="blockUser()" class="adm-btn" style="width:30%; background:var(--soft-red); color:#fff;">BLOK</button>
            </div>

            <label style="color:#fff; margin-top:10px;">ZONA BAHAYA</label>
            <button onclick="resetAll()" class="adm-btn" style="border:1px solid var(--soft-red); background:none; color:var(--soft-red);">RESET DATA TOTAL</button>

            <div onclick="document.getElementById('adminPanel').style.display='none'" style="text-align:center; margin-top:15px; font-size:10px; color:#555; cursor:pointer;">Tutup Panel</div>
        </div>
        
        <div class="footer">Created by : MLU SQUAD</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, runTransaction, setDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        const FONNTE_TOKEN = "Fc8dWb7jiKr7CXuEZXBx"; // Token User
        
        const firebaseConfig = { apiKey: "AIzaSyALIlkIDALIk83K8s1htalvW6rmNNw02Go", authDomain: "sistem-antrian-b1c39.firebaseapp.com", projectId: "sistem-antrian-b1c39", storageBucket: "sistem-antrian-b1c39.firebasestorage.app", messagingSenderId: "454124587608", appId: "1:454124587608:web:34fbb0f5211067a67f982d" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const ref = doc(db, "antrian", "utama");

        let isAdminLoggedIn = false;
        let triggeredAlarms = new Set();
        const alarmAudio = document.getElementById('alarmSound');

        // --- WA SENDER ---
        async function scheduleWhatsapp(target, plat, durationMinutes, targetPersen) {
            const now = new Date();
            const sendTime = new Date(now.getTime() + durationMinutes * 60000);
            const scheduleTime = sendTime.toISOString().slice(0, 19).replace('T', ' '); // Simple format

            const msg = `Halo! Pengecasan motor *${plat}* telah selesai (Target ${targetPersen}%). Mohon segera dicek. Terima kasih!`;
            const formData = new FormData();
            formData.append("target", target); formData.append("message", msg); formData.append("schedule", 0); // 0 = Kirim delay sesuai server (tapi Fonnte butuh waktu spesifik, kita pakai fetch langsung tanpa schedule untuk start instant notification or use delay)
            // Revisi: Karena startRealTime, kita kirim pesan NANTI. Fonnte butuh format YYYY-MM-DD HH:mm:ss
            
            // Format Manual YYYY-MM-DD HH:mm:ss
            const y = sendTime.getFullYear();
            const m = String(sendTime.getMonth()+1).padStart(2,'0');
            const d = String(sendTime.getDate()).padStart(2,'0');
            const h = String(sendTime.getHours()).padStart(2,'0');
            const min = String(sendTime.getMinutes()).padStart(2,'0');
            const s = String(sendTime.getSeconds()).padStart(2,'0');
            const fmtTime = `${y}-${m}-${d} ${h}:${min}:${s}`;
            
            formData.set("schedule", fmtTime);
            formData.append("countryCode", "62"); 

            try { fetch("https://api.fonnte.com/send", { method: "POST", headers: { "Authorization": FONNTE_TOKEN }, body: formData }); } catch(e){}
        }

        // --- DAFTAR ---
        document.getElementById('btnDaftar').onclick = async () => {
            const btn = document.getElementById('btnDaftar');
            const plat = document.getElementById('userPlat').value.toUpperCase().trim();
            const wa = document.getElementById('userWa').value.trim();
            const bat = parseInt(document.getElementById('userBattery').value);

            if(!plat || !wa || isNaN(bat)) { showPopup('error','DATA KURANG','Isi semua data.'); return; }
            btn.disabled=true; btn.innerText="PROSES...";

            localStorage.setItem('myPlat', plat);

            try {
                await runTransaction(db, async(t)=>{
                    const d = (await t.get(ref)).data() || {};
                    let s = d.chargingSlots || [null,null,null];
                    let q = d.waitingQueue || [];

                    if((d.blockedList||[]).includes(plat)) throw "Plat DIBLOKIR!";
                    if(s.some(x=>x?.name===plat) || q.some(x=>x?.name===plat)) throw "Sudah Terdaftar!";

                    // RULE MAKA
                    const totalAntrian = s.filter(x => x !== null).length + q.length;
                    let targetLimit = 100;
                    if(totalAntrian < 3) targetLimit = 100;
                    else if(totalAntrian <= 6) targetLimit = 95;
                    else if(totalAntrian <= 10) targetLimit = 90;
                    else targetLimit = 85;

                    if(bat >= targetLimit) throw `Baterai cukup (${bat}%). Batas saat ini ${targetLimit}%.`;

                    let minutes = 0;
                    for(let b = bat; b < targetLimit; b++) {
                        if(b >= 90) minutes += 2.2; else if(b >= 80) minutes += 1.5; else minutes += 0.8;
                    }
                    let dur = Math.ceil(minutes); if(dur < 2) dur = 2;

                    const item = { name:plat, phone:wa, startBattery:bat, targetLimit:targetLimit, durationMinutes:dur, startTime:null };
                    const empty = s.findIndex(x=>x===null);
                    if(empty!==-1) s[empty] = item; else q.push(item);
                    t.set(ref, {chargingSlots:s, waitingQueue:q}, {merge:true});
                });
                showPopup('success','BERHASIL','Masuk Antrian.');
                document.getElementById('userPlat').value=''; document.getElementById('userBattery').value=''; document.getElementById('userWa').value='';
                document.getElementById('ruleInfo').style.display='none';
            } catch(e) { showPopup('error','GAGAL', e); }
            btn.disabled=false; btn.innerText="DAFTAR ANTRIAN";
        };

        // --- RENDER ---
        onSnapshot(ref, (snap) => {
            const d = snap.data() || {};
            const slots = d.chargingSlots || [null,null,null];
            
            // LOGIKA TAMPILAN NEON BOX
            const q = d.waitingQueue || [];
            const occupied = slots.filter(x => x !== null).length;
            const total = occupied + q.length;
            
            const infoBox = document.getElementById('ruleInfo');
            if(total > 0) {
                let limit = 100;
                if(total < 3) limit = 100;
                else if(total <= 6) limit = 95;
                else if(total <= 10) limit = 90;
                else limit = 85;
                
                infoBox.style.display = 'block';
                // TEKS BARU SESUAI REQUEST
                infoBox.innerHTML = `ANTRIAN: ${total} UNIT<br>MAX CHARGING: ${limit}%`;
            } else {
                infoBox.style.display = 'none';
            }

            document.getElementById('slotsContainer').innerHTML = slots.map((x,i)=>{
                if(!x) return `<div class="slot-box" style="opacity:0.5; border-style:dashed;"><div class="bat-icon" style="border-color:var(--text-muted)"></div><div style="font-size:12px; color:var(--text-muted)">KOSONG</div></div>`;

                const isRun = !!x.startTime; 
                let btn = isRun ? 
                    `<button class="btn-act btn-stop" onclick="window.act(${i},'stop', '${x.name}')">STOP</button>` :
                    `<button class="btn-act btn-start" onclick="window.act(${i},'start', '${x.name}')">MULAI</button>`;
                
                let time = `<div style="font-size:10px; color:var(--cyan);">Tap MULAI</div>`;
                let h = x.startBattery;
                let targetInfo = `<div style="font-size:9px; color:var(--neon-yellow);">Target: ${x.targetLimit}%</div>`;

                if(isRun) {
                    const start = x.startTime.seconds ? x.startTime.seconds*1000 : new Date(x.startTime).getTime();
                    const end = start + (x.durationMinutes*60000);
                    const now = Date.now();
                    const diff = end - now;

                    if(diff > 0) {
                        const m = Math.floor(diff/60000);
                        const s = Math.floor((diff%60000)/1000);
                        time = `<div style="font-size:16px; font-weight:bold; color:var(--cyan); margin:5px 0;">${m}:${s<10?'0'+s:s}</div>`;
                        h = 100; 
                    } else {
                        time = `<div style="font-size:16px; font-weight:bold; color:var(--soft-red);">SELESAI</div>`;
                        const key = x.name+end;
                        if(!triggeredAlarms.has(key)) { 
                            triggeredAlarms.add(key); 
                            if(isAdminLoggedIn || localStorage.getItem('myPlat')===x.name) {
                                alarmAudio.play().catch(()=>{}); 
                                showPopup('alarm','SELESAI', `Plat ${x.name}`);
                            }
                        }
                    }
                }
                return `
                    <div class="slot-box active">
                        <div class="bat-icon"><div class="bat-fill" style="height:${h}%"></div><div class="bat-bolt">⚡</div></div>
                        <div style="font-weight:bold;">${x.name}</div>
                        ${targetInfo}
                        ${time}
                        ${btn}
                    </div>`;
            }).join('');

            document.getElementById('qCount').innerText = q.length;
            document.getElementById('queueList').innerHTML = q.length ? q.map((x,i)=>`
                <div style="display:flex; justify-content:space-between; padding:10px; background:var(--card-bg); margin-bottom:5px; border-radius:8px;">
                    <div><b>${x.name}</b> <span style="font-size:11px;">(${x.startBattery}% -> ${x.targetLimit}%)</span></div>
                    <button onclick="window.delQ(${i}, '${x.name}')" style="background:none; border:none; color:var(--soft-red);">✕</button>
                </div>
            `).join('') : '<div style="text-align:center; color:#555; font-size:12px;">Antrian Kosong</div>';
        });

        // --- ACTIONS ---
        window.act = (i, type, platName) => {
            const myPlat = localStorage.getItem('myPlat');
            // ADMIN OVERRIDE: Admin boleh stop punya siapa saja
            if(type === 'stop' && !isAdminLoggedIn && myPlat !== platName) return showPopup('error', 'AKSES DITOLAK', 'Bukan kendaraan Anda!');
            
            // Konfirmasi Stop
            if(type === 'stop') {
                showPopup('confirm', 'STOP', 'Stop Slot ini?', () => {
                    runTransaction(db, async(t)=>{
                        const d = (await t.get(ref)).data();
                        let s = d.chargingSlots; let q = d.waitingQueue;
                        s[i]=null; 
                        // Auto fill logic removed from STOP, used manual promote instead to be safe
                        t.update(ref, {chargingSlots:s});
                    });
                    alarmAudio.pause(); alarmAudio.currentTime=0;
                });
            } else if (type === 'start') {
                runTransaction(db, async(t)=>{
                    const d = (await t.get(ref)).data();
                    const s = d.chargingSlots;
                    if(s[i]) {
                        if(s[i].phone) scheduleWhatsapp(s[i].phone, s[i].name, s[i].durationMinutes, s[i].targetLimit);
                        s[i].startTime = new Date();
                        t.update(ref, {chargingSlots:s});
                    }
                });
            }
        };

        window.delQ = (i, platName) => {
            if(!isAdminLoggedIn && localStorage.getItem('myPlat') !== platName) return showPopup('error', 'AKSES DITOLAK', 'Bukan antrian Anda!');
            showPopup('confirm','HAPUS', 'Hapus antrian?', () => {
                runTransaction(db, async(t)=>{ const q = (await t.get(ref)).data().waitingQueue; q.splice(i,1); t.update(ref, {waitingQueue:q}); });
            });
        };

        // --- ADMIN FEATURES (NEW) ---
        window.openAdminLogin = () => showPopup('admin', 'ADMIN LOGIN', 'Masukkan PIN');
        
        window.clearSlotManual = () => {
            const i = document.getElementById('manSlot').value;
            showPopup('confirm', 'HAPUS', `Kosongkan Slot ${parseInt(i)+1}?`, () => {
                runTransaction(db, async(t)=>{
                    const s = (await t.get(ref)).data().chargingSlots;
                    s[i] = null;
                    t.update(ref, {chargingSlots:s});
                });
            });
        };

        window.fillFromQueue = () => {
            runTransaction(db, async(t) => {
                const d = (await t.get(ref)).data();
                let s = d.chargingSlots;
                let q = d.waitingQueue;

                if(q.length === 0) throw "Antrian Kosong!";
                const emptyIdx = s.findIndex(x => x === null);
                if(emptyIdx === -1) throw "Semua Slot Penuh!";

                // Pindahkan yg pertama
                const mover = q.shift();
                s[emptyIdx] = mover;
                t.update(ref, {chargingSlots:s, waitingQueue:q});
            }).catch(e => showPopup('error', 'GAGAL', e));
        };

        window.startAllSlots = () => {
            showPopup('confirm', 'MULAI SEMUA', 'Start semua slot & kirim WA?', () => {
                runTransaction(db, async(t)=>{
                    const d = (await t.get(ref)).data();
                    let s = d.chargingSlots;
                    let startedCount = 0;
                    
                    s.forEach((slot, idx) => {
                        if(slot && !slot.startTime) {
                            if(slot.phone) scheduleWhatsapp(slot.phone, slot.name, slot.durationMinutes, slot.targetLimit);
                            slot.startTime = new Date();
                            startedCount++;
                        }
                    });
                    
                    if(startedCount > 0) t.update(ref, {chargingSlots:s});
                });
            });
        };

        window.blockUser = async () => {
            const p = document.getElementById('blockPlatInput').value.toUpperCase().trim();
            if(!p) return;
            await runTransaction(db, async (t) => {
                const d = (await t.get(ref)).data(); const l = d.blockedList || [];
                if (!l.includes(p)) l.push(p); t.update(ref, {blockedList: l});
            });
            showPopup('success', 'BLOKIR', `Plat ${p} diblokir.`);
        };

        window.resetAll = () => {
            showPopup('confirm', 'RESET', 'Hapus SEMUA data?', () => {
                setDoc(ref, {chargingSlots:[null,null,null], waitingQueue:[], blockedList:[]});
            });
        };

        function showPopup(type, title, msg, onOk = null) {
            const m = document.getElementById('masterModal');
            const box = document.getElementById('modalBox');
            const icon = document.getElementById('mIcon');
            const t = document.getElementById('mTitle');
            const ms = document.getElementById('mMsg');
            const btnOk = document.getElementById('mBtnOk');
            const btnCancel = document.getElementById('mBtnCancel');
            const inp = document.getElementById('mInput');

            m.style.display = 'flex'; m.className = 'modal'; 
            box.style.borderColor = 'var(--cyan)';
            t.innerText = title; ms.innerHTML = msg; 
            inp.style.display = 'none'; btnCancel.style.display = 'none';
            btnOk.className = 'btn-modal primary'; btnOk.innerText = 'OK';
            btnOk.onclick = null; 

            if(type === 'confirm') {
                icon.innerText = '❓'; btnCancel.style.display = 'block'; btnOk.innerText = 'YA';
                btnCancel.onclick = () => m.style.display = 'none';
                btnOk.onclick = () => { m.style.display = 'none'; if(onOk) onOk(); };
            }
            else if(type === 'error') { icon.innerText = '❌'; box.style.borderColor = 'var(--soft-red)'; btnOk.className = 'btn-modal danger'; btnOk.innerText = 'TUTUP'; btnOk.onclick = () => m.style.display = 'none'; }
            else if(type === 'alarm') { icon.innerText = '🔔'; box.style.borderColor = 'var(--soft-red)'; btnOk.className = 'btn-modal danger'; btnOk.innerText = 'MATIKAN ALARM'; btnOk.onclick = () => { alarmAudio.pause(); alarmAudio.currentTime=0; m.style.display = 'none'; }; }
            else if(type === 'admin') {
                icon.innerText = '🔒'; inp.style.display = 'block'; inp.value=''; inp.focus(); btnOk.innerText = 'LOGIN'; btnCancel.style.display = 'block'; btnCancel.onclick = () => m.style.display = 'none';
                btnOk.onclick = () => { if(inp.value === '1131') { m.style.display = 'none'; document.getElementById('adminPanel').style.display = 'block'; isAdminLoggedIn = true; } else showPopup('error','GAGAL','PIN Salah!'); };
            } else { icon.innerText = '✅'; btnOk.onclick = () => m.style.display = 'none'; }
        }
        
        setInterval(() => { document.querySelectorAll('[data-end]').forEach(el => {}); }, 1000);
    </script>
</body>
</html>
