<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MLU SUPER APP</title>
    
    <link rel="manifest" href="manifest.json">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; height: 100vh; overflow: hidden;
            background-color: #0b101a;
            background-image: url('1763947427555.jpg'); 
            background-size: cover; background-position: center; background-attachment: fixed;
            font-family: 'Rajdhani', sans-serif;
            display: flex; flex-direction: column; align-items: center; 
        }

        body::before {
            content: ''; position: absolute; inset: 0;
            background: rgba(0, 0, 0, 0.75); z-index: -1;
        }

        .logo-area { 
            text-align: center; margin-top: 60px; margin-bottom: 30px; z-index: 10;
        }
        
        h1 { 
            font-family: 'Orbitron', sans-serif; font-size: 42px; margin: 0; 
            color: #fff; letter-spacing: 3px; text-shadow: 0 0 20px #00bcd4;
        }
        
        .squad-text {
            font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: bold; 
            color: #000; background: #ccff00; padding: 5px 15px; border-radius: 5px; 
            margin-top: 5px; display: inline-block; border: 2px solid #fff;
            animation: blink 1.5s infinite; letter-spacing: 1px;
        }
        @keyframes blink { 50% { opacity: 0.6; } }

        .menu-grid { 
            display: grid; gap: 15px; width: 85%; max-width: 400px; margin-top: 10px; z-index: 10;
        }
        
        .menu-btn {
            background: rgba(255, 255, 255, 0.1); border: 1px solid #00bcd4; 
            padding: 20px; border-radius: 20px; cursor: pointer;
            display: flex; align-items: center; gap: 20px; text-decoration: none; 
            backdrop-filter: blur(10px); transition: 0.2s; 
            box-shadow: 0 0 15px rgba(0, 188, 212, 0.1);
        }
        
        .menu-btn:active { transform: scale(0.96); background: #00bcd4; }
        .menu-btn:active h3, .menu-btn:active span { color: #000; }
        
        .menu-icon { 
            font-size: 28px; width: 55px; height: 55px;
            background: rgba(0, 229, 255, 0.1); border: 1px solid #00bcd4; border-radius: 15px;
            display: flex; align-items: center; justify-content: center; color: #00bcd4;
            box-shadow: 0 0 10px rgba(0, 188, 212, 0.3);
        }
        
        .menu-text { text-align: left; }
        .menu-text h3 { margin: 0; font-family: 'Orbitron', sans-serif; font-size: 16px; color: #fff; letter-spacing: 1px; }
        .menu-text span { font-size: 11px; color: #aaa; font-weight: bold; }

        .footer { position: absolute; bottom: 20px; font-size: 10px; color: #00bcd4; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; }
        
        /* LAYAR TRANSPARAN JEBAKAN KLIK */
        #installTrap {
            position: fixed; inset: 0; z-index: 9999;
            display: none; /* Muncul kalau PWA siap */
        }
    </style>
</head>
<body>

    <div id="installTrap"></div>

    <div class="logo-area">
        <h1>MLU APPS</h1>
        <div class="squad-text">MAKA LINTAS UTARA SQUAD</div>
    </div>

    <div class="menu-grid">
        <a href="lokasi.html" class="menu-btn">
            <div class="menu-icon">📍</div>
            <div class="menu-text"><h3>LOKASI FC</h3><span>Cari charging station</span></div>
        </a>

        <a href="sos.html" class="menu-btn">
            <div class="menu-icon">🆘</div>
            <div class="menu-text"><h3>BANTUAN SOS</h3><span>Layanan Darurat</span></div>
        </a>

        <a href="antrian.html" class="menu-btn">
            <div class="menu-icon">⚡</div>
            <div class="menu-text"><h3>ANTRIAN ONLINE</h3><span>Daftar & Pantau</span></div>
        </a>
    </div>

    <div class="footer">v10.4 Final | MLU Squad</div>

    <script>
        // 1. Service Worker
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }

        // 2. Logic Install "Stealth Mode"
        let deferredPrompt;
        const trap = document.getElementById('installTrap');

        // Saat browser siap install, aktifkan jebakan layar
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            // Munculkan layar transparan di paling atas
            trap.style.display = 'block';
        });

        // Saat user klik DIMANAPUN (kena jebakan)
        trap.addEventListener('click', async () => {
            if (deferredPrompt) {
                // Hapus jebakan agar user bisa klik menu asli
                trap.style.display = 'none';
                // Munculkan Pop-up Install
                deferredPrompt.prompt();
                // Tunggu hasil (Install/Tolak)
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`User response: ${outcome}`);
                deferredPrompt = null;
            }
        });
