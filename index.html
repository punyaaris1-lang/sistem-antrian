<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fast Charging V53 (Fixed Event)</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        /* --- TEMA LIGHT MODE (PUTIH + BACKGROUND) --- */
        :root {
            --bg-overlay: rgba(255, 255, 255, 0.92);
            --glass: rgba(255, 255, 255, 0.85);
            --text: #333333;
            --text-muted: #666666;
            --cyan: #00a8cc;
            --cyan-dim: rgba(0, 168, 204, 0.1);
            --soft-red: #d63031;
            --neon-yellow: #f1c40f;
            --border: rgba(0, 0, 0, 0.1);
            --card-bg: rgba(240, 242, 245, 0.9);
            --input-bg: rgba(255, 255, 255, 0.95);
            --shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; font-family: 'Rajdhani', sans-serif; color: var(--text); min-height: 100vh; padding: 20px; padding-bottom: 120px;
            background-image: url('https://i.ibb.co/WHd0j8h/image-6.jpg'); 
            background-size: cover; background-position: center; background-attachment: fixed; position: relative;
        }
        body::before { content: ''; position: absolute; inset: 0; background: var(--bg-overlay); z-index: -1; }

        .container { max-width: 480px; margin: 0 auto; position: relative; }
        .header-row { display: flex; justify-content: center; align-items: center; margin-top: 20px; margin-bottom: 5px; }
        h1 { font-family: 'Orbitron', sans-serif; font-size: 24px; margin: 0; color: var(--text); text-shadow: 1px 1px 2px rgba(0,0,0,0.1); letter-spacing: 1px; }
        .subtitle { text-align: center; color: var(--text-muted); font-size: 10px; letter-spacing: 2px; margin-bottom: 25px; font-weight: bold; text-transform: uppercase; border-bottom: 1px solid var(--border); padding-bottom: 15px; }

        .glass-card { background: var(--glass); backdrop-filter: blur(5px); border: 1px solid var(--border); border-radius: 20px; padding: 25px; box-shadow: var(--shadow); margin-bottom: 25px; }
        label { display: block; font-family: 'Orbitron'; font-size: 10px; color: var(--text-muted); margin-bottom: 8px; letter-spacing: 1px; font-weight: bold; }
        input.field { width: 100%; background: var(--input-bg); border: 2px solid var(--border); color: var(--text); padding: 15px; border-radius: 10px; font-family: 'Rajdhani'; font-size: 20px; font-weight: 700; outline: none; transition: 0.3s; margin-bottom: 15px; text-align: center; }
        input.field:focus { border-color: var(--cyan); box-shadow: 0 0 5px var(--cyan-dim); }
        .btn-cyan { width: 100%; background: linear-gradient(90deg, var(--cyan), #00ceef); border: none; padding: 16px; border-radius: 10px; color: #fff; font-family: 'Orbitron'; font-weight: 800; font-size: 16px; cursor: pointer; box-shadow: var(--shadow); margin-top: 5px; }
        .btn-cyan:active { transform: scale(0.98); }

        .slots-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 30px; }
        .slot-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 15px; padding: 10px 5px; text-align: center; min-height: 160px; display: flex; flex-direction: column; justify-content: center; position: relative; box-shadow: var(--shadow); }
        .slot-box.active { border: 2px solid var(--cyan); background: #e3fcff; }
        .bat-icon { width: 36px; height: 60px; border: 3px solid var(--text-muted); border-radius: 6px; position: relative; margin: 0 auto 10px; display: flex; align-items: flex-end; padding: 2px; background: #fff; }
        .bat-icon::before { content: ''; position: absolute; top: -6px; left: 10px; width: 12px; height: 4px; background: var(--text-muted); }
        .bat-fill { width: 100%; background: var(--cyan); border-radius: 2px; transition: height 0.5s; }
        .bat-bolt { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 24px; color: var(--text); z-index: 2; }
        .slot-box.active .bat-icon { border-color: var(--cyan); }
        .slot-box.active .bat-icon::before { background: var(--cyan); }

        .btn-act { width: 100%; padding: 8px; border-radius: 6px; border: none; font-weight: bold; font-family: 'Orbitron'; font-size: 11px; margin-top: auto; cursor: pointer; }
        .btn-start { background: var(--cyan); color: #fff; }
        .btn-stop { background: #ffecec; border: 1px solid var(--soft-red); color: var(--soft-red); }

        .rule-info { font-size: 14px; color: #fff; text-align: center; margin-top: 15px; font-family: 'Orbitron'; font-weight: bold; padding: 10px; border-radius: 10px; background: var(--cyan); box-shadow: var(--shadow); display: none; }
        
        .admin-trigger { text-align: center; margin-top: 40px; padding: 12px; font-size: 12px; letter-spacing: 2px; color: var(--text-muted); cursor: pointer; font-weight: bold; border-radius: 8px; border: 1px dashed var(--border); }
        .admin-panel { display: none; background: #fff; padding: 20px; border-radius: 15px; border: 2px solid var(--soft-red); margin-top: 20px; box-shadow: var(--shadow); }
        .adm-btn { width: 100%; padding: 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; font-family: 'Orbitron'; margin-bottom: 8px; font-size: 12px; }
        .adm-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .adm-input { background: #f9f9f9; border: 1px solid #ddd; color: var(--text); padding: 10px; width: 100%; border-radius: 6px; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 9999; align-items: center; justify-content: center; }
        .modal-box { background: #fff; border: 2px solid var(--cyan); padding: 25px; border-radius: 20px; width: 85%; max-width: 320px; text-align: center; animation: pop 0.3s; box-shadow: var(--shadow); }
        .modal-btns { display: flex; gap: 10px; }
        .btn-modal { flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-family: 'Orbitron'; background: #eee; color: var(--text); }
        .btn-modal.primary { background: var(--cyan); color: #fff; }
        .btn-modal.danger { background: var(--soft-red); color: #fff; }

        .footer { text-align: center; margin-top: 40px; font-family: 'Orbitron'; font-size: 12px; color: var(--cyan); font-weight: 900; letter-spacing: 2px; }
        @keyframes pop { from{transform:scale(0.8); opacity:0} to{transform:scale(1); opacity:1} }
    </style>
</head>
<body>

    <audio id="alarmSound" loop preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mp3">
    </audio>

    <div id="masterModal" class="modal">
        <div id="modalBox" class="modal-box">
            <span id="mIcon" style="font-size:40px; display:block; margin-bottom:10px;">✅</span>
            <h3 id="mTitle" style="font-family:'Orbitron'; margin:0 0 10px; color:var(--text)">TITLE</h3>
            <p id="mMsg" style="color:var(--text-muted); font-size:14px; margin-bottom:20px;">Message</p>
            <input type="password" id="mInput" style="display:none; width:100%; padding:10px; text-align:center; margin-bottom:15px; border-radius:5px; border:1px solid #ddd;" placeholder="PIN">
            <div class="modal-btns">
                <button id="mBtnCancel" class="btn-modal">BATAL</button>
                <button id="mBtnOk" class="btn-modal primary">OK</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="header-row"><h1>FAST CHARGING</h1></div>
        <div class="subtitle">KELAPA GADING | HOME OF MLU</div>

        <div class="glass-card">
            <label>PLAT NOMOR</label>
            <input id="userPlat" class="field" placeholder="B 1234 XYZ" style="text-transform:uppercase;">
            
            <label>NOMOR WHATSAPP</label>
            <div style="display:flex; gap:5px;">
                <input id="userWa" class="field" type="number" placeholder="08xxxxxxxxxx" style="margin-bottom:0;">
                <button id="btnTestWA" style="width:60px; background:#ddd; border:none; border-radius:10px; cursor:pointer; font-weight:bold; font-size:10px;">TES WA</button>
            </div>
            <div style="font-size:10px; color:var(--text-muted); margin-bottom:15px; text-align:right;">*Klik TES WA untuk cek koneksi</div>

            <label>BATERAI (%)</label>
            <input id="userBattery" type="number" class="field" placeholder="0 - 99">
            
            <div id="ruleInfo" class="rule-info"></div>
            
            <button id="btnDaftar" class="btn-cyan">DAFTAR ANTRIAN</button>
        </div>

        <div style="display:flex; align-items:center; gap:10px; margin-bottom:15px;">
            <div style="width:8px; height:8px; background:var(--cyan); border-radius:50%;"></div>
            <span style="font-family:'Orbitron'; font-size:12px; color:var(--text);">STATUS 3 SLOT</span>
        </div>

        <div class="slots-grid" id="slotsContainer">
            <div style="grid-column:1/-1; text-align:center; padding:30px; color:var(--text-muted);">Loading System...</div>
        </div>

        <div class="glass-card" style="padding:15px; min-height:100px;">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px; border-bottom:1px solid var(--border); padding-bottom:10px;">
                <span style="font-family:'Orbitron'; font-size:12px; color:var(--text);">DAFTAR TUNGGU</span>
                <span id="qCount" style="font-size:12px; color:var(--cyan);">0</span>
            </div>
            <div id="queueList"></div>
        </div>

        <div id="btnAdminTrigger" class="admin-trigger">🔒 ADMIN CONTROL PANEL</div>
        <div id="adminPanel" class="admin-panel">
            <h4 style="color:var(--soft-red); text-align:center; margin-top:0;">MASTER CONTROL</h4>
            <div class="adm-row">
                <select id="manSlot" class="adm-input" style="width:70%"><option value="0">Slot 1</option><option value="1">Slot 2</option><option value="2">Slot 3</option></select>
                <button id="btnClearSlot" class="adm-btn" style="background:#666; color:#fff; width:30%;">HAPUS</button>
            </div>
            <button id="btnFillQueue" class="adm-btn" style="background:var(--cyan); color:#fff;">⬆️ NAIKKAN ANTRIAN (AUTO)</button>
            <button id="btnStartAll" class="adm-btn" style="background:var(--neon-yellow); color:#333;">⚡ MULAI SEMUA & KIRIM WA</button>
            <div class="adm-row">
                <input id="blockPlatInput" placeholder="Plat Blokir" class="adm-input">
                <button id="btnBlock" class="adm-btn" style="width:30%; background:var(--soft-red); color:#fff;">BLOK</button>
            </div>
            <button id="btnReset" class="adm-btn" style="border:1px solid var(--soft-red); background:none; color:var(--soft-red);">RESET DATA TOTAL</button>
            <div id="btnCloseAdmin" style="text-align:center; margin-top:15px; font-size:10px; color:#555; cursor:pointer;">Tutup Panel</div>
        </div>
        
        <div class="footer">Created by : MLU SQUAD</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, runTransaction, setDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        const FONNTE_TOKEN = "Fc8dWb7jiKr7CXuEZXBx"; // Token User
        
        const firebaseConfig = { apiKey: "AIzaSyALIlkIDALIk83K8s1htalvW6rmNNw02Go", authDomain: "sistem-antrian-b1c39.firebaseapp.com", projectId: "sistem-antrian-b1c39", storageBucket: "sistem-antrian-b1c39.firebasestorage.app", messagingSenderId: "454124587608", appId: "1:454124587608:web:34fbb0f5211067a67f982d" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const ref = doc(db, "antrian", "utama");

        let isAdminLoggedIn = false;
        let triggeredAlarms = new Set();
        const alarmAudio = document.getElementById('alarmSound');

        // --- EXPOSE ACTIONS TO WINDOW (AGAR TOMBOL START/STOP DI LIST BISA DIKLIK) ---
        window.act = (i, type) => actionHandler(i, type);
        window.delQ = (i, name) => deleteQueueHandler(i, name);

        // --- BUTTON EVENT LISTENERS (FIXED) ---
        // Kita pasang event listener manual agar tidak ada masalah scope module
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('btnTestWA').addEventListener('click', testConnection);
            document.getElementById('btnDaftar').addEventListener('click', daftarAntrian);
            document.getElementById('btnAdminTrigger').addEventListener('click', openAdminLogin);
            
            // Modal Buttons
            document.getElementById('mBtnCancel').addEventListener('click', closeModal);
            // mBtnOk dihandle dinamis di showPopup

            // Admin Buttons
            document.getElementById('btnClearSlot').addEventListener('click', clearSlotManual);
            document.getElementById('btnFillQueue').addEventListener('click', fillFromQueue);
            document.getElementById('btnStartAll').addEventListener('click', startAllSlots);
            document.getElementById('btnBlock').addEventListener('click', blockUser);
            document.getElementById('btnReset').addEventListener('click', resetAll);
            document.getElementById('btnCloseAdmin').addEventListener('click', () => document.getElementById('adminPanel').style.display = 'none');
        });

        // --- GLOBAL UI FUNCTIONS ---
        function closeModal() { document.getElementById('masterModal').style.display = 'none'; }
        
        function formatPhone(p) {
            p = p.replace(/\D/g,'');
            if(p.startsWith('0')) p = '62' + p.substring(1);
            if(!p.startsWith('62')) p = '62' + p;
            return p;
        }

        // --- LOGIC UTAMA ---
        
        async function testConnection() {
            const wa = document.getElementById('userWa').value;
            if(!wa) return alert("Isi nomor WA dulu!");
            
            const p = formatPhone(wa);
            const formData = new FormData();
            formData.append("target", p);
            formData.append("message", "✅ TES KONEKSI BERHASIL!");
            formData.append("countryCode", "62"); 

            try {
                alert("Mengirim pesan...");
                const response = await fetch("https://api.fonnte.com/send", { method: "POST", headers: { "Authorization": FONNTE_TOKEN }, body: formData });
                const data = await response.json();
                if(data.status) alert("SUKSES! Cek WA."); else alert("GAGAL: "+JSON.stringify(data));
            } catch(e) { alert("Error: "+e); }
        }

        async function scheduleWhatsapp(target, plat, durationMinutes, targetPersen) {
            const p = formatPhone(target);
            const now = new Date();
            const sendTime = new Date(now.getTime() + (durationMinutes * 60000) + 60000); 
            
            const y = sendTime.getFullYear();
            const m = String(sendTime.getMonth()+1).padStart(2,'0');
            const d = String(sendTime.getDate()).padStart(2,'0');
            const h = String(sendTime.getHours()).padStart(2,'0');
            const min = String(sendTime.getMinutes()).padStart(2,'0');
            const s = String(sendTime.getSeconds()).padStart(2,'0');
            const scheduleTime = `${y}-${m}-${d} ${h}:${min}:${s}`;

            const msg = `Halo! Pengecasan motor *${plat}* diperkirakan selesai (Target ${targetPersen}%). Mohon segera dicek. Terima kasih!`;

            const formData = new FormData();
            formData.append("target", p); formData.append("message", msg); formData.append("schedule", scheduleTime); formData.append("countryCode", "62"); 

            try { fetch("https://api.fonnte.com/send", { method: "POST", headers: { "Authorization": FONNTE_TOKEN }, body: formData }); } catch(e) { console.log(e); }
        }

        async function daftarAntrian() {
            try { alarmAudio.play().then(()=>{ setTimeout(()=>{alarmAudio.pause();alarmAudio.currentTime=0;},100); }).catch(()=>{}); } catch(e){}

            const btn = document.getElementById('btnDaftar');
            const plat = document.getElementById('userPlat').value.toUpperCase().trim();
            const wa = document.getElementById('userWa').value.trim();
            const bat = parseInt(document.getElementById('userBattery').value);

            if(!plat || !wa || isNaN(bat)) { showPopup('error','DATA KURANG','Isi semua data!'); return; }
            btn.disabled=true; btn.innerText="PROSES...";
            localStorage.setItem('myPlat', plat);

            try {
                await runTransaction(db, async(t)=>{
                    const d = (await t.get(ref)).data() || {};
                    let s = d.chargingSlots || [null,null,null];
                    let q = d.waitingQueue || [];

                    if((d.blockedList||[]).includes(plat)) throw "Plat DIBLOKIR!";
                    if(s.some(x=>x?.name===plat) || q.some(x=>x?.name===plat)) throw "Sudah Terdaftar!";

                    const totalAntrian = s.filter(x => x !== null).length + q.length;
                    let targetLimit = 100;
                    if(totalAntrian < 3) targetLimit = 100; else if(totalAntrian <= 6) targetLimit = 95; else if(totalAntrian <= 10) targetLimit = 90; else targetLimit = 85;

                    if(bat >= targetLimit) throw `Baterai cukup (${bat}%). Batas ${targetLimit}%.`;

                    let minutes = 0;
                    for(let b = bat; b < targetLimit; b++) { if(b >= 90) minutes += 2.2; else if(b >= 80) minutes += 1.5; else minutes += 0.8; }
                    let dur = Math.ceil(minutes); if(dur < 2) dur = 2;

                    const item = { name:plat, phone:wa, startBattery:bat, targetLimit:targetLimit, durationMinutes:dur, startTime:null };
                    const empty = s.findIndex(x=>x===null);
                    if(empty!==-1) s[empty] = item; else q.push(item);
                    t.set(ref, {chargingSlots:s, waitingQueue:q}, {merge:true});
                });
                showPopup('success','BERHASIL','Masuk Antrian.');
                document.getElementById('userPlat').value=''; document.getElementById('userBattery').value=''; document.getElementById('userWa').value='';
                document.getElementById('ruleInfo').style.display='none';
            } catch(e) { showPopup('error','GAGAL', e); }
            btn.disabled=false; btn.innerText="DAFTAR ANTRIAN";
        }

        // --- RENDER ---
        onSnapshot(ref, (snap) => {
            const d = snap.data() || {};
            const slots = d.chargingSlots || [null,null,null];
            const q = d.waitingQueue || [];

            const occupied = slots.filter(x => x !== null).length;
            const total = occupied + q.length;
            const infoBox = document.getElementById('ruleInfo');
            if(total > 0) {
                let limit = 100;
                if(total < 3) limit = 100; else if(total <= 6) limit = 95; else if(total <= 10) limit = 90; else limit = 85;
                infoBox.style.display = 'block'; infoBox.innerHTML = `ANTRIAN: ${total} UNIT<br>MAX CHARGING: ${limit}%`;
            } else { infoBox.style.display = 'none'; }

            document.getElementById('slotsContainer').innerHTML = slots.map((x,i)=>{
                if(!x) return `<div class="slot-box" style="opacity:0.5; border:2px dashed var(--border);"><div class="bat-icon" style="border-color:var(--text-muted); background:none;"></div><div style="font-size:12px; color:var(--text-muted)">KOSONG</div></div>`;

                const isRun = !!x.startTime; 
                let btn = isRun ? 
                    `<button class="btn-act btn-stop" onclick="window.act(${i},'stop')">STOP</button>` :
                    `<button class="btn-act btn-start" onclick="window.act(${i},'start')">MULAI</button>`;
                
                let startMs = isRun ? (x.startTime.seconds ? x.startTime.seconds*1000 : new Date(x.startTime).getTime()) : 0;
                let endMs = isRun ? startMs + (x.durationMinutes*60000) : 0;
                let h = x.startBattery;
                let targetInfo = `<div style="font-size:11px; color:var(--cyan); font-weight:bold;">Target: ${x.targetLimit}%</div>`;

                return `
                    <div class="slot-box active">
                        <div class="bat-icon"><div class="bat-fill" style="height:${isRun?100:h}%"></div><div class="bat-bolt" style="color:var(--text)">⚡</div></div>
                        <div style="font-weight:bold; font-size:18px;">${x.name}</div>
                        ${targetInfo}
                        <div id="timerDisplay-${i}" class="timer-display" data-run="${isRun}" data-end="${endMs}" data-name="${x.name}" style="font-size:18px; font-weight:bold; color:var(--soft-red); margin:10px 0;">
                            ${isRun ? "..." : "Tap MULAI"}
                        </div>
                        ${btn}
                    </div>`;
            }).join('');

            document.getElementById('qCount').innerText = q.length;
            document.getElementById('queueList').innerHTML = q.length ? q.map((x,i)=>`
                <div style="display:flex; justify-content:space-between; padding:10px; background:var(--card-bg); margin-bottom:5px; border-radius:8px; border:1px solid var(--border);">
                    <div><b>${x.name}</b> <span style="font-size:11px; color:var(--text-muted);">(${x.startBattery}% -> ${x.targetLimit}%)</span></div>
                    <button onclick="window.delQ(${i}, '${x.name}')" style="background:none; border:none; color:var(--soft-red); font-weight:bold;">✕</button>
                </div>
            `).join('') : '<div style="text-align:center; color:var(--text-muted); font-size:12px;">Antrian Kosong</div>';
        });

        setInterval(() => {
            document.querySelectorAll('.timer-display').forEach(el => {
                const isRun = el.getAttribute('data-run') === 'true';
                if(!isRun) return;
                const end = parseInt(el.getAttribute('data-end'));
                const name = el.getAttribute('data-name');
                const now = Date.now();
                const diff = end - now;

                if(diff > 0) {
                    const m = Math.floor(diff/60000); const s = Math.floor((diff%60000)/1000);
                    el.innerText = `${m}:${s<10?'0'+s:s}`; el.style.color = "var(--cyan)";
                } else {
                    el.innerText = "SELESAI"; el.style.color = "var(--soft-red)";
                    const key = name + end;
                    if(!triggeredAlarms.has(key)) {
                        triggeredAlarms.add(key);
                        const myPlat = localStorage.getItem('myPlat');
                        if(isAdminLoggedIn || myPlat === name) {
                            alarmAudio.currentTime = 0; alarmAudio.play().catch(e => {});
                            showPopup('alarm', 'SELESAI', `Motor ${name}`);
                        }
                    }
                }
            });
        }, 1000);

        function actionHandler(i, type) {
            if(type === 'stop') {
                const sName = document.querySelector(`#timerDisplay-${i}`).dataset.name;
                const myPlat = localStorage.getItem('myPlat');
                if(!isAdminLoggedIn && myPlat !== sName) return showPopup('error', 'AKSES DITOLAK', 'Bukan kendaraan Anda!');
                showPopup('confirm', 'STOP', 'Stop Slot?', () => {
                    runTransaction(db, async(t)=>{
                        const d = (await t.get(ref)).data();
                        let s = d.chargingSlots; let q = d.waitingQueue;
                        s[i]=null; t.update(ref, {chargingSlots:s});
                    }); alarmAudio.pause(); alarmAudio.currentTime=0;
                });
            } else if (type === 'start') {
                runTransaction(db, async(t)=>{
                    const d = (await t.get(ref)).data(); const s = d.chargingSlots;
                    if(s[i]) {
                        if(s[i].phone) scheduleWhatsapp(s[i].phone, s[i].name, s[i].durationMinutes, s[i].targetLimit);
                        s[i].startTime = new Date();
                        t.update(ref, {chargingSlots:s});
                    }
                });
            }
        }

        function deleteQueueHandler(i, name) {
            if(!isAdminLoggedIn && localStorage.getItem('myPlat') !== name) return showPopup('error', 'AKSES DITOLAK', 'Bukan antrian Anda!');
            showPopup('confirm','HAPUS', 'Hapus antrian?', () => { runTransaction(db, async(t)=>{ const q = (await t.get(ref)).data().waitingQueue; q.splice(i,1); t.update(ref, {waitingQueue:q}); }); });
        }

        function openAdminLogin() { showPopup('admin', 'ADMIN LOGIN', 'Masukkan PIN'); }
        function clearSlotManual() { const i = document.getElementById('manSlot').value; showPopup('confirm', 'HAPUS', 'Kosongkan Slot?', () => { runTransaction(db, async(t)=>{ const s = (await t.get(ref)).data().chargingSlots; s[i] = null; t.update(ref, {chargingSlots:s}); }); }); }
        function fillFromQueue() { runTransaction(db, async(t) => { const d = (await t.get(ref)).data(); let s = d.chargingSlots; let q = d.waitingQueue; if(q.length === 0) throw "Antrian Kosong!"; const emptyIdx = s.findIndex(x => x === null); if(emptyIdx === -1) throw "Semua Slot Penuh!"; s[emptyIdx] = q.shift(); t.update(ref, {chargingSlots:s, waitingQueue:q}); }).catch(e => showPopup('error', 'GAGAL', e)); }
        function startAllSlots() { showPopup('confirm', 'MULAI SEMUA', 'Start semua?', () => { runTransaction(db, async(t)=>{ const d = (await t.get(ref)).data(); let s = d.chargingSlots; let startedCount = 0; s.forEach((slot) => { if(slot && !slot.startTime) { if(slot.phone) scheduleWhatsapp(slot.phone, slot.name, slot.durationMinutes, slot.targetLimit); slot.startTime = new Date(); startedCount++; } }); if(startedCount > 0) t.update(ref, {chargingSlots:s}); }); }); }
        function blockUser() { const p = document.getElementById('blockPlatInput').value.toUpperCase().trim(); if(!p) return; runTransaction(db, async (t) => { const d = (await t.get(ref)).data(); const l = d.blockedList || []; if (!l.includes(p)) l.push(p); t.update(ref, {blockedList: l}); }).then(()=>showPopup('success', 'BLOKIR', `Plat ${p} diblokir.`)); }
        function resetAll() { showPopup('confirm', 'RESET', 'Reset Semua?', () => { setDoc(ref, {chargingSlots:[null,null,null], waitingQueue:[], blockedList:[]}); }); }

        function showPopup(type, title, msg, onOk = null) {
            const m = document.getElementById('masterModal'); const box = document.getElementById('modalBox'); const icon = document.getElementById('mIcon'); const t = document.getElementById('mTitle'); const ms = document.getElementById('mMsg'); const btnOk = document.getElementById('mBtnOk'); const btnCancel = document.getElementById('mBtnCancel'); const inp = document.getElementById('mInput');
            m.style.display = 'flex'; m.className = 'modal'; box.style.borderColor = 'var(--cyan)'; t.innerText = title; ms.innerHTML = msg; inp.style.display = 'none'; btnCancel.style.display = 'none'; btnOk.className = 'btn-modal primary'; btnOk.innerText = 'OK'; btnOk.onclick = null; 
            if(type === 'confirm') { icon.innerText = '❓'; btnCancel.style.display = 'block'; btnOk.innerText = 'YA'; btnCancel.onclick = () => m.style.display = 'none'; btnOk.onclick = () => { m.style.display = 'none'; if(onOk) onOk(); }; }
            else if(type === 'error') { icon.innerText = '❌'; box.style.borderColor = 'var(--soft-red)'; btnOk.className = 'btn-modal danger'; btnOk.innerText = 'TUTUP'; btnOk.onclick = () => m.style.display = 'none'; }
            else if(type === 'alarm') { icon.innerText = '🔔'; box.style.borderColor = 'var(--soft-red)'; btnOk.className = 'btn-modal danger'; btnOk.innerText = 'MATIKAN ALARM'; btnOk.onclick = () => { alarmAudio.pause(); alarmAudio.currentTime=0; m.style.display = 'none'; }; }
            else if(type === 'admin') { icon.innerText = '🔒'; inp.style.display = 'block'; inp.value=''; inp.focus(); btnOk.innerText = 'LOGIN'; btnCancel.style.display = 'block'; btnCancel.onclick = () => m.style.display = 'none'; btnOk.onclick = () => { if(inp.value === '1131') { m.style.display = 'none'; document.getElementById('adminPanel').style.display = 'block'; isAdminLoggedIn = true; } else showPopup('error','GAGAL','PIN Salah!'); }; }
            else { icon.innerText = '✅'; btnOk.onclick = () => m.style.display = 'none'; }
        }
    </script>
</body>
</html>
