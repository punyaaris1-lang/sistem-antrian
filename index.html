<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MLU SUPER APP</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b101a">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; height: 100vh; overflow: hidden;
            background-color: #0b101a;
            /* Pastikan nama file gambar background benar */
            background-image: url('1763947427555.jpg'); 
            background-size: cover; background-position: center; background-attachment: fixed;
            font-family: 'Rajdhani', sans-serif;
            display: flex; flex-direction: column; align-items: center; 
        }

        body::before { content: ''; position: absolute; inset: 0; background: rgba(0, 0, 0, 0.75); z-index: -1; }

        /* === INSTALL SCREEN (DIPAKSA MUNCUL) === */
        #installScreen {
            position: fixed; inset: 0; z-index: 9999;
            background: rgba(11, 16, 26, 0.98); 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: transform 0.5s ease-in-out;
            transform: translateY(0); /* Default MUNCUL */
        }
        #installScreen.hidden { transform: translateY(-100%); } /* Sembunyi ke atas */

        .welcome-logo {
            width: 120px; height: 120px; border-radius: 50%;
            background: url('1763947427555.jpg') center/cover;
            box-shadow: 0 0 30px #00bcd4; border: 3px solid #fff;
            animation: pulseLogo 2s infinite; margin-bottom: 30px;
        }
        @keyframes pulseLogo { 0%{box-shadow:0 0 30px #00bcd4} 50%{box-shadow:0 0 60px #00bcd4} 100%{box-shadow:0 0 30px #00bcd4} }

        .welcome-title { font-family: 'Orbitron'; font-size: 24px; color: #fff; margin-bottom: 10px; letter-spacing: 2px; }
        .welcome-desc { color: #aaa; text-align: center; font-size: 14px; max-width: 80%; margin-bottom: 40px; line-height: 1.6; }

        .btn-install-big {
            background: #ccff00; color: #000; border: none;
            padding: 18px 40px; border-radius: 30px;
            font-family: 'Orbitron'; font-weight: 900; font-size: 16px;
            box-shadow: 0 0 20px rgba(204, 255, 0, 0.5); cursor: pointer; 
            text-transform: uppercase; display: flex; align-items: center; gap: 10px;
        }
        .btn-skip { margin-top: 30px; background: none; border: none; color: #666; font-size: 12px; text-decoration: underline; cursor: pointer; }

        /* === MENU UTAMA === */
        .logo-area { text-align: center; margin-top: 50px; margin-bottom: 20px; z-index: 10; }
        h1 { font-family: 'Orbitron', sans-serif; font-size: 42px; margin: 0; color: #fff; letter-spacing: 3px; text-shadow: 0 0 20px #00bcd4; }
        .squad-text {
            font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: bold; 
            color: #000; background: #ccff00; padding: 5px 15px; border-radius: 5px; 
            margin-top: 5px; display: inline-block; border: 2px solid #fff;
            animation: blink 1.5s infinite; letter-spacing: 1px;
        }
        @keyframes blink { 50% { opacity: 0.6; } }

        .menu-grid { display: grid; gap: 15px; width: 85%; max-width: 400px; margin-top: 10px; z-index: 10; }
        
        .menu-btn {
            background: rgba(255, 255, 255, 0.1); border: 1px solid #00bcd4; 
            padding: 20px; border-radius: 20px; cursor: pointer;
            display: flex; align-items: center; gap: 20px; text-decoration: none; 
            backdrop-filter: blur(10px); transition: 0.2s; box-shadow: 0 0 15px rgba(0, 188, 212, 0.1);
        }
        .menu-btn:active { transform: scale(0.96); background: #00bcd4; }
        .menu-btn:active h3, .menu-btn:active span { color: #000; }
        
        .menu-icon { 
            font-size: 28px; width: 55px; height: 55px;
            background: rgba(0, 229, 255, 0.1); border: 1px solid #00bcd4; border-radius: 15px;
            display: flex; align-items: center; justify-content: center; color: #00bcd4;
            box-shadow: 0 0 10px rgba(0, 188, 212, 0.3);
        }
        
        .menu-text { text-align: left; }
        .menu-text h3 { margin: 0; font-family: 'Orbitron', sans-serif; font-size: 16px; color: #fff; letter-spacing: 1px; }
        .menu-text span { font-size: 11px; color: #aaa; font-weight: bold; }

        .btn-article {
            width: 85%; max-width: 400px; margin-top: 15px; padding: 15px;
            background: rgba(255,255,255,0.05); border: 1px solid #aaa; border-radius: 15px;
            text-decoration: none; color: #fff; display: flex; justify-content: center; align-items: center; gap: 10px;
            font-family: 'Orbitron'; font-size: 14px; letter-spacing: 1px; backdrop-filter: blur(5px);
        }

        .footer { position: absolute; bottom: 20px; font-size: 10px; color: #00bcd4; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; }
    </style>
</head>
<body>

    <!-- SCREEN INSTALLER -->
    <div id="installScreen">
        <div class="welcome-logo"></div>
        <div class="welcome-title">HALO SAHABAT MLU</div>
        <div class="welcome-desc">Install Aplikasi <b>MLU SUPER APP</b><br>untuk akses lebih cepat & notifikasi realtime.</div>
        <button id="btnInstallHero" class="btn-install-big">📲 INSTALL APLIKASI</button>
        <button onclick="closeInstall()" class="btn-skip">Lanjutkan di Browser >></button>
    </div>

    <!-- MENU UTAMA -->
    <div class="logo-area">
        <h1>MLU APPS</h1>
        <div class="squad-text">MAKA LINTAS UTARA SQUAD</div>
    </div>

    <div class="menu-grid">
        <a href="lokasi.html" class="menu-btn">
            <div class="menu-icon">📍</div>
            <div class="menu-text"><h3>LOKASI FC</h3><span>Cari charging station</span></div>
        </a>

        <a href="sos.html" class="menu-btn">
            <div class="menu-icon">🆘</div>
            <div class="menu-text"><h3>MAKA SOS</h3><span>Layanan MAKA Customer Care</span></div>
        </a>

        <a href="antrian.html" class="menu-btn">
            <div class="menu-icon">⚡</div>
            <div class="menu-text"><h3>FC KLP GADING</h3><span>Daftar & Pantau Motormu</span></div>
        </a>
    </div>

    <a href="artikel.html" class="btn-article">📰 INFO & EVENT MLU</a>

    <div class="footer">v12.0 Final | MLU Squad</div>

    <script>
        // 1. REGISTER SERVICE WORKER (WAJIB UTK PWA)
        if ('serviceWorker' in navigator) { 
            navigator.serviceWorker.register('sw.js').then(r => console.log('SW OK')).catch(e => console.log('SW Fail', e));
        }

        let deferredPrompt;
        const screen = document.getElementById('installScreen');
        const btn = document.getElementById('btnInstallHero');

        // Fungsi Tutup Layar Install
        window.closeInstall = () => { screen.classList.add('hidden'); };

        // CEK APAKAH SUDAH JADI APLIKASI?
        // Jika sudah mode aplikasi (standalone), langsung tutup layar install.
        if (window.matchMedia('(display-mode: standalone)').matches) {
            screen.style.display = 'none';
        }

        // TANGKAP EVENT INSTALL (Kalau Chrome Mengizinkan)
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); 
            deferredPrompt = e;
            console.log("Install prompt ready");
        });

        // LOGIKA TOMBOL INSTALL
        btn.addEventListener('click', () => {
            if (deferredPrompt) {
                // KASUS 1: Chrome mengizinkan install otomatis
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((res) => { 
                    if (res.outcome === 'accepted') {
                        console.log('User accepted install');
                    }
                    deferredPrompt = null;
                    closeInstall();
                });
            } else {
                // KASUS 2: Chrome memblokir (Cooldown) atau Browser tidak support
                // KITA KASIH PANDUAN MANUAL (Fallback)
                alert("⚠️ INSTALL MANUAL:\n\n1. Tekan tombol titik tiga (⋮) di pojok kanan atas browser.\n2. Pilih 'Install App' atau 'Tambahkan ke Layar Utama'.\n3. Selesai!");
                closeInstall();
            }
        });
    </script>
</body>
</html>
