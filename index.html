<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MLU SUPER APP</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 20px; height: 100vh; overflow: hidden;
            background: #0b101a url('1763947427555.jpg') no-repeat center center/cover;
            font-family: 'Orbitron', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        body::before { content:''; position:absolute; inset:0; background:rgba(0,0,0,0.7); z-index:-1; }
        
        .logo-area { text-align: center; margin-bottom: 50px; }
        h1 { font-size: 42px; color: #fff; margin: 0; letter-spacing: 3px; text-shadow: 0 0 20px #00bcd4; }
        .squad { font-size: 14px; color: #000; background: #ccff00; padding: 5px 15px; border-radius: 5px; display: inline-block; animation: blink 1.5s infinite; font-weight: bold; margin-top: 10px; border: 2px solid #fff; }
        @keyframes blink { 50% { opacity: 0.7; } }

        .menu-grid { display: grid; gap: 20px; width: 100%; max-width: 350px; }
        .menu-btn {
            background: rgba(255,255,255,0.1); border: 1px solid #00bcd4;
            padding: 25px; border-radius: 20px; cursor: pointer;
            display: flex; align-items: center; gap: 20px; backdrop-filter: blur(10px);
            transition: 0.2s; text-decoration: none; color: white;
        }
        .menu-btn:active { transform: scale(0.95); background: #00bcd4; }
        .icon { font-size: 32px; width: 50px; text-align: center; }
        .text h3 { margin: 0; font-size: 18px; }
        .text span { font-size: 12px; color: #ccc; font-family: sans-serif; }
        
        .footer { position: absolute; bottom: 30px; color: #666; font-size: 10px; }
    </style>
</head>
<body>
    <div class="logo-area">
        <h1>MLU APPS</h1>
        <div class="squad">MAKA LINTAS UTARA SQUAD</div>
    </div>

    <div class="menu-grid">
        <a href="lokasi.html" class="menu-btn">
            <div class="icon">📍</div>
            <div class="text"><h3>LOKASI FC</h3><span>Cari charging station</span></div>
        </a>
        <a href="sos.html" class="menu-btn">
            <div class="icon">🆘</div>
            <div class="text"><h3>BANTUAN SOS</h3><span>Layanan Darurat</span></div>
        </a>
        <a href="antrian.html" class="menu-btn">
            <div class="icon">⚡</div>
            <div class="text"><h3>ANTRIAN ONLINE</h3><span>Daftar & Pantau</span></div>
        </a>
    </div>
    <div class="footer">v10.0 Final | MLU Squad</div>
</body>
</html>
