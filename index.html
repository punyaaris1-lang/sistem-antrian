<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MLU SUPER APP</title>
    
    <link rel="manifest" href="manifest.json">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; height: 100vh; overflow: hidden;
            background-color: #0b101a;
            background-image: url('1763947427555.jpg'); 
            background-size: cover; background-position: center; background-attachment: fixed;
            font-family: 'Rajdhani', sans-serif;
            display: flex; flex-direction: column; align-items: center; 
        }

        body::before {
            content: ''; position: absolute; inset: 0;
            background: rgba(0, 0, 0, 0.75); z-index: -1;
        }

        /* === WELCOME SCREEN (SLIDE DOWN) === */
        #installScreen {
            position: fixed; inset: 0; z-index: 9999;
            background: rgba(11, 16, 26, 0.98); /* Latar Gelap Hampir Solid */
            display: flex; flex-direction: column; 
            align-items: center; justify-content: center;
            transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            transform: translateY(-100%); /* Sembunyi di atas */
        }
        
        /* Class untuk memunculkan */
        #installScreen.show { transform: translateY(0); }

        .welcome-logo {
            width: 120px; height: 120px; border-radius: 50%;
            background: url('1763947427555.jpg') center/cover;
            box-shadow: 0 0 30px #00bcd4;
            margin-bottom: 30px; border: 3px solid #fff;
            animation: pulseLogo 2s infinite;
        }
        @keyframes pulseLogo { 0%{box-shadow:0 0 30px #00bcd4} 50%{box-shadow:0 0 60px #00bcd4} 100%{box-shadow:0 0 30px #00bcd4} }

        .welcome-title {
            font-family: 'Orbitron'; font-size: 24px; color: #fff;
            text-align: center; margin-bottom: 10px; letter-spacing: 2px;
        }
        .welcome-desc {
            color: #aaa; text-align: center; font-size: 14px;
            max-width: 80%; margin-bottom: 40px; line-height: 1.6;
        }

        .btn-install-big {
            background: #ccff00; color: #000; border: none;
            padding: 18px 40px; border-radius: 30px;
            font-family: 'Orbitron'; font-weight: 900; font-size: 16px;
            box-shadow: 0 0 20px rgba(204, 255, 0, 0.5);
            cursor: pointer; transition: 0.2s; text-transform: uppercase;
            display: flex; align-items: center; gap: 10px;
        }
        .btn-install-big:active { transform: scale(0.95); }

        .btn-skip {
            margin-top: 30px; background: none; border: none;
            color: #666; font-size: 12px; text-decoration: underline;
            cursor: pointer; padding: 10px;
        }

        /* === HALAMAN UTAMA (V9.1) === */
        .logo-area { text-align: center; margin-top: 60px; margin-bottom: 30px; z-index: 10; }
        h1 { font-family: 'Orbitron', sans-serif; font-size: 42px; margin: 0; color: #fff; letter-spacing: 3px; text-shadow: 0 0 20px #00bcd4; }
        
        .squad-text {
            font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: bold; 
            color: #000; background: #ccff00; padding: 5px 15px; border-radius: 5px; 
            margin-top: 5px; display: inline-block; border: 2px solid #fff;
            animation: blink 1.5s infinite; letter-spacing: 1px;
        }
        @keyframes blink { 50% { opacity: 0.6; } }

        .menu-grid { display: grid; gap: 15px; width: 85%; max-width: 400px; margin-top: 10px; z-index: 10; }
        
        .menu-btn {
            background: rgba(255, 255, 255, 0.1); border: 1px solid #00bcd4; 
            padding: 20px; border-radius: 20px; cursor: pointer;
            display: flex; align-items: center; gap: 20px; text-decoration: none; 
            backdrop-filter: blur(10px); transition: 0.2s; 
            box-shadow: 0 0 15px rgba(0, 188, 212, 0.1);
        }
        .menu-btn:active { transform: scale(0.96); background: #00bcd4; }
        .menu-btn:active h3, .menu-btn:active span { color: #000; }
        
        .menu-icon { 
            font-size: 28px; width: 55px; height: 55px;
            background: rgba(0, 229, 255, 0.1); border: 1px solid #00bcd4; border-radius: 15px;
            display: flex; align-items: center; justify-content: center; color: #00bcd4;
            box-shadow: 0 0 10px rgba(0, 188, 212, 0.3);
        }
        
        .menu-text { text-align: left; }
        .menu-text h3 { margin: 0; font-family: 'Orbitron', sans-serif; font-size: 16px; color: #fff; letter-spacing: 1px; }
        .menu-text span { font-size: 11px; color: #aaa; font-weight: bold; }

        .footer { position: absolute; bottom: 20px; font-size: 10px; color: #00bcd4; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div id="installScreen">
        <div class="welcome-logo"></div>
        <div class="welcome-title">SELAMAT DATANG</div>
        <div class="welcome-desc">
            Install Aplikasi <b>MLU FAST CHARGING</b><br>
            untuk akses lebih cepat & notifikasi realtime.
        </div>
        <button id="btnInstallHero" class="btn-install-big">
            📲 INSTALL SEKARANG
        </button>
        <button onclick="closeInstall()" class="btn-skip">Lanjutkan di Browser >></button>
    </div>

    <div class="logo-area">
        <h1>MLU APPS</h1>
        <div class="squad-text">MAKA LINTAS UTARA SQUAD</div>
    </div>

    <div class="menu-grid">
        <a href="lokasi.html" class="menu-btn">
            <div class="menu-icon">📍</div>
            <div class="menu-text"><h3>LOKASI FC</h3><span>Cari charging station</span></div>
        </a>

        <a href="sos.html" class="menu-btn">
            <div class="menu-icon">🆘</div>
            <div class="menu-text"><h3>BANTUAN SOS</h3><span>Layanan Darurat</span></div>
        </a>

        <a href="antrian.html" class="menu-btn">
            <div class="menu-icon">⚡</div>
            <div class="menu-text"><h3>ANTRIAN ONLINE</h3><span>Daftar & Pantau</span></div>
        </a>
    </div>

    <div class="footer">v10.8 Final | MLU Squad</div>

    <script>
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }

        let deferredPrompt;
        const screen = document.getElementById('installScreen');
        const btn = document.getElementById('btnInstallHero');

        // FUNGSI: Tutup Slide
        window.closeInstall = () => {
            screen.classList.remove('show');
        };

        // LOGIC UTAMA: Langsung munculkan slide saat web dibuka
        window.addEventListener('load', () => {
            // Cek apakah sudah jadi aplikasi?
            const isApp = window.matchMedia('(display-mode: standalone)').matches;
            if (!isApp) {
                // Kalau belum, munculkan slide setelah 0.5 detik
                setTimeout(() => {
                    screen.classList.add('show');
                }, 500);
            }
        });

        // Simpan event install browser
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        // Aksi Tombol
        btn.addEventListener('click', () => {
            if (deferredPrompt) {
                // Jika browser support otomatis
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((res) => {
                    if (res.outcome === 'accepted') closeInstall();
                    deferredPrompt = null;
                });
            } else {
                // Jika browser tidak support (iPhone/Lainnya), beri petunjuk
                alert("⚠️ CARA INSTALL:\n1. Klik menu titik tiga (⋮) di pojok kanan atas\n2. Pilih 'Install App' atau 'Tambahkan ke Layar Utama'");
                closeInstall();
            }
        });
    </script>
</body>
</html>
