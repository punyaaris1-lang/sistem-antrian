<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fast Charging V33 (Secure Fixed)</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        /* (Sama persis seperti desainmu, disingkat agar tidak panjang) */
        :root { --bg:#0b101a; --glass:rgba(255,255,255,0.05); --text:#fff; --text-muted:#8899a6; --cyan:#00e5ff; --cyan-dim:rgba(0,229,255,0.1); --soft-red:#ff6b6b; --border:rgba(255,255,255,0.1); --card-bg:rgba(255,255,255,0.03); --input-bg:rgba(0,0,0,0.4); }
        [data-theme="light"]{ --bg:#f0f2f5; --glass:#fff; --text:#1a253a; --text-muted:#556; --cyan:#008c9e; --cyan-dim:rgba(0,140,158,0.1); --soft-red:#d63031; --border:#ccc; --card-bg:#fff; --input-bg:#f9f9f9; }
        *{box-sizing:border-box} body{margin:0;font-family:'Rajdhani',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px 20px 120px;transition:0.3s}
        .container{max-width:480px;margin:0 auto;position:relative}
        .header-row{display:flex;justify-content:space-between;align-items:center;margin-top:20px;margin-bottom:5px}
        h1{font-family:'Orbitron',sans-serif;font-size:24px;margin:0;background:linear-gradient(to right,#fff,var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 20px rgba(0,229,255,0.3);letter-spacing:1px}
        .theme-btn{background:var(--card-bg);border:1px solid var(--border);color:var(--text);width:35px;height:35px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
        .subtitle{color:var(--text-muted);font-size:10px;letter-spacing:2px;margin-bottom:25px;font-weight:bold;text-transform:uppercase;border-bottom:1px solid var(--border);padding-bottom:15px}
        .glass-card{background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:20px;padding:25px;box-shadow:0 10px 30px rgba(0,0,0,0.1);margin-bottom:25px}
        label{display:block;font-family:'Orbitron';font-size:10px;color:var(--text-muted);margin-bottom:8px;letter-spacing:1px}
        input.field{width:100%;background:var(--input-bg);border:1px solid var(--border);color:var(--text);padding:15px;border-radius:10px;font-family:'Rajdhani';font-size:20px;font-weight:700;outline:none;transition:0.3s;margin-bottom:15px;text-align:center}
        .btn-cyan{width:100%;background:linear-gradient(90deg,var(--cyan),#00bcd4);border:none;padding:16px;border-radius:10px;color:#000;font-family:'Orbitron';font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 0 20px var(--cyan-dim);margin-top:5px}
        .slots-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:30px}
        .slot-box{background:var(--card-bg);border:1px solid var(--border);border-radius:15px;padding:10px 5px;text-align:center;min-height:160px;display:flex;flex-direction:column;justify-content:center;position:relative}
        .slot-box.active{border-color:var(--cyan);background:var(--cyan-dim)}
        .bat-icon{width:36px;height:60px;border:2px solid var(--text-muted);border-radius:6px;position:relative;margin:0 auto 10px;display:flex;align-items:flex-end;padding:2px}
        .bat-fill{width:100%;background:var(--cyan);border-radius:3px;transition:height 0.5s;box-shadow:0 0 10px var(--cyan)}
        .bat-bolt{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:20px;color:#fff;text-shadow:0 0 5px #000;z-index:2}
        .btn-act{width:100%;padding:8px;border-radius:6px;border:none;font-weight:bold;font-family:'Orbitron';font-size:11px;margin-top:auto;cursor:pointer}
        .btn-start{background:var(--cyan);color:#000}
        .btn-stop{background:rgba(255,107,107,0.1);border:1px solid var(--soft-red);color:var(--soft-red)}
        .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:9999;align-items:center;justify-content:center;backdrop-filter:blur(5px)}
        .modal-box{background:var(--bg);border:2px solid var(--cyan);padding:25px;border-radius:20px;width:85%;max-width:320px;text-align:center;animation:pop .3s}
        .modal-icon{font-size:40px;margin-bottom:10px;display:block}
        .modal-title{font-family:'Orbitron';font-size:18px;margin:0 0 10px;color:var(--text)}
        .modal-msg{color:var(--text-muted);font-size:14px;margin-bottom:20px;line-height:1.4}
        .modal-btns{display:flex;gap:10px}
        .btn-modal{flex:1;padding:12px;border-radius:8px;border:none;font-weight:bold;cursor:pointer;font-family:'Orbitron';background:#333;color:#fff}
        .btn-modal.primary{background:var(--cyan);color:#000}
        .btn-modal.danger{background:var(--soft-red);color:#fff}
        .admin-trigger{text-align:center;margin-top:40px;padding:12px;background:var(--cyan-dim);border:1px dashed var(--cyan);font-size:12px;letter-spacing:2px;color:var(--cyan);cursor:pointer;font-weight:bold;border-radius:8px}
        .admin-panel{display:none;background:#000;padding:20px;border-radius:15px;border:1px solid var(--soft-red);margin-top:20px}
        .adm-row{display:flex;gap:10px;margin-bottom:10px}
        .adm-input{background:#222;border:1px solid #444;color:#fff;padding:10px;width:100%;border-radius:6px}
        .adm-btn{width:100%;padding:10px;border-radius:6px;border:none;cursor:pointer;font-weight:bold;font-family:'Orbitron';margin-bottom:5px;font-size:11px}
        .footer{text-align:center;margin-top:40px;font-family:'Orbitron';font-size:12px;color:var(--cyan);font-weight:900;letter-spacing:2px;text-shadow:0 0 15px var(--cyan-dim)}
        @keyframes pop{from{transform:scale(0.8);opacity:0}to{transform:scale(1);opacity:1}}
    </style>
</head>
<body>

    <audio id="alarmSound" loop>
        <source src="data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU..." type="audio/wav">
    </audio>

    <div id="masterModal" class="modal">
        <div id="modalBox" class="modal-box">
            <span id="mIcon" class="modal-icon">✅</span>
            <h3 id="mTitle" class="modal-title">TITLE</h3>
            <p id="mMsg" class="modal-msg">Message</p>
            <input type="password" id="mInput" style="display:none; width:100%; padding:10px; text-align:center; margin-bottom:15px; border-radius:5px; border:none;" placeholder="PIN">
            <div class="modal-btns">
                <button id="mBtnCancel" class="btn-modal" style="display:none;">BATAL</button>
                <button id="mBtnOk" class="btn-modal primary">OK</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="header-row">
            <h1>FAST CHARGING</h1>
            <button class="theme-btn" onclick="toggleTheme()" id="themeIcon">☀️</button>
        </div>
        <div class="subtitle">KELAPA GADING | HOME OF MLU</div>

        <div class="glass-card">
            <label>PLAT NOMOR</label>
            <input id="userPlat" class="field" placeholder="PLAT NOMOR" style="text-transform:uppercase;">
            <label>BATERAI (%)</label>
            <input id="userBattery" type="number" class="field" placeholder="0 - 99">
            <button id="btnDaftar" class="btn-cyan">DAFTAR ANTRIAN</button>
        </div>

        <div style="display:flex; align-items:center; gap:10px; margin-bottom:15px;">
            <div style="width:8px; height:8px; background:var(--cyan); border-radius:50%; box-shadow:0 0 10px var(--cyan);"></div>
            <span style="font-family:'Orbitron'; font-size:12px; color:var(--text);">STATUS 3 SLOT</span>
        </div>

        <div class="slots-grid" id="slotsContainer">
            <div style="grid-column:1/-1; text-align:center; padding:30px; color:var(--text-muted);">Loading System...</div>
        </div>

        <div class="glass-card" style="padding:15px; min-height:100px;">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px; border-bottom:1px solid var(--border); padding-bottom:10px;">
                <span style="font-family:'Orbitron'; font-size:12px; color:var(--text);">DAFTAR TUNGGU</span>
                <span id="qCount" style="font-size:12px; color:var(--cyan);">0</span>
            </div>
            <div id="queueList"></div>
        </div>

        <div class="admin-trigger" onclick="openAdminLogin()">🔒 ADMIN LOGIN AREA</div>

        <div id="adminPanel" class="admin-panel">
            <h4 style="color:var(--soft-red); margin:0 0 15px; font-family:'Orbitron'; text-align:center;">PANEL KONTROL</h4>

            <label>MANUAL ASSIGN</label>
            <div class="adm-row">
                <select id="manSlot" class="adm-input" style="width:40%"><option value="0">Slot 1</option><option value="1">Slot 2</option><option value="2">Slot 3</option></select>
                <input id="manPlat" placeholder="Plat" class="adm-input">
            </div>
            <button onclick="manualAssign()" class="adm-btn" style="background:var(--cyan); color:#000;">ISI SLOT MANUAL</button>
            <button onclick="clearSlotManual()" class="adm-btn" style="background:#444; color:#fff;">KOSONGKAN SLOT (PAKSA)</button>

            <label style="margin-top:15px;">BLOKIR</label>
            <div class="adm-row">
                <input id="blockPlatInput" placeholder="Plat Diblokir" class="adm-input">
                <button onclick="blockUser()" class="adm-btn" style="width:auto; background:var(--soft-red); color:#fff;">BLOK</button>
            </div>

            <label style="margin-top:15px;">DANGER ZONE</label>
            <button onclick="stopAll()" class="adm-btn" style="background:var(--soft-red); color:#fff;">STOP SEMUA SLOT</button>
            <button onclick="resetAll()" class="adm-btn" style="border:1px solid var(--soft-red); background:none; color:var(--soft-red);">RESET DATABASE TOTAL</button>

            <div onclick="document.getElementById('adminPanel').style.display='none'" style="text-align:center; margin-top:15px; font-size:10px; color:#555; cursor:pointer;">Tutup Panel</div>
        </div>

        <div class="footer">Created by : MLU SQUAD</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, runTransaction, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
        import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging.js";

        // Firebase config (your project)
        const firebaseConfig = {
            apiKey: "AIzaSyALIlkIDALIk83K8s1htalvW6rmNNw02Go",
            authDomain: "sistem-antrian-b1c39.firebaseapp.com",
            projectId: "sistem-antrian-b1c39",
            storageBucket: "sistem-antrian-b1c39.firebasestorage.app",
            messagingSenderId: "454124587608",
            appId: "1:454124587608:web:34fbb0f5211067a67f982d"
        };

        // VAPID PUBLIC KEY (you provided earlier)
        const VAPID_KEY = "ra2uPkrLOs_lECdkHUD8bLfgePr9T2C7sgWMivJdmVA";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const ref = doc(db, "antrian", "utama");
        const messaging = getMessaging(app);

        // --- STATE ---
        let audioCtx = null;
        let triggeredAlarms = new Set();
        let isAdminLoggedIn = false;

        // --- SAFETY HELPERS ---
        function sanitizePlat(s) { if(!s) return ''; return String(s).replace(/[^A-Z0-9\- ]/gi,'').toUpperCase().slice(0,10); }
        function log(msg){ console.log('[APP]',msg); const lp=document.getElementById('queueList'); } // simple console log

        // --- AUDIO & NOTIF INIT ---
        function initAudioAndNotif() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
            if ("Notification" in window && Notification.permission !== "granted") {
                Notification.requestPermission().catch(()=>{});
            }
        }

        function playSiren() {
            try {
                if(!audioCtx) initAudioAndNotif();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(1000, audioCtx.currentTime + 0.5);
                osc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 1.0);
                gain.gain.value = 0.5;
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 2);
            } catch(e) {
                const a = document.getElementById('alarmSound');
                try{ a.currentTime=0; a.play(); }catch(e){}
            }
        }

        document.body.addEventListener('click', initAudioAndNotif, { once: true });

        // --- SAFE SHOW POPUP (fixed syntax errors) ---
        function showPopup(type, title, msg, onOk = null) {
            const m = document.getElementById('masterModal');
            const box = document.getElementById('modalBox');
            const icon = document.getElementById('mIcon');
            const t = document.getElementById('mTitle');
            const ms = document.getElementById('mMsg');
            const btnOk = document.getElementById('mBtnOk');
            const btnCancel = document.getElementById('mBtnCancel');
            const inp = document.getElementById('mInput');

            m.style.display = 'flex'; m.className = 'modal';
            box.style.borderColor = 'var(--cyan)';
            t.innerText = title; ms.innerHTML = msg || '';
            inp.style.display = 'none'; btnCancel.style.display = 'none';
            btnOk.className = 'btn-modal primary'; btnOk.innerText = 'OK';
            btnOk.onclick = null;
            btnCancel.onclick = () => m.style.display = 'none';

            if(type === 'confirm') {
                icon.innerText = '❓'; btnCancel.style.display = 'block'; btnOk.innerText = 'YA';
                btnOk.onclick = () => { m.style.display = 'none'; if(onOk) onOk(); };
            }
            else if(type === 'error') {
                icon.innerText = '❌'; box.style.borderColor = 'var(--soft-red)';
                btnOk.className = 'btn-modal danger'; btnOk.innerText = 'TUTUP';
                btnOk.onclick = () => m.style.display = 'none';
            }
            else if(type === 'alarm') {
                icon.innerText = '🔔'; box.style.borderColor = 'var(--soft-red)';
                btnOk.className = 'btn-modal danger'; btnOk.innerText = 'MATIKAN ALARM';
                btnOk.onclick = () => { window.stopAlarm(); m.style.display = 'none'; };
            }
            else if(type === 'admin') {
                icon.innerText = '🔒'; inp.style.display = 'block'; inp.value=''; inp.focus();
                btnOk.innerText = 'LOGIN'; btnCancel.style.display = 'block';
                btnCancel.onclick = () => m.style.display = 'none';
                btnOk.onclick = () => {
                    if(inp.value === '1131') {
                        m.style.display = 'none';
                        document.getElementById('adminPanel').style.display = 'block';
                        isAdminLoggedIn = true;
                    }
                    else showPopup('error','GAGAL','PIN Salah!');
                };
            }
            else {
                icon.innerText = '✅'; btnOk.onclick = () => m.style.display = 'none';
            }
        }

        window.openAdminLogin = () => showPopup('admin', 'ADMIN LOGIN', 'Masukkan PIN');

        // --- SERVICE WORKER + FCM TOKEN (register after load) ---
        async function registerSWAndGetToken() {
            try {
                if (!('serviceWorker' in navigator)) return null;
                const reg = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
                log('SW registered');
                // request notification permission if not granted
                if (Notification.permission !== 'granted') {
                    await Notification.requestPermission();
                }
                const token = await getToken(messaging, { vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
                if (token) localStorage.setItem('fcmToken', token);
                log('FCM token: ' + (token ? token.slice(0,10) + '...' : '(none)'));
                return token;
            } catch (e) {
                console.error('registerSWAndGetToken error', e);
                return null;
            }
        }

        // foreground message handler
        onMessage(messaging, (payload) => {
            console.log('onMessage payload', payload);
            const data = payload.data || payload.notification || {};
            const myPlat = localStorage.getItem('myPlat');
            if (data.plat && data.plat === myPlat) {
                showPopup('alarm', 'SELESAI!', `Motor <b>${data.plat}</b> Selesai!`);
                playSiren();
                if(navigator.vibrate) navigator.vibrate([1000,500,1000]);
            }
        });

        // receive messages from SW (notification click)
        navigator.serviceWorker && navigator.serviceWorker.addEventListener('message', (event) => {
            if (event.data?.type === 'ALARM_TRIGGER') {
                const plat = event.data.plat;
                showPopup('alarm','SELESAI', `Motor <b>${plat}</b> Selesai!`);
                playSiren();
            }
        });

        // --- MAIN LOGIC: LISTENER + RENDER ---
        document.getElementById('btnDaftar').onclick = async () => {
            initAudioAndNotif();
            const btn = document.getElementById('btnDaftar');
            const platRaw = document.getElementById('userPlat').value;
            const plat = sanitizePlat(platRaw);
            const bat = parseInt(document.getElementById('userBattery').value);

            if(!plat || isNaN(bat)) { showPopup('error','DATA KURANG','Mohon isi plat & baterai.'); return; }
            btn.disabled = true; btn.innerText = "PROSES...";

            // SIMPAN PLAT DI HP
            localStorage.setItem('myPlat', plat);

            try {
                await runTransaction(db, async (t) => {
                    const snap = await t.get(ref);
                    const d = snap.exists() ? snap.data() : {};
                    let s = d.chargingSlots || [null,null,null];
                    let q = d.waitingQueue || [];

                    if ((d.blockedList||[]).includes(plat)) throw "Plat ini DIBLOKIR!";
                    if (s.some(x=>x?.name===plat) || q.some(x=>x?.name===plat)) throw "Plat sudah terdaftar!";

                    let dur = 0; const target = 100;
                    if (bat >= 90) dur = Math.ceil((100-bat) * 2.2);
                    else if (bat >= 80) dur = Math.ceil((100-bat) * 1.5);
                    else dur = Math.ceil((100-bat) * 0.8);
                    if (dur < 5) dur = 5;

                    const item = { name:plat, startBattery:bat, targetLimit:target, durationMinutes:dur, startTime:null };
                    const empty = s.findIndex(x=>x===null);
                    if (empty !== -1) s[empty] = item; else q.push(item);
                    t.set(ref, { chargingSlots:s, waitingQueue:q }, { merge:true });
                });

                // save token for push (best-effort)
                let token = localStorage.getItem('fcmToken');
                if(!token) token = await registerSWAndGetToken();
                try {
                    if (token) {
                        await setDoc(doc(db, 'userTokens', sanitizePlat(localStorage.getItem('myPlat'))), { plat: localStorage.getItem('myPlat'), token }, { merge:true });
                    }
                } catch(e) { console.warn('save token error', e); }

                showPopup('success','BERHASIL','Masuk antrian.');
                document.getElementById('userPlat').value = ''; document.getElementById('userBattery').value = '';
            } catch (e) {
                showPopup('error','GAGAL', String(e));
                console.error(e);
            }
            btn.disabled=false; btn.innerText="DAFTAR ANTRIAN";
        };

        // RENDER TIMER (keperluan visual)
        setInterval(() => {
            document.querySelectorAll('[data-end]').forEach(el => {
                const end = parseInt(el.dataset.end);
                const name = el.dataset.name;
                const diff = end - Date.now();
                if (diff > 0) {
                    const m = Math.floor(diff/60000);
                    const s = Math.floor((diff%60000)/1000);
                    el.innerText = `${m}:${s<10?'0'+s:s}`;
                } else {
                    el.innerText = "SELESAI"; el.style.color = "var(--soft-red)";
                    const key = name+end;
                    if (!triggeredAlarms.has(key)) { triggeredAlarms.add(key); triggerAlarm(name); }
                }
            });
        }, 1000);

        // Realtime snapshot UI render
        onSnapshot(ref, (snap) => {
            const d = snap.exists()? snap.data() : {};
            const slots = d.chargingSlots || [null,null,null];
            document.getElementById('slotsContainer').innerHTML = slots.map((x,i) => {
                if(!x) return `<div class="slot-box" style="opacity:0.5; border-style:dashed;">
                        <div class="bat-icon" style="border-color:var(--text-muted)"><div class="bat-bolt" style="color:var(--text-muted)">⚡</div></div>
                        <div style="font-size:12px; color:var(--text-muted)">KOSONG</div>
                    </div>`;
                const isRun = !!x.startTime;
                let btn = isRun ? `<button class="btn-act btn-stop" onclick="window.act(${i},'stop', '${x.name}')">STOP</button>` :
                    `<button class="btn-act btn-start" onclick="window.act(${i},'start', '${x.name}')">MULAI</button>`;
                let time = `<div style="font-size:10px; color:var(--text-muted); margin-top:5px;">Tap MULAI</div>`;
                let h = x.startBattery;
                let targetText = "";
                if (isRun) {
                    const start = x.startTime.seconds ? x.startTime.seconds*1000 : new Date(x.startTime).getTime();
                    const end = start + (x.durationMinutes*60000);
                    time = `<div style="font-size:16px; font-weight:bold; color:var(--cyan); margin:5px 0;" data-end="${end}" data-name="${x.name}">...</div>`;
                    h = 100;
                    targetText = `<div style="font-size:9px; color:var(--cyan);">Target: ${x.targetLimit}%</div>`;
                }
                return `<div class="slot-box active">
                        <div class="bat-icon">
                            <div class="bat-fill" style="height:${h}%"></div>
                            <div class="bat-bolt">⚡</div>
                        </div>
                        <div style="font-weight:bold; color:var(--text);">${x.name}</div>
                        ${targetText}
                        ${time}
                        ${btn}
                    </div>`;
            }).join('');

            const q = d.waitingQueue || [];
            document.getElementById('qCount').innerText = q.length;
            document.getElementById('queueList').innerHTML = q.length ? q.map((x,i)=>`
                <div style="display:flex; justify-content:space-between; background:var(--card-bg); padding:10px; margin-bottom:5px; border-radius:8px;">
                    <div><b style="color:var(--text);">${x.name}</b> <span style="font-size:12px; color:var(--cyan)">(${x.startBattery}%)</span></div>
                    <button onclick="window.delQ(${i}, '${x.name}')" style="background:none; border:none; color:var(--soft-red); cursor:pointer;">✕</button>
                </div>
            `).join('') : '<div style="text-align:center; color:var(--text-muted); font-size:12px;">Antrian Kosong</div>';
        });

        // --- ACTIONS (secured) ---
        window.act = (i, type, platName) => {
            initAudioAndNotif();
            const myPlat = localStorage.getItem('myPlat');

            if(type === 'stop' && !isAdminLoggedIn && myPlat !== platName) {
                return showPopup('error', 'AKSES DITOLAK', 'Ini bukan kendaraan Anda!');
            }

            if(type==='stop') {
                showPopup('confirm', 'KONFIRMASI', `Stop & Hapus Slot ${i+1}?`, () => {
                    runTransaction(db, async(t)=>{
                        const d = (await t.get(ref)).data();
                        let s = d.chargingSlots; let q = d.waitingQueue;
                        s[i]=null; if(q.length){ s[i]={...q.shift(), startTime:null}; }
                        t.update(ref, {chargingSlots:s, waitingQueue:q});
                    });
                    window.stopAlarm();
                });
            } else {
                runTransaction(db, async(t)=>{
                    const s = (await t.get(ref)).data().chargingSlots;
                    if(s[i]) s[i].startTime = new Date();
                    t.update(ref, {chargingSlots:s});
                });
            }
        };

        window.delQ = (i, platName) => {
            const myPlat = localStorage.getItem('myPlat');
            if(!isAdminLoggedIn && myPlat !== platName) {
                return showPopup('error', 'AKSES DITOLAK', 'Ini bukan antrian Anda!');
            }

            showPopup('confirm','HAPUS', 'Hapus antrian ini?', () => {
                runTransaction(db, async(t)=>{
                    const q = (await t.get(ref)).data().waitingQueue;
                    q.splice(i,1); t.update(ref, {waitingQueue:q});
                });
            });
        };

        // ADMIN FUNCTIONS (kept original)
        window.manualAssign = () => {
            const i = document.getElementById('manSlot').value;
            const p = document.getElementById('manPlat').value;
            if(!p) return showPopup('error','ERROR','Plat kosong');
            runTransaction(db, async(t)=>{
                const s = (await t.get(ref)).data().chargingSlots || [null,null,null];
                s[i] = { name:p.toUpperCase(), startBattery:50, targetLimit:100, durationMinutes:30, startTime:new Date() };
                t.update(ref, {chargingSlots:s}, {merge:true});
            });
            showPopup('success','SUKSES',`Slot ${parseInt(i)+1} terisi.`);
        };
        window.clearSlotManual = () => {
            const i = document.getElementById('manSlot').value;
            showPopup('confirm', 'HAPUS SLOT', `Paksa hapus Slot ${parseInt(i)+1}?`, () => {
                runTransaction(db, async(t)=>{
                    const s = (await t.get(ref)).data().chargingSlots;
                    s[i] = null;
                    t.update(ref, {chargingSlots:s});
                });
            });
        };
        window.blockUser = async () => {
            const p = document.getElementById('blockPlatInput').value.toUpperCase().trim();
            if(!p) return;
            await runTransaction(db, async (t) => {
                const d = (await t.get(ref)).data(); const l = d.blockedList || [];
                if (!l.includes(p)) l.push(p); t.update(ref, {blockedList: l});
            });
            showPopup('success', 'BLOKIR', `Plat ${p} diblokir.`);
        };
        window.stopAll = () => {
            showPopup('confirm', 'BAHAYA', 'Stop SEMUA slot?', () => {
                runTransaction(db, async(t)=>{ t.update(ref, {chargingSlots:[null,null,null]}); });
            });
        };
        window.resetAll = () => {
            showPopup('confirm', 'RESET DATABASE', 'Hapus antrian & slot?', () => {
                setDoc(ref, {chargingSlots:[null,null,null], waitingQueue:[], blockedList:[]});
            });
        };

        // ADMIN LOGIN
        window.openAdminLogin = () => showPopup('admin', 'ADMIN LOGIN', 'Masukkan PIN');

        // expose stopAlarm globally
        window.stopAlarm = () => {
            if(window.alarmInterval) { clearInterval(window.alarmInterval); window.alarmInterval = null; }
        };

        // initial register of SW after page load
        window.addEventListener('load', () => {
            // best-effort register
            registerSWAndGetToken().catch(()=>{ /* ignore */ });
        });

    </script>
</body>
</html>
