<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fast Charging V33 — MLU SQUAD (Secure)</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        /* CYBERPUNK V33 (UPGRADED) */
        :root{--bg:#05060a;--glass:rgba(255,255,255,0.04);--text:#e6fbff;--muted:#8b98a6;--cyan:#00e5ff;--cyan-dim:rgba(0,229,255,0.08);--red:#ff6b6b;--card:#071022}
        [data-theme="light"]{--bg:#f6f8fb;--glass:#ffffff;--text:#0b1720;--muted:#556;--cyan:#008c9e;--cyan-dim:rgba(0,140,158,0.08);--red:#d63031;--card:#fff}
        *{box-sizing:border-box}
        body{margin:0;font-family:'Rajdhani',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px 20px 140px;}
        .container{max-width:520px;margin:0 auto}
        .header-row{display:flex;justify-content:space-between;align-items:center;margin-top:20px}
        h1{font-family:'Orbitron',sans-serif;font-size:24px;margin:0;background:linear-gradient(90deg,#fff,var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .theme-btn{background:var(--card);border-radius:10px;padding:8px 10px;border:1px solid rgba(255,255,255,0.04);cursor:pointer}
        .subtitle{color:var(--muted);font-size:11px;margin:10px 0 20px;letter-spacing:1px}
        .glass-card{background:var(--glass);border-radius:16px;padding:18px;border:1px solid rgba(255,255,255,0.04);box-shadow:0 8px 30px rgba(0,0,0,0.35);margin-bottom:18px}
        label{font-family:'Orbitron';font-size:11px;color:var(--muted);margin-bottom:6px}
        input.field{width:100%;padding:14px;border-radius:10px;border:1px solid rgba(255,255,255,0.04);background:rgba(0,0,0,0.25);color:var(--text);font-weight:700;text-align:center}
        .btn-cyan{width:100%;padding:14px;border-radius:10px;border:none;font-weight:800;background:linear-gradient(90deg,var(--cyan),#00bcd4);color:#000;cursor:pointer}
        .slots-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
        .slot-box{background:var(--card);padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.03);min-height:140px;display:flex;flex-direction:column;align-items:center}
        .slot-box.active{box-shadow:0 6px 20px rgba(0,229,255,0.06);border-color:var(--cyan-dim)}
        .bat-icon{width:44px;height:72px;border-radius:8px;border:2px solid var(--muted);position:relative;display:flex;align-items:flex-end;padding:4px;margin-bottom:8px}
        .bat-fill{width:100%;background:linear-gradient(180deg,var(--cyan),#008c9e);border-radius:6px;transition:height 0.6s}
        .bat-bolt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:18px;color:#fff;text-shadow:0 0 6px rgba(0,0,0,0.6)}
        .btn-act{width:100%;padding:8px;border-radius:8px;border:none;font-family:'Orbitron';font-weight:800;cursor:pointer}
        .btn-start{background:var(--cyan);color:#000}
        .btn-stop{background:transparent;border:1px solid var(--red);color:var(--red)}
        .footer{font-family:'Orbitron';text-align:center;color:var(--cyan);margin-top:28px}
        .log-panel{max-height:140px;overflow:auto;background:rgba(0,0,0,0.25);padding:8px;border-radius:8px;font-size:12px;color:var(--muted)}
        .dev-badge{position:fixed;right:14px;bottom:14px;background:#111;border-radius:999px;padding:8px 12px;border:1px solid rgba(255,255,255,0.05);cursor:pointer}
        .small{font-size:12px;color:var(--muted)}
    </style>
</head>
<body>

<audio id="alarmSound" preload="auto">
    <source src="data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU..." type="audio/wav">
</audio>

<div class="container">
    <div class="header-row">
        <h1>FAST CHARGING V33</h1>
        <div>
            <button class="theme-btn" id="themeToggle">☀️</button>
        </div>
    </div>
    <div class="subtitle">KELAPA GADING | HOME OF MLU — Secure Version</div>

    <div class="glass-card">
        <label>PLAT NOMOR</label>
        <input id="userPlat" class="field" placeholder="PLAT NOMOR" maxlength="10" style="text-transform:uppercase;">
        <label>BATERAI (%)</label>
        <input id="userBattery" type="number" min="0" max="99" class="field" placeholder="0 - 99">
        <button id="btnDaftar" class="btn-cyan">DAFTAR ANTRIAN</button>
        <div style="margin-top:8px;display:flex;gap:8px;align-items:center;">
            <div class="small">Mode:</div>
            <select id="modeSelect" style="padding:6px;border-radius:6px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:var(--text);">
                <option value="normal">Normal</option>
                <option value="pro">Pro (detailed logs)</option>
            </select>
        </div>
    </div>

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
        <div style="width:10px;height:10px;background:var(--cyan);border-radius:50%;box-shadow:0 0 8px var(--cyan);"></div>
        <div class="small">STATUS 3 SLOT</div>
    </div>

    <div class="slots-grid" id="slotsContainer">
        <div style="grid-column:1/-1;text-align:center;padding:30px;color:var(--muted);">Loading System...</div>
    </div>

    <div class="glass-card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;border-bottom:1px solid rgba(255,255,255,0.04);padding-bottom:10px;">
            <div style="font-family:'Orbitron';">DAFTAR TUNGGU</div>
            <div id="qCount" class="small">0</div>
        </div>
        <div id="queueList" class="small"></div>
    </div>

    <div class="glass-card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <div style="font-family:'Orbitron';">LOG AKTIVITAS</div>
            <div><button id="clearLog" style="padding:6px;border-radius:6px;background:transparent;border:1px solid rgba(255,255,255,0.04);">CLEAR</button></div>
        </div>
        <div id="logPanel" class="log-panel"></div>
    </div>

    <div class="footer">Created by : MLU SQUAD — V33</div>
</div>

<div id="devToggle" class="dev-badge">DEV</div>

<script type="module">
// ----------------------------
// CONFIG
// ----------------------------
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getFirestore, doc, onSnapshot, runTransaction, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging.js";

const firebaseConfig = {
  apiKey: "AIzaSyALIlkIDALIk83K8s1htalvW6rmNNw02Go",
  authDomain: "sistem-antrian-b1c39.firebaseapp.com",
  projectId: "sistem-antrian-b1c39",
  storageBucket: "sistem-antrian-b1c39.firebasestorage.app",
  messagingSenderId: "454124587608",
  appId: "1:454124587608:web:34fbb0f5211067a67f982d"
};

// VAPID PUBLIC KEY (you provided)
const VAPID_KEY = "ra2uPkrLOs_lECdkHUD8bLfgePr9T2C7sgWMivJdmVA";

// ----------------------------
// INIT
// ----------------------------
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const ref = doc(db, "antrian", "utama");
const messaging = getMessaging(app);

// ----------------------------
// STATE & SAFETY
// ----------------------------
let audioCtx = null;
let triggeredAlarms = new Set();
let isAdminLoggedIn = false;
let devMode = false;
let rateLimit = { lastRegister:0 };

// prevent accidental console abuse (basic)
(function lockConsole(){
  try{ Object.defineProperty(window, 'act', { writable:false }); }catch(e){}
})();

// sanitization helpers
function sanitizePlat(s){ if(!s) return ''; return String(s).replace(/[^A-Z0-9\- ]/gi,'').toUpperCase().slice(0,10); }

function log(msg){
  const lp = document.getElementById('logPanel');
  const t = new Date().toLocaleTimeString();
  lp.innerHTML = `<div>[${t}] ${String(msg)}</div>` + lp.innerHTML;
}

// ----------------------------
// AUDIO & NOTIF
// ----------------------------
function initAudioAndNotif(){
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
  if ("Notification" in window && Notification.permission !== "granted") Notification.requestPermission();
}

function playSiren(){
  // play short burst using oscillator — requires user gesture; fallback to audio tag
  try{
    if(!audioCtx) initAudioAndNotif();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(700, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 1.2);
  }catch(e){
    const a = document.getElementById('alarmSound');
    try{ a.currentTime=0; a.play(); }catch(e){}
  }
}

// When not allowed to autoplay, show modal for user to tap
function ensurePlayUserGesture(){
  if (audioCtx && audioCtx.state !== 'suspended') return true;
  showTapToPlay();
  return false;
}

function showTapToPlay(){
  // simple prompt
  if(confirm('Untuk memainkan alarm, silakan tap OK.')) playSiren();
}

// ----------------------------
// SERVICE WORKER & FCM
// ----------------------------
async function registerSWAndGetToken(){
  try{
    const reg = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
    log('Service Worker registered');
    const token = await getToken(messaging, { vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
    if(token) localStorage.setItem('fcmToken', token);
    log('FCM token:' + (token? token.slice(0,10)+'...':'(none)'));
    return token;
  }catch(e){ log('SW/Token error: '+e.message); return null; }
}

// handle foreground messages
onMessage(messaging, (payload)=>{
  log('Foreground message: '+JSON.stringify(payload.data||payload.notification||{}));
  const data = payload.data || {};
  if(data.plat && data.plat === localStorage.getItem('myPlat')){
    showAlarmModal(`Motor ${data.plat} selesai`);
    if(ensurePlayUserGesture()) playSiren();
  }
});

// listen for messages from SW
navigator.serviceWorker && navigator.serviceWorker.addEventListener('message', (ev)=>{
  if(ev.data?.type === 'ALARM_TRIGGER'){
    const plat = ev.data.plat;
    log('SW click trigger for '+plat);
    showAlarmModal(`Motor ${plat} selesai`);
    if(ensurePlayUserGesture()) playSiren();
  }
});

// if page opened with ?alarm=PLAT
const urlAlarm = new URLSearchParams(location.search).get('alarm');
if(urlAlarm){ setTimeout(()=>{ showAlarmModal(`Motor ${sanitizePlat(urlAlarm)} selesai`); if(ensurePlayUserGesture()) playSiren(); }, 400); }

// ----------------------------
// UI & FIRESTORE LOGIC
// ----------------------------
function updateSlotsUI(slots){
  const container = document.getElementById('slotsContainer');
  container.innerHTML = slots.map((x,i)=>{
    if(!x) return `<div class="slot-box" style="opacity:0.6;border-style:dashed;"> <div style='color:var(--muted)'>Kosong</div> </div>`;
    const isRun = !!x.startTime;
    const start = x.startTime && x.startTime.seconds ? x.startTime.seconds*1000 : (x.startTime? new Date(x.startTime).getTime():null);
    const end = start ? start + (x.durationMinutes*60000) : null;
    const progress = start && end ? Math.min(100, Math.round(((Date.now()-start)/(end-start))*100)) : (x.startBattery||0);
    const fillH = Math.max(6, progress)+'%';
    const btn = isRun? `<button class="btn-act btn-stop" onclick="safeStop(${i},'${x.name}')">STOP</button>`:
                   `<button class="btn-act btn-start" onclick="safeStart(${i},'${x.name}')">MULAI</button>`;
    return `<div class="slot-box ${isRun?'active':''}"><div class="bat-icon"><div class="bat-fill" style="height:${fillH}"></div><div class="bat-bolt">⚡</div></div><div style="font-weight:800">${x.name}</div><div style="font-size:12px;color:var(--muted)">${isRun?('Target: '+x.targetLimit+'%'):'Siap'}</div><div style="margin-top:8px;width:100%">${btn}</div></div>`;
  }).join('');
}

function updateQueueUI(q){
  document.getElementById('qCount').innerText = q.length;
  document.getElementById('queueList').innerHTML = q.length? q.map((x,i)=>`<div style="display:flex;justify-content:space-between;padding:8px;border-radius:8px;background:rgba(255,255,255,0.02);margin-bottom:6px"><div><b>${x.name}</b> <span style='color:var(--cyan)'>(${x.startBattery}%)</span></div><div><button onclick="safeDelQ(${i},'${x.name}')" style="background:none;border:none;color:var(--red);cursor:pointer">✕</button></div></div>`).join(''):'<div style="color:var(--muted)">Antrian Kosong</div>';
}

// realtime listener
onSnapshot(ref, (snap)=>{
  const d = snap.exists()? snap.data() : {};
  const slots = d.chargingSlots || [null,null,null];
  const q = d.waitingQueue || [];
  updateSlotsUI(slots);
  updateQueueUI(q);
  // detect finished slots by endTime or startTime+duration
  slots.forEach(s=>{
    if(!s || !s.startTime) return;
    const start = s.startTime.seconds? s.startTime.seconds*1000 : new Date(s.startTime).getTime();
    const end = start + s.durationMinutes*60000;
    if(end <= Date.now()){
      const key = s.name+end;
      if(!triggeredAlarms.has(key)){
        triggeredAlarms.add(key); triggerAlarm(s.name);
      }
    }
  });
});

// ----------------------------
// SAFE ACTION WRAPPERS
// ----------------------------
async function safeStart(i, platName){
  try{ await runTransaction(db, async t => {
    const d = (await t.get(ref)).data(); let s = d.chargingSlots || [null,null,null]; let q = d.waitingQueue || [];
    if(!s[i]) throw 'Slot kosong';
    // set startTime and endTime
    s[i].startTime = new Date();
    s[i].endTime = Date.now() + (s[i].durationMinutes*60000);
    t.update(ref, { chargingSlots: s });
    log('Start slot '+(i+1)+' for '+platName);
  }); }catch(e){ showToast('Gagal start: '+e); }
}

async function safeStop(i, platName){
  const myPlat = localStorage.getItem('myPlat');
  if(!isAdminLoggedIn && myPlat !== platName){ showPopup('error','AKSES DITOLAK','Ini bukan kendaraan Anda!'); return; }
  if(!confirm('Stop & hapus slot?')) return;
  await runTransaction(db, async t => {
    const d = (await t.get(ref)).data(); let s = d.chargingSlots || [null,null,null]; let q = d.waitingQueue || [];
    s[i] = null; if(q.length) s[i] = {...q.shift(), startTime:null};
    t.update(ref, { chargingSlots: s, waitingQueue: q });
    log('Stop slot '+(i+1));
  });
  stopAlarm();
}

async function safeDelQ(i, platName){
  const myPlat = localStorage.getItem('myPlat');
  if(!isAdminLoggedIn && myPlat !== platName){ showPopup('error','AKSES DITOLAK','Ini bukan antrian Anda!'); return; }
  if(!confirm('Hapus antrian?')) return;
  await runTransaction(db, async t => { const d = (await t.get(ref)).data(); let q = d.waitingQueue || []; q.splice(i,1); t.update(ref, { waitingQueue: q }); });
  log('Deleted queue '+platName);
}

// ----------------------------
// TRIGGER ALARM (local only for owner)
// ----------------------------
function triggerAlarm(name){
  const myPlat = localStorage.getItem('myPlat');
  if(myPlat && name === myPlat){
    showAlarmModal('Motor '+name+' selesai!');
    playSiren();
    if(navigator.vibrate) navigator.vibrate([500,200,500]);
    if(Notification.permission === 'granted') new Notification('FAST CHARGING',{body:`Plat ${name} Selesai!`,icon:'/logo.png'});
  }else{
    log('Alarm triggered for '+name+' (not owner)');
  }
}

function stopAlarm(){ if(window.alarmInterval){ clearInterval(window.alarmInterval); window.alarmInterval=null; log('Alarm stopped'); } }

// ----------------------------
// UI helpers
// ----------------------------
function showPopup(type,title,msg){ alert(title+"
"+msg); }
function showToast(t){ log(t); }
function showAlarmModal(msg){ alert(msg); }

// ----------------------------
// REGISTER + DAFTAR
// ----------------------------
document.getElementById('btnDaftar').addEventListener('click', async ()=>{
  initAudioAndNotif();
  const plat = sanitizePlat(document.getElementById('userPlat').value);
  const bat = parseInt(document.getElementById('userBattery').value);
  if(!plat || isNaN(bat)){ showPopup('error','DATA KURANG','Mohon isi plat & baterai.'); return; }
  // rate-limit (5s)
  if(Date.now() - rateLimit.lastRegister < 5000){ showToast('Tunggu sebentar sebelum daftar lagi'); return; }
  rateLimit.lastRegister = Date.now();
  localStorage.setItem('myPlat', plat);

  try{
    await runTransaction(db, async t => {
      const d = (await t.get(ref)).data() || {};
      let s = d.chargingSlots || [null,null,null]; let q = d.waitingQueue || [];
      if((d.blockedList||[]).includes(plat)) throw 'Plat diblokir';
      if(s.some(x=>x?.name===plat) || q.some(x=>x?.name===plat)) throw 'Plat sudah terdaftar';
      let dur = 0; const target = 100;
      if(bat>=90) dur = Math.ceil((100-bat)*2.2); else if(bat>=80) dur = Math.ceil((100-bat)*1.5); else dur = Math.ceil((100-bat)*0.8);
      if(dur<5) dur=5;
      const item = { name:plat, startBattery:bat, targetLimit:target, durationMinutes:dur, startTime:null };
      const empty = s.findIndex(x=>x===null);
      if(empty!==-1) s[empty]=item; else q.push(item);
      t.set(ref, { chargingSlots: s, waitingQueue: q }, { merge:true });
    });
    // save token for push
    let token = localStorage.getItem('fcmToken') || await registerSWAndGetToken();
    if(token){ await setDoc(doc(db,'userTokens', sanitizePlat(localStorage.getItem('myPlat'))), { plat: localStorage.getItem('myPlat'), token }, { merge:true }); }
    showPopup('success','BERHASIL','Masuk antrian.');
    document.getElementById('userPlat').value=''; document.getElementById('userBattery').value='';
  }catch(e){ showPopup('error','GAGAL', String(e)); }
});

// ----------------------------
// ADMIN (simple PIN dynamic)
// ----------------------------
let adminPIN = localStorage.getItem('adminPIN') || '1131';
function openAdminLogin(){ const p = prompt('Masukkan PIN Admin:'); if(p===adminPIN){ isAdminLoggedIn=true; alert('Admin login success'); } else alert('PIN salah'); }

// ----------------------------
// DEV TOGGLE & THEME
// ----------------------------
document.getElementById('devToggle').addEventListener('click', ()=>{ devMode = !devMode; alert('Dev mode '+(devMode?'ON':'OFF')); });
const themeToggle = document.getElementById('themeToggle'); themeToggle.addEventListener('click', ()=>{ if(document.body.getAttribute('data-theme')==='light'){ document.body.removeAttribute('data-theme'); themeToggle.innerText='☀️'; localStorage.setItem('theme','dark'); } else { document.body.setAttribute('data-theme','light'); themeToggle.innerText='🌙'; localStorage.setItem('theme','light'); } }); if(localStorage.getItem('theme')==='light') document.body.setAttribute('data-theme','light');

// clear logs
document.getElementById('clearLog').addEventListener('click', ()=>{ document.getElementById('logPanel').innerHTML=''; });

// ----------------------------
// INIT on load
// ----------------------------
window.addEventListener('load', async ()=>{
  // register sw in background (best-effort)
  try{ await registerSWAndGetToken(); }catch(e){}
  log('App initialized');
});

// expose some safe actions
window.stopAlarm = stopAlarm;
// prevent tampering by freezing exposed objects (best-effort)
try{ Object.freeze(window.stopAlarm); Object.freeze(window.safeStart); }catch(e){}

</script>
</body>
</html>
