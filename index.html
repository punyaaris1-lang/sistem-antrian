<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MLU SUPER APP</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* RESET */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        /* BODY SETTING (DARK MODE) */
        body {
            margin: 0; 
            height: 100vh; 
            overflow: hidden;
            background-color: #0b101a; /* Warna Dasar Gelap */
            background-image: url('1763947427555.jpg'); /* FOTO LOGO BAPAK */
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed;
            font-family: 'Rajdhani', sans-serif;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
        }

        /* LAPISAN GELAP DI ATAS GAMBAR (AGAR TEKS TERBACA) */
        body::before {
            content: ''; position: absolute; inset: 0;
            background: rgba(0, 0, 0, 0.75); /* Gelap 75% */
            z-index: -1;
        }

        /* LOGO & JUDUL */
        .logo-area { text-align: center; margin-bottom: 40px; }
        
        h1 { 
            font-family: 'Orbitron', sans-serif; 
            font-size: 42px; 
            margin: 0; 
            color: #fff; 
            letter-spacing: 3px; 
            text-shadow: 0 0 20px #00bcd4; /* Efek Neon Cyan */
        }
        
        /* TEKS KUNING BERKEDIP */
        .squad-text {
            font-family: 'Orbitron', sans-serif; 
            font-size: 14px; 
            font-weight: bold; 
            color: #000; 
            background: #ccff00; /* Kuning Stabilo */
            padding: 5px 15px; 
            border-radius: 5px; 
            margin-top: 10px; 
            display: inline-block; 
            border: 2px solid #fff;
            animation: blink 1.5s infinite;
        }
        @keyframes blink { 50% { opacity: 0.6; } }

        /* GRID MENU */
        .menu-grid { 
            display: grid; 
            gap: 20px; 
            width: 85%; 
            max-width: 400px; 
        }
        
        /* TOMBOL MENU BESAR */
        .menu-btn {
            background: rgba(255, 255, 255, 0.1); /* Transparan */
            border: 1px solid #00bcd4; /* Garis Cyan */
            padding: 20px; 
            border-radius: 20px; 
            cursor: pointer;
            display: flex; 
            align-items: center; 
            gap: 20px; 
            text-decoration: none; /* Hilangkan garis bawah link */
            backdrop-filter: blur(10px); /* Efek Kaca Buram */
            transition: 0.2s;
        }
        
        /* EFEK PENCET TOMBOL */
        .menu-btn:active { 
            transform: scale(0.95); 
            background: #00bcd4; 
        }
        .menu-btn:active h3, .menu-btn:active span { color: #000; }
        
        /* IKON TOMBOL */
        .menu-icon { 
            font-size: 32px; 
            width: 60px; 
            text-align: center; 
        }
        
        /* TEKS TOMBOL */
        .menu-text { text-align: left; }
        .menu-text h3 { 
            margin: 0; 
            font-family: 'Orbitron', sans-serif; 
            font-size: 18px; 
            color: #fff; 
            letter-spacing: 1px; 
        }
        .menu-text span { 
            font-size: 12px; 
            color: #ccc; 
            font-weight: bold; 
        }

        /* FOOTER */
        .footer {
            position: absolute; 
            bottom: 30px; 
            font-size: 10px; 
            color: #666; 
            font-family: 'Orbitron', sans-serif;
        }
    </style>
</head>
<body>

    <div class="logo-area">
        <h1>MLU APPS</h1>
        <div class="squad-text">MAKA LINTAS UTARA SQUAD</div>
    </div>

    <div class="menu-grid">
        
        <a href="lokasi.html" class="menu-btn">
            <div class="menu-icon">📍</div>
            <div class="menu-text">
                <h3>LOKASI FC</h3>
                <span>Cari charging station</span>
            </div>
        </a>

        <a href="sos.html" class="menu-btn">
            <div class="menu-icon">🆘</div>
            <div class="menu-text">
                <h3>BANTUAN SOS</h3>
                <span>Layanan Darurat</span>
            </div>
        </a>

        <a href="antrian.html" class="menu-btn">
            <div class="menu-icon">⚡</div>
            <div class="menu-text">
                <h3>ANTRIAN ONLINE</h3>
                <span>Daftar & Pantau</span>
            </div>
        </a>

    </div>

    <div class="footer">v10.0 Final | MLU Squad</div>

</body>
</html>
