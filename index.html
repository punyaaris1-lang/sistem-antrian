<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FC KELAPA GADING - SMART SYSTEM</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #020205; --accent: #CCFF00; --blue: #00F0FF; --red: #ff003c; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #fff; margin: 0; overflow-x: hidden; background-image: radial-gradient(circle at 50% 30%, #0d1a2b 0%, #000 70%); }

        /* --- 1. HEADER & GLITCH (Warna saja, posisi tetap) --- */
        .header-wrap { padding: 25px 20px; position: relative; z-index: 100; text-align: center; }
        .glitch-title { 
            font-family: 'Orbitron'; font-weight: 900; font-size: 26px; color: var(--blue); 
            text-shadow: 0 0 15px var(--blue);
            animation: text-flicker 6s infinite step-end;
        }
        @keyframes text-flicker {
            0%, 96%, 100% { color: var(--blue); text-shadow: 0 0 15px var(--blue); }
            97% { color: #fff; text-shadow: -2px 0 var(--red), 2px 0 var(--accent); } /* Efek warna */
            98% { color: var(--bg); text-shadow: none; }
            99% { color: var(--blue); text-shadow: 2px 0 var(--red), -2px 0 var(--blue); }
        }
        .sub-brand { color: var(--accent); font-size: 10px; letter-spacing: 4px; font-weight: bold; margin-top: 5px; text-shadow: 0 0 5px var(--accent); }

        /* --- 2. HUD VISUALISASI SLOT --- */
        .viewport { position: relative; height: 350px; width: 100%; margin-top: 10px; }
        .slot-box { position: absolute; display: flex; flex-direction: column; align-items: center; }
        
        /* Z-Index: Slot Tengah (Biru) menutupi samping */
        .s-side { width: 130px; top: 160px; z-index: 5; } 
        .s-left { left: 10px; } .s-right { right: 10px; }
        .s-mid { width: 220px; top: 20px; left: 50%; transform: translateX(-50%); z-index: 20; }

        .circle-ui {
            width: 100%; aspect-ratio: 1/1; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 8px solid transparent; transition: 0.3s;
            flex-direction: column;
        }

        /* Styling Kuning (Samping) */
        .s-side .circle-ui { 
            background: rgba(0,0,0,0.6); 
            border-color: var(--accent); 
            box-shadow: 0 0 20px var(--accent), inset 0 0 10px rgba(204, 255, 0, 0.2); 
        }

        /* Styling Biru (Tengah) - Background Solid agar tidak tembus */
        .s-mid .circle-ui { 
            background: #050505; 
            border-color: var(--blue); 
            box-shadow: 0 0 40px var(--blue), inset 0 0 20px rgba(0, 240, 255, 0.3); 
        }

        .val-txt { font-family: 'Orbitron'; font-weight: 900; color: #fff; line-height: 1; }
        .s-side .val-txt { font-size: 24px; } .s-mid .val-txt { font-size: 55px; }
        .info-txt { font-family: 'Inter'; font-size: 9px; margin-top: 5px; font-weight: bold; color: #aaa; text-transform: uppercase; }
        .label-txt { margin-top: 10px; font-family: 'Orbitron'; font-size: 11px; font-weight: bold; text-align: center; }
        
        /* --- 3. FINGERPRINT & RING KUNING --- */
        .fp-area { display: flex; flex-direction: column; align-items: center; margin-top: 25px; position: relative; }
        
        /* Ring Kuning Berdenyut */
        .fp-area::before {
            content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 110px; height: 110px; border-radius: 50%;
            border: 2px solid var(--accent); opacity: 0;
            animation: pulse-ring 2s infinite ease-out; z-index: 0; pointer-events: none;
        }
        @keyframes pulse-ring { 0% { width: 90px; height: 90px; opacity: 0.8; } 100% { width: 130px; height: 130px; opacity: 0; } }
        
        .fp-btn {
            width: 90px; height: 90px; border-radius: 50%; border: 2px solid #333; background: #111; 
            display: flex; align-items: center; justify-content: center; cursor: pointer; 
            transition: 0.5s; position: relative; overflow: hidden; z-index: 1; filter: grayscale(100%) opacity(0.5);
        }
        /* State Aktif (GPS Valid) */
        .fp-btn.active-zone {
            border-color: var(--blue); box-shadow: 0 0 25px var(--blue), inset 0 0 10px var(--blue);
            filter: grayscale(0%) opacity(1);
        }
        .fp-icon { width: 55px; fill: #444; transition: 0.5s; }
        .fp-btn.active-zone .fp-icon { fill: var(--blue); }

        /* Animasi Scan Merah */
        .scan-line {
            position: absolute; width: 100%; height: 4px; background: var(--red);
            box-shadow: 0 0 10px var(--red); top: -10%; left: 0; display: none; z-index: 5;
        }
        .fp-btn.scanning .scan-line { display: block; animation: scanDown 1.5s ease-in-out infinite; }
        .fp-btn.scanning .fp-icon { fill: var(--red); }
        @keyframes scanDown { 0% { top: -10%; opacity:0; } 50% { opacity:1; } 100% { top: 110%; opacity:0; } }

        /* --- 4. MUSIC PLAYER --- */
        .player-bar { 
            position: fixed; bottom: 0; width: 100%; background: #050505; 
            border-top: 1px solid var(--accent); padding: 10px 20px; 
            display: flex; align-items: center; gap: 15px; z-index: 200;
        }
        .hb-line { stroke: var(--accent); stroke-width: 2; fill: none; stroke-dasharray: 60; animation: hb-move 1s linear infinite; opacity: 0.3; }
        .playing .hb-line { opacity: 1; animation-duration: 0.5s; }
        @keyframes hb-move { to { stroke-dashoffset: -60; } }

        /* --- 5. MODALS & POPUPS --- */
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:3000; align-items:center; justify-content:center; backdrop-filter: blur(8px); }
        
        .modal-box { background:#080808; border:1px solid var(--blue); padding:25px; border-radius:15px; width:85%; max-width:350px; box-shadow: 0 0 50px rgba(0, 240, 255, 0.15); }
        input, select { width:100%; padding:12px; margin:8px 0; background:#1a1a1a; border:1px solid #333; color:#fff; border-radius:5px; text-transform: uppercase; font-family: 'Inter'; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(204,255,0,0.2); }
        .btn-reg { width:100%; padding:15px; background:var(--blue); border:none; font-weight:900; cursor:pointer; border-radius:5px; color:#000; font-family: 'Orbitron'; margin-top: 10px; box-shadow: 0 0 15px var(--blue); }

        /* Custom Alert Mewah */
        #customAlert { z-index: 5000; }
        .alert-box { 
            background: rgba(10, 10, 10, 0.98); border: 2px solid var(--accent); 
            padding: 30px; border-radius: 10px; text-align: center; width: 80%; max-width: 320px;
            box-shadow: 0 0 40px rgba(204, 255, 0, 0.3); animation: popIn 0.3s;
        }
        .alert-msg { font-family: 'Orbitron'; color: #fff; font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
        .alert-btn { 
            background: transparent; border: 1px solid var(--accent); color: var(--accent); 
            padding: 10px 30px; font-family: 'Orbitron'; font-weight: bold; cursor: pointer; 
            border-radius: 50px; transition: 0.3s;
        }
        .alert-btn:hover { background: var(--accent); color: #000; box-shadow: 0 0 20px var(--accent); }
        @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* Admin Area Styling (Adapted for Cyberpunk Theme) */
        #adminArea { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#050505; z-index:2000; padding:20px; overflow-y:auto; }
        .adm-card { background: #0a0a0a; border: 1px solid #333; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .adm-card.blue { border-color: var(--blue); }
        .adm-card.red { border-color: var(--red); }
        .adm-title { font-family: 'Orbitron'; font-size: 12px; color: #888; margin-bottom: 10px; border-bottom: 1px solid #222; padding-bottom: 5px; }
        .adm-row { display: flex; gap: 5px; margin-bottom: 5px; }
        .btn-adm { flex:1; padding:10px; border:none; border-radius:4px; font-weight:bold; cursor:pointer; font-size:10px; color:#000; }
        .bg-blue { background: var(--blue); } .bg-acc { background: var(--accent); } .bg-red { background: var(--red); color:#fff; }
    </style>
</head>

            </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, runTransaction, setDoc, updateDoc, arrayUnion, arrayRemove, collection, addDoc, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- KONFIGURASI DARI MASTER FILE ---
        const firebaseConfig = { apiKey: "AIzaSyALIlkIDALIk83K8s1htalvW6rmNNw02Go", authDomain: "sistem-antrian-b1c39.firebaseapp.com", projectId: "sistem-antrian-b1c39", storageBucket: "sistem-antrian-b1c39.firebasestorage.app", messagingSenderId: "454124587608", appId: "1:454124587608:web:34fbb0f5211067a67f982d" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const ref = doc(db, "antrian", "utama");
        const logRef = collection(db, "activityLog");

        const FONTE_TOKEN = "MuR8CucXAsYd2YvWBxVo"; 
        const WA_SIGNATURE = "\n\n- Admin FC Kelapa Gading";
        const WA_TEMPLATES = [
            "Halo {name}, motor {plat} sudah selesai charging. Mohon segera dipindahkan agar teman lain bisa pakai.",
            "Charging selesai untuk {plat}. Terima kasih {name}, jangan lupa cabut kabel ya.",
            "Waktu habis! Motor {plat} milik {name} sudah 100%. Giliran teman lain."
        ];

        // LOGIKA GPS & CHARGING
        const STATION_LOC = { lat: -6.171583, lng: 106.899844 }; 
        const MAX_DIST_KM = 0.2; 
        const CHARGING_CURVE = [[100,0], [99,1], [95,4], [90,17], [89,18], [85,22], [81,25], [72,33], [61,45], [50,50], [20,68], [0,86]];

        let latestSlots = [null, null, null]; 
        let latestQueue = [];
        let isClearing = {}; 
        let isUserInArea = false;

        // --- MP3 PLAYER DENGAN PLAYLIST ---
        // Daftar lagu dari request user
        const playlist = [
            "https://mlump3player.netlify.app/Ada%20Apa%20Denganmu.mp3",
            "https://mlump3player.netlify.app/anji-menunggu-kamu.mp3",
            "https://mlump3player.netlify.app/Anugerah%20Terindah%20Yang%20Pernah%20Kumiliki.mp3",
            "https://mlump3player.netlify.app/armada_asalkan_kau_bahagia.mp3",
            "https://mlump3player.netlify.app/armada_harusnya_aku.mp3",
            "https://mlump3player.netlify.app/Bendera%20-%20Cokelat%20-%202003.mp3",
            "https://mlump3player.netlify.app/Bintang%20Di%20Surga.mp3",
            "https://mlump3player.netlify.app/Bon%20Jovi%20-%20Always%20.MP3",
            "https://mlump3player.netlify.app/Bon%20Jovi%20-%20I'll%20Be%20There%20For%20You%20.MP3",
            "https://mlump3player.netlify.app/Bon%20Jovi%20-%20Its%20My%20Life%20.mp3"
        ];
        
        let currentTrackIndex = 0;
        const audio = document.getElementById('audio');
        const mBtn = document.getElementById('m-btn');
        const pBar = document.getElementById('p-bar');
        const trackNameDisp = document.getElementById('track-name');

        trackNameDisp.innerText = "PLAYLIST READY (" + playlist.length + " SONGS)";

        function loadTrack(index) {
            if(index >= playlist.length) index = 0;
            currentTrackIndex = index;
            audio.src = playlist[currentTrackIndex];
            // Ambil nama file dari URL, decode, dan hapus ekstensi
            let filename = decodeURIComponent(playlist[currentTrackIndex].split('/').pop()).replace('.mp3','').replace('.MP3','');
            trackNameDisp.innerText = filename;
        }

        window.togglePlay = () => {
            if (!audio.src) loadTrack(0);

            if(audio.paused) {
                audio.play().then(() => {
                    mBtn.innerText = "⏸";
                    pBar.classList.add('playing');
                }).catch(e => {
                    showAlert("INTERAKSI DIBUTUHKAN UNTUK MEMUTAR MUSIK");
                });
            } else { 
                audio.pause(); 
                mBtn.innerText = "▶"; 
                pBar.classList.remove('playing');
            }
        };

        audio.addEventListener('ended', () => {
            loadTrack(currentTrackIndex + 1);
            audio.play();
        });

        // --- HELPER FUNCTIONS ---
        window.showAlert = (msg) => {
            document.getElementById('alertText').innerText = msg;
            document.getElementById('customAlert').style.display = 'flex';
        }

        function log(action, plat, det) { 
            const userType = localStorage.getItem('isAdminLoggedIn') ? 'ADMIN' : 'USER';
            addDoc(logRef, { timestamp: new Date(), action: action, plat: plat, user: userType, details: det }).catch(console.error); 
        }

        function formatTime(m) { const s = Math.round(m * 60); return `${Math.floor(s / 60)}:${(s % 60).toString().padStart(2, '0')}`; }
        function parseDate(ts) { if(!ts) return null; if(ts.toDate) return ts.toDate(); if(ts instanceof Date) return ts; return new Date(ts); }
        
        function getBatteryFromRemTime(rem) {
            if (rem <= 0) return 100;
            for (let i=0; i<CHARGING_CURVE.length-1; i++) {
                const [p1, t1] = CHARGING_CURVE[i]; const [p2, t2] = CHARGING_CURVE[i+1];
                if (rem >= t1 && rem <= t2) return Math.round(p1 - ((rem - t1) / (t2 - t1)) * (p1 - p2));
            }
            return 0;
        }
        function calculateDuration(start, target) {
            if (start >= target) return 5;
            let timeStart=90, timeTarget=0;
            for(let i=0; i<CHARGING_CURVE.length-1; i++){ if(start<=CHARGING_CURVE[i][0] && start>=CHARGING_CURVE[i+1][0]) { const r=(CHARGING_CURVE[i][0]-start)/(CHARGING_CURVE[i][0]-CHARGING_CURVE[i+1][0]); timeStart=CHARGING_CURVE[i][1]+r*(CHARGING_CURVE[i+1][1]-CHARGING_CURVE[i][1]); break; } }
            for(let i=0; i<CHARGING_CURVE.length-1; i++){ if(target<=CHARGING_CURVE[i][0] && target>=CHARGING_CURVE[i+1][0]) { const r=(CHARGING_CURVE[i][0]-target)/(CHARGING_CURVE[i][0]-CHARGING_CURVE[i+1][0]); timeTarget=CHARGING_CURVE[i][1]+r*(CHARGING_CURVE[i+1][1]-CHARGING_CURVE[i][1]); break; } }
            return Math.max(1, Math.ceil(timeStart - timeTarget));
        }
        function calculateTargetLimit(len) { if(len >= 11) return 85; if(len >= 6) return 90; if(len >= 3) return 95; return 100; }
        
        function formatWA(num) {
            let n = num.replace(/\D/g,'');
            if(n.startsWith('0')) n = '62' + n.substring(1);
            if(!n.startsWith('62')) n = '62' + n;
            return n;
        }
        async function sendFonnteNotif(targetWA, plat, name) {
            if(!targetWA || targetWA.length < 5 || targetWA === '-') return;
            const finalMsg = WA_TEMPLATES[Math.floor(Math.random() * WA_TEMPLATES.length)].replace("{name}", name).replace("{plat}", plat) + WA_SIGNATURE;
            try {
                const formData = new FormData();
                formData.append('target', formatWA(targetWA));
                formData.append('message', finalMsg);
                await fetch('https://api.fonnte.com/send', { method: 'POST', headers: { 'Authorization': FONTE_TOKEN }, body: formData });
            } catch(e) { console.error("WA Error", e); }
        }

        // --- GPS LOGIC ---
        function getDist(lat1,lon1,lat2,lon2){ const R=6371; const dLat=(lat2-lat1)*Math.PI/180; const dLon=(lon2-lon1)*Math.PI/180; const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2); return R*(2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))); }

        if(navigator.geolocation) {
            navigator.geolocation.watchPosition((pos) => {
                const dist = getDist(pos.coords.latitude, pos.coords.longitude, STATION_LOC.lat, STATION_LOC.lng);
                const btn = document.getElementById('fp-trigger');
                const lbl = document.getElementById('fp-label');
                
                if(dist <= MAX_DIST_KM) {
                    isUserInArea = true; btn.classList.add('active-zone');
                    lbl.innerText = "ACCESS GRANTED"; lbl.style.color = "var(--blue)";
                } else {
                    isUserInArea = false; btn.classList.remove('active-zone');
                    lbl.innerText = "OUT OF RANGE (" + dist.toFixed(2) + "km)"; lbl.style.color = "#555";
                }
            }, (err) => { document.getElementById('fp-label').innerText = "GPS REQUIRED"; });
        }

        window.checkLocationAndOpen = () => {
            if(!isUserInArea) { showAlert("ANDA DI LUAR JANGKAUAN (MAX 0.2KM)"); return; }
            const btn = document.getElementById('fp-trigger');
            btn.classList.add('scanning');
            setTimeout(() => {
                btn.classList.remove('scanning');
                document.getElementById('regModal').style.display='flex';
            }, 1500);
        };

        // --- RENDER HUD ---
        onSnapshot(ref, (snap) => {
            const d = snap.data(); if(!d) return;
            latestSlots = d.chargingSlots || [null,null,null];
            latestQueue = d.waitingQueue || [];
            const qLen = latestQueue.length;

            latestSlots.forEach((m, i) => {
                const elBat = document.getElementById(`v${i+1}-bat`);
                const elPlat = document.getElementById(`v${i+1}-plat`);
                
                if(m && m.startTime) {
                    const st = parseDate(m.startTime);
                    let durReal = m.isManualTime ? m.durationMinutes : calculateDuration(m.startBattery, calculateTargetLimit(qLen));
                    const rem = ((new Date(st.getTime() + durReal*60000)) - new Date())/60000;

                    if(rem <= 0) {
                        elBat.innerText = "FULL"; elBat.style.color = "var(--accent)";
                        elPlat.innerText = m.plat; elPlat.style.color = "#fff";
                        // Auto Clear logic handled in interval
                    } else {
                        // Perkiraan baterai saat ini
                        const target = calculateTargetLimit(qLen);
                        const timeToTarget = calculateDuration(target, 100);
                        const dispBat = getBatteryFromRemTime(rem + timeToTarget);
                        
                        elBat.innerText = dispBat + "%"; elBat.style.color = "#fff";
                        elPlat.innerText = m.plat;
                        if(i === 1) document.getElementById('v2-timer').innerText = formatTime(rem);
                    }
                } else if(m) {
                    elBat.innerText = m.startBattery + "%"; elBat.style.color = "#aaa";
                    elPlat.innerText = "WAITING"; elPlat.style.color = "var(--blue)";
                } else {
                    elBat.innerText = "RDY"; elBat.style.color = "#444";
                    elPlat.innerText = "EMPTY"; elPlat.style.color = "#444";
                    if(i === 1) document.getElementById('v2-timer').innerText = "";
                }
            });

            // Update Admin Select Options & Queue List
            const sOpts = latestSlots.map((_,i)=>`<option value="${i}">Slot ${i+1}</option>`).join('');
            document.getElementById('miniSlotSelect').innerHTML = sOpts;
            document.getElementById('miniQTarget').innerHTML = sOpts;
            document.getElementById('miniQSwap1').innerHTML = latestQueue.map((x,i)=>`<option value="${i}">#${i+1} ${x.plat}</option>`).join('');
            document.getElementById('miniQSwap2').innerHTML = document.getElementById('miniQSwap1').innerHTML;
            document.getElementById('miniQIdx').innerHTML = document.getElementById('miniQSwap1').innerHTML;
            
            // Queue Display in Admin
            let qHtml = "";
            latestQueue.forEach((q, idx) => {
                qHtml += `<div>#${idx+1} ${q.plat} (${q.startBattery}%) - ${q.userName}</div>`;
            });
            document.getElementById('admQueueList').innerHTML = qHtml || "ANTRIAN KOSONG";
        });

        // --- REGISTRATION LOGIC ---
        window.processRegFromModal = () => {
            const p = document.getElementById('userPlat').value.toUpperCase().replace(/\s/g,'');
            const n = document.getElementById('userName').value.trim();
            const w = document.getElementById('userWA').value.trim();
            const b = parseInt(document.getElementById('userBattery').value);
            
            if(!p || !n || !w || isNaN(b)) { showAlert("LENGKAPI SEMUA DATA"); return; }
            
            let strikes = parseInt(localStorage.getItem('gpsStrikes')||'0');
            if(strikes >= 3) { showAlert("AKSES DIBLOKIR SEMENTARA (GPS ERROR)"); return; }

            runTransaction(db, async(t)=>{
                const d=(await t.get(ref)).data()||{}; 
                if((d.blockedList||[]).includes(p)) throw "BLOCKED";
                let s=d.chargingSlots||[null,null,null], q=d.waitingQueue||[];
                if(s.some(x=>x?.plat===p)||q.some(x=>x?.plat===p)) throw "PLAT SUDAH TERDAFTAR";
                
                const tar = calculateTargetLimit(q.length);
                const dur = calculateDuration(b, tar);
                
                const idx = s.findIndex(x=>x===null);
                if(idx!==-1) { 
                    s[idx]={plat:p, userName:n, wa:w, startBattery:b, targetLimit:tar, durationMinutes:dur, startTime:null, readyTime: new Date()}; 
                } else { 
                    q.push({plat:p, userName:n, wa:w, startBattery:b, targetLimit:100, durationMinutes:0, startTime:null}); 
                }
                t.set(ref, {chargingSlots:s, waitingQueue:q}, {merge:true});
            }).then(()=>{ 
                showAlert("PENDAFTARAN BERHASIL");
                document.getElementById('regModal').style.display='none';
                log('USER_REGISTER', p, {name:n, bat:b});
            }).catch(e=>{ showAlert("GAGAL: " + e); });
        };

        // --- ADMIN FUNCTIONS ---
        window.goAdmin = () => {
            if(prompt("PIN ADMIN") === "8080") {
                localStorage.setItem('isAdminLoggedIn', 'true');
                document.getElementById('ui-user').style.display='none';
                document.getElementById('adminArea').style.display='block';
            }
        };
        window.logoutUser = () => { location.reload(); };

        window.miniRegQ = () => {
            const p = document.getElementById('miniQPlat').value.toUpperCase().replace(/\s/g,'');
            const b = parseInt(document.getElementById('miniQBat').value);
            if(!p) return;
            runTransaction(db, async(t)=>{
                const d=(await t.get(ref)).data(); const q=d.waitingQueue||[];
                q.push({plat:p, userName:'ADMIN', wa:'-', startBattery:b, targetLimit:100, durationMinutes:0, startTime:null});
                t.update(ref,{waitingQueue:q});
            });
        };

        window.miniManualAssign = () => {
            const s=document.getElementById('miniSlotSelect').value;
            const p=document.getElementById('miniPlatInput').value.toUpperCase();
            const b=parseInt(document.getElementById('miniBatInput').value);
            if(!p) return;
            runTransaction(db, async(t)=>{
                const d=(await t.get(ref)).data();
                const target = calculateTargetLimit(d.waitingQueue.length);
                const dur = calculateDuration(b, target);
                d.chargingSlots[s]={plat:p, userName:'ADMIN', wa:'-', startBattery:b, targetLimit:target, durationMinutes:dur, startTime:null, readyTime: new Date()};
                t.update(ref,{chargingSlots:d.chargingSlots});
            });
        };

        window.miniClearSlot = () => {
            const s=document.getElementById('miniSlotSelect').value;
            if(confirm('Clear Slot?')) runTransaction(db, async(t)=>{
                const d = (await t.get(ref)).data(); d.chargingSlots[s] = null;
                // Pull queue if exists
                if(d.waitingQueue.length > 0) {
                    const next = d.waitingQueue.shift();
                    const tar = calculateTargetLimit(d.waitingQueue.length);
                    d.chargingSlots[s] = {...next, startTime:null, readyTime:new Date(), targetLimit:tar, durationMinutes:calculateDuration(next.startBattery, tar)};
                }
                t.update(ref, {chargingSlots:d.chargingSlots, waitingQueue:d.waitingQueue});
            });
        };

        window.miniMoveQ = () => {
            const qi=document.getElementById('miniQIdx').value, si=document.getElementById('miniQTarget').value;
            runTransaction(db, async(t)=>{
                const d=(await t.get(ref)).data(); const q=d.waitingQueue; const s=d.chargingSlots;
                if(s[si]) throw "Slot Penuh";
                const item=q.splice(qi,1)[0]; 
                item.readyTime = new Date();
                item.targetLimit = calculateTargetLimit(q.length);
                item.durationMinutes = calculateDuration(item.startBattery, item.targetLimit);
                s[si]=item;
                t.update(ref,{chargingSlots:s, waitingQueue:q});
            });
        };
        
        window.miniSwapQueuePositions = () => {
            const i1=document.getElementById('miniQSwap1').value, i2=document.getElementById('miniQSwap2').value;
            if(i1==i2) return;
            runTransaction(db, async(t)=>{
                const d=(await t.get(ref)).data(); const q=d.waitingQueue;
                [q[i1], q[i2]] = [q[i2], q[i1]];
                t.update(ref,{waitingQueue:q});
            });
        };

        window.miniBlock = () => { updateDoc(ref,{blockedList:arrayUnion(document.getElementById('miniBlockPlat').value.toUpperCase())}); };
        window.miniUnblock = () => { updateDoc(ref,{blockedList:arrayRemove(document.getElementById('miniBlockPlat').value.toUpperCase())}); };
        window.miniStopAll = () => { if(confirm('DARURAT: STOP SEMUA?')) updateDoc(ref,{chargingSlots:[null,null,null]}); };

        // --- AUTO SYSTEM (INTERVAL) ---
        setInterval(()=>{
            if(!latestSlots) return;
            latestSlots.forEach((m,i)=>{
                // Auto Start logic (5 menit ready)
                if(m && !m.startTime && m.readyTime) {
                    if((new Date() - parseDate(m.readyTime)) >= 300000) { // 5 mins
                        runTransaction(db, async(t)=>{
                            const d=(await t.get(ref)).data();
                            if(d.chargingSlots[i] && !d.chargingSlots[i].startTime) {
                                d.chargingSlots[i].startTime = new Date();
                                t.update(ref, d);
                            }
                        });
                    }
                }
                // Auto Kill logic (Finished + 1 min)
                if(m && m.startTime && !isClearing[i]) {
                    const st = parseDate(m.startTime);
                    let dur = m.isManualTime ? m.durationMinutes : calculateDuration(m.startBattery, m.targetLimit||100);
                    const finishTime = new Date(st.getTime() + dur*60000);
                    
                    if(new Date() > new Date(finishTime.getTime() + 60000)) {
                        isClearing[i] = true;
                        runTransaction(db, async(t)=>{
                            const d = (await t.get(ref)).data();
                            const oldWA = d.chargingSlots[i]?.wa; const oldPlat = d.chargingSlots[i]?.plat; const oldName = d.chargingSlots[i]?.userName;
                            d.chargingSlots[i] = null;
                            if(d.waitingQueue.length > 0) {
                                const next = d.waitingQueue.shift();
                                const tar = calculateTargetLimit(d.waitingQueue.length);
                                d.chargingSlots[i] = {...next, startTime:null, readyTime:new Date(), targetLimit:tar, durationMinutes:calculateDuration(next.startBattery, tar)};
                            }
                            t.update(ref, d);
                            sendFonnteNotif(oldWA, oldPlat, oldName);
                        }).finally(() => { setTimeout(() => { delete isClearing[i]; }, 2000); });
                    }
                }
            });
        }, 2000);

    </script>
</body>
