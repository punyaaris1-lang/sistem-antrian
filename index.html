<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MLU SUPER APP</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <link rel="manifest" href="manifest.json">
    
    <style>
        /* GLOBAL RESET */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; 
            height: 100vh; 
            overflow: hidden;
            background-color: #0b101a;
            background-image: url('1763947427555.jpg'); 
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed;
            font-family: 'Rajdhani', sans-serif;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        /* OVERLAY GELAP */
        body::before {
            content: ''; position: absolute; inset: 0;
            background: rgba(0, 0, 0, 0.75);
            z-index: -1;
        }

        /* LOGO AREA */
        .logo-area { 
            text-align: center; 
            margin-top: 60px; 
            margin-bottom: 30px; 
        }
        
        h1 { 
            font-family: 'Orbitron', sans-serif; font-size: 42px; margin: 0; 
            color: #fff; letter-spacing: 3px; text-shadow: 0 0 20px #00bcd4;
        }
        
        .squad-text {
            font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: bold; 
            color: #000; background: #ccff00; padding: 5px 15px; border-radius: 5px; 
            margin-top: 5px; display: inline-block; border: 2px solid #fff;
            animation: blink 1.5s infinite; letter-spacing: 1px;
        }
        @keyframes blink { 50% { opacity: 0.6; } }

        /* MENU GRID */
        .menu-grid { 
            display: grid; gap: 15px; width: 85%; max-width: 400px; margin-top: 20px;
        }
        
        /* TOMBOL MENU */
        .menu-btn {
            background: rgba(255, 255, 255, 0.1); border: 1px solid #00bcd4; 
            padding: 25px; border-radius: 20px; cursor: pointer;
            display: flex; align-items: center; gap: 20px; text-decoration: none; 
            backdrop-filter: blur(10px); transition: 0.2s; box-shadow: 0 0 15px rgba(0, 188, 212, 0.1);
        }
        
        .menu-btn:active { transform: scale(0.96); background: #00bcd4; }
        .menu-btn:active h3, .menu-btn:active span { color: #000; }
        
        .menu-icon { 
            font-size: 28px; width: 55px; height: 55px;
            background: rgba(0, 229, 255, 0.1); border: 1px solid #00bcd4; border-radius: 15px;
            display: flex; align-items: center; justify-content: center; color: #00bcd4;
            box-shadow: 0 0 10px rgba(0, 188, 212, 0.3);
        }
        
        .menu-text { text-align: left; }
        .menu-text h3 { margin: 0; font-family: 'Orbitron', sans-serif; font-size: 18px; color: #fff; letter-spacing: 1px; text-transform: uppercase; }
        .menu-text span { font-size: 12px; color: #aaa; font-weight: bold; }

        /* TOMBOL INSTALL (SPESIAL) */
        #btnInstallApp {
            display: flex; /* PAKSA MUNCUL */
            border-color: #ccff00;
            background: rgba(204, 255, 0, 0.05);
        }
        #btnInstallApp .menu-icon {
            color: #ccff00; border-color: #ccff00;
            background: rgba(204, 255, 0, 0.1);
            box-shadow: 0 0 10px rgba(204, 255, 0, 0.3);
        }

        .footer { position: absolute; bottom: 30px; font-size: 10px; color: #00bcd4; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="logo-area">
        <h1>MLU APPS</h1>
        <div class="squad-text">MAKA LINTAS UTARA SQUAD</div>
    </div>

    <div class="menu-grid">
        <a href="lokasi.html" class="menu-btn">
            <div class="menu-icon">📍</div>
            <div class="menu-text"><h3>LOKASI FC</h3><span>Cari charging station</span></div>
        </a>

        <a href="sos.html" class="menu-btn">
            <div class="menu-icon">🆘</div>
            <div class="menu-text"><h3>MAKA SOS</h3><span>Layanan Darurat CS Maka</span></div>
        </a>

        <a href="antrian.html" class="menu-btn">
            <div class="menu-icon">⚡</div>
            <div class="menu-text"><h3>FC KLP GADING</h3><span>Daftar & Pantau</span></div>
        </a>

        <div id="btnInstallApp" class="menu-btn">
            <div class="menu-icon">📲</div>
            <div class="menu-text"><h3>INSTALL APP</h3><span>Pasang di HP</span></div>
        </div>
    </div>

    <div class="footer">v10.2 Final | MLU Squad</div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        let deferredPrompt;
        const installBtn = document.getElementById('btnInstallApp');

        // Cek jika sudah diinstall (Standalone Mode) -> Sembunyikan Tombol
        if (window.matchMedia('(display-mode: standalone)').matches) {
            installBtn.style.display = 'none';
        }

        // Tangkap Event Browser
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        // Logic Saat Tombol Diklik
        installBtn.addEventListener('click', (e) => {
            if (deferredPrompt) {
                // Jika browser support install otomatis
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        installBtn.style.display = 'none'; // Sembunyikan jika sukses
                    }
                    deferredPrompt = null;
                });
            } else {
                // Jika tidak support otomatis (atau di iPhone/Browser non-Chrome)
                alert("ℹ️ CARA INSTALL MANUAL:\n\n1. Klik titik tiga (⋮) di pojok kanan atas browser.\n2. Pilih 'Tambahkan ke Layar Utama' atau 'Install App'.\n\n(Di iPhone: Klik Share -> Add to Home Screen)");
            }
        });
    </script>

</body>
</html>
