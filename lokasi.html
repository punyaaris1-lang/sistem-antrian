<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>LOKASI FC</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Syne:wght@700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        /* STYLE DARI SCRIPT ASLI (Disesuaikan untuk Standalone Page) */
        :root {
            --bg: #ffffff; /* Ganti ke Putih sesuai request tema clean */
            --text: #1a1a1a;
            --accent: #CCFF00;
            --cyan: #00bcd4;
            --card-border: #eee;
            --card-bg: #fff;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* HEADER (MODIFIKASI: ADA TOMBOL BACK) */
        .header { 
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; 
            background: #fff; border-bottom: 1px solid #eee; z-index: 50;
        }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .btn-back { 
            text-decoration: none; font-size: 24px; color: #333; 
            border: 1px solid #ccc; width: 40px; height: 40px; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
        }
        .header-title h1 { font-family: 'Orbitron'; font-size: 18px; margin: 0; color: #000; letter-spacing: 1px; }
        .header-title span { font-size: 10px; color: #666; font-weight: bold; letter-spacing: 2px; }

        /* TOGGLE VIEW */
        .toggle-mode { background: #f0f0f0; border: 1px solid #ddd; border-radius: 20px; display: flex; padding: 2px; }
        .t-btn { padding: 6px 12px; font-size: 10px; font-weight: 800; color: #888; cursor: pointer; border-radius: 18px; transition: 0.2s; }
        .t-btn.active { background: #333; color: #fff; }

        /* CONTAINER */
        #view-list { display: flex; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 20px; }
        #view-map { display: none; flex: 1; width: 100%; height: 100%; position: relative; }
        #fullMap { width: 100%; height: 100%; }

        /* HERO SECTION (TERDEKAT) */
        .hero-section { padding: 20px; flex-shrink: 0; }
        .hero-card { 
            background: #fff; border: 1px solid #eee; border-radius: 20px; padding: 20px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); display: flex; flex-direction: column; 
            transition: 0.3s;
        }
        .hero-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .radar-status { 
            background: rgba(204,255,0,0.2); color: #88aa00; font-size: 10px; 
            padding: 4px 8px; border-radius: 8px; font-weight: 800; display: flex; align-items: center; gap: 5px;
        }
        .gps-dot { width: 6px; height: 6px; background: #88aa00; border-radius: 50%; animation: pulse 1s infinite; }
        @keyframes pulse { 0% {opacity:1} 50% {opacity:0.3} 100% {opacity:1} }
        
        .hero-dist { font-family: 'Syne'; font-weight: 700; font-size: 14px; color: var(--cyan); }
        .hero-name { font-family: 'Inter'; font-size: 22px; font-weight: 800; color: #000; margin: 0 0 5px 0; line-height: 1.2; }
        .hero-info { font-size: 12px; color: #666; margin-bottom: 15px; border-left: 3px solid var(--cyan); padding-left: 10px; }
        .btn-nav-hero { 
            width: 100%; padding: 12px; background: #333; color: #fff; border: none; 
            border-radius: 10px; font-weight: 800; cursor: pointer; font-size: 12px;
        }

        /* LIST STYLE */
        .city-group { margin-bottom: 20px; }
        .city-header { padding: 0 20px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        .city-title { font-family: 'Syne'; font-weight: 700; font-size: 12px; text-transform: uppercase; color: #888; }
        .city-line { height: 1px; background: #eee; flex-grow: 1; }
        
        .h-scroll { 
            display: flex; gap: 12px; overflow-x: auto; padding: 0 20px; 
            scrollbar-width: none; padding-bottom: 10px;
        }
        .mini-card { 
            min-width: 150px; height: 160px; border-radius: 16px; padding: 15px; 
            display: flex; flex-direction: column; justify-content: space-between; 
            background: #fff; border: 1px solid #eee; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            position: relative; overflow: hidden; cursor: pointer;
        }
        .mini-top h3 { margin: 0 0 5px 0; font-size: 13px; font-weight: 700; color: #000; line-height: 1.3; }
        .mini-info { font-size: 10px; color: #666; line-height: 1.4; }
        .mini-dist { font-size: 14px; font-family: 'Syne'; font-weight: 800; color: var(--cyan); text-align: right; }

        /* MAP OVERLAY */
        .map-overlay { position: fixed; inset: 0; background: #fff; z-index: 2000; transform: translateY(100%); transition: 0.3s; display: flex; flex-direction: column; }
        .map-overlay.active { transform: translateY(0); }
        .map-container { flex: 1; width: 100%; background: #eee; }
        .map-controls { padding: 20px; background: #fff; border-top: 1px solid #eee; box-shadow: 0 -5px 20px rgba(0,0,0,0.1); }
        .btn-close-map { position: absolute; top: 20px; left: 20px; width: 40px; height: 40px; background: #fff; border: 1px solid #ccc; border-radius: 50%; z-index: 3000; font-size: 18px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .btn-gmaps-start { width: 100%; padding: 14px; background: var(--cyan); color: #fff; border: none; border-radius: 12px; font-weight: 800; text-align: center; text-decoration: none; display: block; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <a href="index.html" class="btn-back">⬅</a>
            <div class="header-title">
                <h1>FAST CHARGING</h1>
                <span>PETA LOKASI</span>
            </div>
        </div>
        <div class="toggle-mode">
            <div id="btnList" class="t-btn active" onclick="switchView('list')">☰ LIST</div>
            <div id="btnMap" class="t-btn" onclick="switchView('map')">🗺️ PETA</div>
        </div>
    </div>

    <div id="view-list">
        <div class="hero-section">
            <div id="scanState" class="hero-card" style="align-items:center; text-align:center; min-height:120px;">
                <div class="gps-dot" style="width:15px; height:15px; margin-bottom:10px;"></div>
                <h3 style="margin:0; color:#888; font-size:14px;">Mencari Lokasi Terdekat...</h3>
                <p style="margin:5px 0 0; font-size:10px; color:#aaa;">Pastikan GPS Aktif</p>
            </div>

            <div id="foundState" class="hero-card" style="display:none;">
                <div class="hero-header">
                    <div class="radar-status"><div class="gps-dot"></div> TERDEKAT</div>
                    <div class="hero-dist" id="heroDist">-- KM</div>
                </div>
                <h2 class="hero-name" id="heroName">Nama Lokasi</h2>
                <div class="hero-info" id="heroInfo">Info...</div>
                <button class="btn-nav-hero" onclick="openMapModal()">LIHAT DI PETA 📍</button>
            </div>
        </div>

        <div id="mainListContainer"></div>
    </div>

    <div id="view-map">
        <div id="fullMap"></div>
    </div>

    <div id="mapOverlay" class="map-overlay">
        <button class="btn-close-map" onclick="closeMapModal()">✕</button>
        <div id="mapCanvas" class="map-container"></div>
        <div class="map-controls">
            <div><h3 id="mapTitle" style="margin:0; font-family:'Orbitron';">Nama Lokasi</h3><p id="mapSub" style="margin:5px 0 15px; color:#666; font-size:12px;">-- KM</p></div>
            <a href="#" id="btnGmaps" target="_blank" class="btn-gmaps-start">NAVIGASI GOOGLE MAPS ↗</a>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // --- SCRIPT ASLI DARI BAPAK (DIBERSIHKAN BAGIAN INTRO-NYA) ---
        
        const JAWG_API = "l1PdBwk1arfZcY7wECff2jE2Ts7qpJyMqGGqHK8cjCxcLb6m0FPHm1sExB5NvLyA";
        const URL_LOKASI = "https://docs.google.com/spreadsheets/d/1EJOTMMfGpBMFPqR0LzbMbh7tZUcTCZld4x387OO9aJM/export?format=csv"; 

        let chargers = [];
        let userLat = null; let userLng = null;
        let map = null; let mapFull = null; let currentMapTarget = null;

        // Langsung jalan saat load
        loadData();

        async function loadData() {
            try {
                const res = await fetch(URL_LOKASI);
                const txt = await res.text();
                
                chargers = txt.split('\n').slice(1).map((r, i) => {
                    const c = r.split(',');
                    let latVal = parseFloat(c[4]);
                    let lngVal = parseFloat(c[5]);
                    if(c.length < 5 || isNaN(latVal) || isNaN(lngVal)) return null;
                    return { 
                        id: i, name:c[0], city:c[1], type:c[2], status:c[3], 
                        lat:latVal, lng:lngVal, link:c[6]||'',
                        nozzle: c[7] || '-', cost: c[8] || '-'
                    };
                }).filter(i=>i);

                renderList(); 

                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(p => { 
                        userLat=p.coords.latitude; userLng=p.coords.longitude; 
                        processData(); 
                    });
                }
            } catch(e) {}
        }

        function switchView(mode) {
            if(mode === 'list') {
                document.getElementById('btnList').classList.add('active'); document.getElementById('btnMap').classList.remove('active');
                document.getElementById('view-list').style.display = 'flex'; document.getElementById('view-map').style.display = 'none';
            } else {
                document.getElementById('btnMap').classList.add('active'); document.getElementById('btnList').classList.remove('active');
                document.getElementById('view-list').style.display = 'none'; document.getElementById('view-map').style.display = 'block';
                initFullMap();
            }
        }

        function initFullMap() {
            if(!mapFull) {
                mapFull = L.map('fullMap', {zoomControl:false}).setView([-6.200000, 106.816666], 11);
                L.tileLayer(`https://tile.jawg.io/jawg-matrix/{z}/{x}/{y}{r}.png?access-token=${JAWG_API}`, {}).addTo(mapFull);
            }
            setTimeout(() => { mapFull.invalidateSize(); }, 200);
            
            if(userLat) {
                const userIcon = L.divIcon({className: 'gps-dot', html:'<div style="width:10px;height:10px;background:blue;border-radius:50%;border:2px solid white;"></div>'});
                L.marker([userLat, userLng], {icon: userIcon}).addTo(mapFull);
            }
            
            chargers.forEach(item => {
                L.marker([item.lat, item.lng]).addTo(mapFull)
                 .bindPopup(`<b>${item.name}</b><br><button onclick="openMapModalFromCluster(${item.id})" style="margin-top:5px;">Lihat Detail</button>`);
            });
        }
        
        // Expose ke window agar bisa dipanggil dari string popup
        window.openMapModalFromCluster = (id) => {
            const item = chargers.find(c => c.id === id);
            if(item) openMapModal(item);
        };

        function openMapModal(item) {
            if (!item) item = currentMapTarget;
            currentMapTarget = item;

            document.getElementById('mapOverlay').classList.add('active');
            document.getElementById('mapTitle').innerText = item.name;
            document.getElementById('mapSub').innerText = `Jarak: ${item.dist ? item.dist.toFixed(1) : '--'} KM`;
            
            const realLink = (item.link && item.link.length > 10) ? item.link : `https://www.google.com/maps/search/?api=1&query=${item.lat},${item.lng}`;
            document.getElementById('btnGmaps').href = realLink;

            setTimeout(() => {
                if(map) { map.remove(); map = null; }
                map = L.map('mapCanvas', {zoomControl: false}).setView([item.lat, item.lng], 15);
                L.tileLayer(`https://tile.jawg.io/jawg-matrix/{z}/{x}/{y}{r}.png?access-token=${JAWG_API}`, {}).addTo(map);
                L.marker([item.lat, item.lng]).addTo(map).bindPopup(item.name).openPopup();
                
                if(userLat) {
                   L.marker([userLat, userLng]).addTo(map).bindPopup("Anda");
                }
            }, 300);
        }

        window.closeMapModal = () => document.getElementById('mapOverlay').classList.remove('active');

        function getDist(lat1, lon1, lat2, lon2) {
            const R=6371; const dLat=(lat2-lat1)*Math.PI/180; const dLon=(lon2-lon1)*Math.PI/180;
            const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
            return (R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))).toFixed(1);
        }

        function processData() {
            if(userLat) { 
                chargers.forEach(c => c.dist=parseFloat(getDist(userLat,userLng,c.lat,c.lng))); 
                chargers.sort((a,b)=> { if(isNaN(a.dist)) return 1; if(isNaN(b.dist)) return -1; return a.dist-b.dist; });
            }
            
            if(chargers.length > 0) {
                const n = chargers[0];
                currentMapTarget = n;
                document.getElementById('scanState').style.display = 'none';
                document.getElementById('foundState').style.display = 'flex';
                document.getElementById('heroName').innerText = n.name;
                document.getElementById('heroDist').innerText = n.dist.toFixed(1) + ' KM';
                document.getElementById('heroInfo').innerText = `${n.city} • ${n.type}`;
                renderList();
            }
        }

        function renderList() {
            const listCont = document.getElementById('mainListContainer');
            listCont.innerHTML = ''; 
            let grouped = {};
            for(let i=0; i<chargers.length; i++) {
                let item = chargers[i];
                let city = item.city || 'Lainnya';
                if(!grouped[city]) grouped[city] = [];
                grouped[city].push(item);
            }
            
            Object.keys(grouped).forEach(city => {
                let groupHTML = `<div class="city-group"><div class="city-header"><div class="city-title">${city}</div><div class="city-line"></div></div><div class="h-scroll">`;
                grouped[city].forEach(item => {
                    // Passing JSON object safely
                    // Solusi sederhana: simpan ID di onclick, lalu cari objectnya
                    groupHTML += `
                    <div onclick="openMapModalFromCluster(${item.id})" class="mini-card">
                        <div class="mini-top"><h3>${item.name}</h3><div class="mini-info">${item.type}<br>${item.nozzle}</div></div>
                        <div class="mini-dist">${item.dist ? item.dist.toFixed(1)+' KM' : ''}</div>
                    </div>`;
                });
                groupHTML += `</div></div>`;
                listCont.innerHTML += groupHTML;
            });
        }
    </script>
</body>
</html>
