<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>PETA LOKASI</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Syne:wght@700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --accent: #CCFF00; /* KUNING STABILO */
            --cyan: #00bcd4;
            --dark: #0b101a;
            --glass-dark: rgba(11, 16, 26, 0.85);
            --glass-item: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; background: var(--dark); color: var(--text); font-family: 'Inter', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* HEADER TRANSPARAN */
        .header {
            position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
            padding: 20px; display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
            pointer-events: none; /* Supaya peta di bawahnya bisa digeser */
        }
        
        .btn-back { 
            pointer-events: auto; text-decoration: none; font-size: 24px; color: var(--cyan); 
            border: 1px solid var(--cyan); width: 45px; height: 45px; background: rgba(0,0,0,0.5);
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            backdrop-filter: blur(5px); transition: 0.2s;
        }
        .btn-back:active { transform: scale(0.9); background: var(--cyan); color: #000; }

        /* ICON PETIR GLOWING */
        .lightning-box {
            pointer-events: auto; cursor: pointer;
            font-size: 32px; color: var(--accent);
            filter: drop-shadow(0 0 10px var(--accent));
            transition: transform 0.1s;
        }
        /* Animasi Kedip saat diklik */
        .lightning-box.blink { animation: flash 0.1s infinite; }
        @keyframes flash { 0% {opacity:1; transform:scale(1.2);} 50% {opacity:0.2; transform:scale(0.8);} 100% {opacity:1; transform:scale(1.2);} }

        /* MAP CONTAINER */
        #map { flex: 1; width: 100%; height: 100%; z-index: 1; background: #111; }

        /* LIST OVERLAY (GLASS STYLE) */
        .list-overlay {
            position: absolute; bottom: 0; left: 0; right: 0; z-index: 999;
            background: var(--glass-dark); /* Gelap Transparan */
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-top: 2px solid var(--cyan);
            border-top-left-radius: 24px; border-top-right-radius: 24px;
            display: flex; flex-direction: column;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
            height: 50vh; transition: 0.3s;
        }
        
        .list-header { padding: 15px 20px; text-align: center; flex-shrink: 0; }
        .drag-handle { width: 50px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 5px; margin: 0 auto 10px; }
        .list-title { font-family: 'Orbitron'; font-weight: 800; font-size: 14px; color: #fff; letter-spacing: 2px; margin: 0; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        .gps-status { font-size: 10px; color: var(--cyan); margin-top: 5px; font-weight: bold; }

        .scroll-area { overflow-y: auto; padding: 0 20px 20px; flex: 1; }

        /* HERO CARD (GLASS) */
        .hero-section { padding: 0 20px; margin-bottom: 15px; }
        .hero-card {
            background: rgba(204, 255, 0, 0.05); /* Tint Kuning Tipis */
            border: 1px solid var(--accent); border-radius: 16px; padding: 15px;
            display: flex; flex-direction: column; gap: 8px; position: relative;
            box-shadow: 0 0 20px rgba(204, 255, 0, 0.1);
        }
        .hero-badge { 
            background: var(--accent); color: #000; font-size: 10px; 
            padding: 4px 8px; border-radius: 4px; font-weight: 900; width: fit-content;
            font-family: 'Orbitron';
        }
        .hero-title { font-family: 'Orbitron'; font-weight: 800; font-size: 18px; color: #fff; margin: 5px 0; }
        .hero-info { font-size: 11px; color: #ccc; margin: 0; display: flex; gap: 10px; }
        .btn-nav {
            background: var(--cyan); color: #000; text-align: center; padding: 10px;
            border-radius: 8px; font-weight: 800; text-decoration: none; font-size: 12px; font-family: 'Orbitron';
            display: block; margin-top: 10px; box-shadow: 0 0 10px var(--cyan); border: none;
        }

        /* ITEM LIST (GLASS) */
        .list-item {
            background: var(--glass-item); border: 1px solid var(--border); 
            border-radius: 12px; padding: 15px; margin-bottom: 10px; 
            cursor: pointer; display: flex; justify-content: space-between; align-items: center;
            transition: 0.2s;
        }
        .list-item:active { background: rgba(0, 188, 212, 0.2); border-color: var(--cyan); }
        
        .item-left { display: flex; flex-direction: column; gap: 4px; }
        .item-name { font-weight: 700; font-size: 14px; color: #fff; font-family: 'Orbitron'; letter-spacing: 0.5px; }
        .item-info { font-size: 10px; color: #aaa; display: flex; align-items: center; gap: 5px; }
        .badge { background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; font-size: 9px; color: var(--accent); border: 1px solid rgba(255,255,255,0.1); }
        
        .item-right { text-align: right; }
        .item-dist { font-family: 'Syne'; font-weight: 800; font-size: 16px; color: var(--cyan); text-shadow: 0 0 5px rgba(0, 188, 212, 0.5); }
        .btn-go { 
            background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 4px 10px; 
            border-radius: 4px; font-weight: bold; font-size: 9px; margin-top: 4px; font-family: 'Orbitron';
        }

        /* LOADING */
        #loading { 
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); 
            color: var(--cyan); font-family: 'Orbitron'; font-size: 12px; letter-spacing: 2px;
            z-index: 2000; pointer-events: none; text-shadow: 0 0 10px var(--cyan);
            animation: pulse 1s infinite;
        }
        @keyframes pulse { 0%{opacity:1} 50%{opacity:0.5} 100%{opacity:1} }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="btn-back">⬅</a>
        <div class="lightning-box" id="btnFlash" onclick="flashIcon()">⚡</div>
    </div>

    <div id="map"></div>
    <div id="loading">MEMUAT PETA...</div>

    <div class="list-overlay">
        <div class="list-header">
            <div class="drag-handle"></div>
            <h3 class="list-title">LOKASI CHARGING</h3>
            <div id="gpsStat" class="gps-status">Mencari satelit...</div>
        </div>
        
        <div class="scroll-area">
            <div class="hero-section" id="heroSection" style="display:none;">
                <div class="hero-card">
                    <div style="display:flex; justify-content:space-between;">
                        <span class="hero-badge">REKOMENDASI</span>
                        <span class="item-dist" id="heroDist">-- KM</span>
                    </div>
                    <h2 class="hero-title" id="heroName">Nama Lokasi</h2>
                    <p class="hero-info" id="heroDesc">Info</p>
                    <a href="#" id="heroLink" target="_blank" class="btn-nav">NAVIGASI GOOGLE MAPS</a>
                </div>
            </div>
            
            <div id="listContainer"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // CONFIG
        const SHEET_URL = "https://docs.google.com/spreadsheets/d/1EJOTMMfGpBMFPqR0LzbMbh7tZUcTCZld4x387OO9aJM/export?format=csv";
        const MAP_TOKEN = "l1PdBwk1arfZcY7wECff2jE2Ts7qpJyMqGGqHK8cjCxcLb6m0FPHm1sExB5NvLyA";
        
        let map = L.map('map', {zoomControl: false}).setView([-6.200000, 106.816666], 11);
        let userMarker = null;
        let locations = [];

        // TILE LAYER (Dark Mode - Jawg Matrix agar serasi dengan tema)
        L.tileLayer(`https://tile.jawg.io/jawg-matrix/{z}/{x}/{y}{r}.png?access-token=${MAP_TOKEN}`, {
            attribution: '', maxZoom: 18
        }).addTo(map);

        // Custom Icon
        const pinIcon = L.divIcon({
            className: 'custom-pin',
            html: `<div style="background:#00bcd4; width:14px; height:14px; border:2px solid #fff; border-radius:50%; box-shadow:0 0 10px #00bcd4;"></div>`,
            iconSize: [14, 14], iconAnchor: [7, 7]
        });

        // Efek Kedip Icon Petir
        function flashIcon() {
            const el = document.getElementById('btnFlash');
            el.classList.add('blink');
            setTimeout(() => el.classList.remove('blink'), 1000); // Kedip selama 1 detik
        }

        async function loadData() {
            try {
                const response = await fetch(SHEET_URL);
                const text = await response.text();
                const rows = text.split('\n').slice(1);

                locations = rows.map((row, index) => {
                    const cols = row.split(',');
                    if (cols.length < 6) return null;
                    return {
                        id: index,
                        name: cols[0].replace(/"/g, ''),
                        type: cols[2] || 'Fast Charging',
                        lat: parseFloat(cols[4]),
                        lng: parseFloat(cols[5]),
                        link: cols[6],
                        nozzle: cols[7] || '-',
                        dist: 9999
                    };
                }).filter(item => item && !isNaN(item.lat));

                locations.forEach(loc => {
                    L.marker([loc.lat, loc.lng], {icon: pinIcon}).addTo(map)
                     .bindPopup(`<b style="color:#333">${loc.name}</b>`);
                });

                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(successGPS, errorGPS);
                } else {
                    renderList();
                }

            } catch (err) { document.getElementById('loading').innerText = "Gagal memuat data."; }
        }

        function successGPS(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            
            if (userMarker) map.removeLayer(userMarker);
            userMarker = L.circleMarker([lat, lng], {
                color: '#ccff00', fillColor: '#ccff00', fillOpacity: 0.8, radius: 6
            }).addTo(map);
            
            map.setView([lat, lng], 12);
            document.getElementById('gpsStat').innerText = "GPS Aktif • Diurutkan dari terdekat";
            document.getElementById('gpsStat').style.color = "var(--neon-yellow)";

            locations.forEach(loc => {
                loc.dist = getDistance(lat, lng, loc.lat, loc.lng);
            });

            locations.sort((a, b) => a.dist - b.dist);
            renderList();
        }

        function errorGPS() {
            document.getElementById('gpsStat').innerText = "GPS Mati • Urutan default";
            renderList();
        }

        function renderList() {
            document.getElementById('loading').style.display = 'none';
            const container = document.getElementById('listContainer');
            container.innerHTML = "";

            if(locations.length > 0) {
                const top = locations[0];
                document.getElementById('heroSection').style.display = 'block';
                document.getElementById('heroName').innerText = top.name;
                document.getElementById('heroDesc').innerText = `${top.nozzle} • ${top.type}`;
                document.getElementById('heroDist').innerText = top.dist.toFixed(1) + " KM";
                const gLink = top.link && top.link.includes('http') ? top.link : `https://www.google.com/maps/dir/?api=1&destination=${top.lat},${top.lng}&travelmode=two_wheeler`;
                document.getElementById('heroLink').href = gLink;
            }

            locations.forEach(loc => {
                const item = document.createElement('div');
                item.className = 'list-item';
                item.onclick = () => { map.flyTo([loc.lat, loc.lng], 16); };
                const gLink = loc.link && loc.link.includes('http') ? loc.link : `https://www.google.com/maps/dir/?api=1&destination=${loc.lat},${loc.lng}&travelmode=two_wheeler`;

                item.innerHTML = `
                    <div class="item-left">
                        <div class="item-name">${loc.name}</div>
                        <div class="item-info">
                            <span class="badge">${loc.nozzle}</span>
                            <span style="color:#ccc">${loc.type}</span>
                        </div>
                    </div>
                    <div class="item-right">
                        <div class="item-dist">${loc.dist.toFixed(1)} KM</div>
                        <button class="btn-go" onclick="window.open('${gLink}', '_blank')">GO</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function getDistance(lat1,lon1,lat2,lon2) {
            var R = 6371; 
            var dLat = (lat2-lat1) * (Math.PI/180);  
            var dLon = (lon2-lon1) * (Math.PI/180); 
            var a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1*(Math.PI/180)) * Math.cos(lat2*(Math.PI/180)) * Math.sin(dLon/2) * Math.sin(dLon/2); 
            var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
            return R * c; 
        }

        loadData();
    </script>
</body>
</html>
