<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>PETA LOKASI</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* === GLOBAL THEME: BLUE GLOSSY === */
        :root {
            --neon-blue: #00f3ff;
            --deep-blue: #0a192f;
            --glass-bg: rgba(10, 25, 47, 0.85);
            --glass-border: rgba(0, 243, 255, 0.3);
            --text: #ffffff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; padding: 0; 
            background: #000; color: var(--text); 
            font-family: 'Rajdhani', sans-serif; 
            height: 100vh; display: flex; flex-direction: column; overflow: hidden; 
        }

        /* HEADER */
        .header {
            position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
            padding: 20px; display: flex; align-items: center;
            background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 100%);
            pointer-events: none; /* Agar peta di bawahnya bisa digeser */
        }
        
        .btn-back { 
            pointer-events: auto; text-decoration: none; font-size: 20px; color: var(--neon-blue); 
            border: 1px solid var(--neon-blue); width: 40px; height: 40px; background: rgba(0,0,0,0.5);
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            backdrop-filter: blur(5px); transition: 0.2s; box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }
        .btn-back:active { transform: scale(0.9); background: var(--neon-blue); color: #000; }

        /* MAP CONTAINER */
        #map { flex: 1; width: 100%; height: 100%; z-index: 1; background: #0b101a; }

        /* === CUSTOM MARKER (ICON PETIR) === */
        .custom-pin {
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; color: var(--neon-blue);
            filter: drop-shadow(0 0 8px var(--neon-blue));
            transition: transform 0.2s;
        }
        /* Efek Berkedip untuk Lokasi Terdekat */
        .custom-pin.nearest {
            color: #fff; font-size: 36px; z-index: 1000 !important;
            filter: drop-shadow(0 0 15px var(--neon-blue));
            animation: bounce 1.5s infinite;
        }
        @keyframes bounce { 0%, 100% {transform: translateY(0) scale(1);} 50% {transform: translateY(-10px) scale(1.2);} }

        /* === CUSTOM POPUP MEWAH === */
        .leaflet-popup-content-wrapper {
            background: rgba(10, 25, 47, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
            border-radius: 12px; color: #fff; text-align: center;
            padding: 0;
        }
        .leaflet-popup-tip { background: var(--neon-blue); }
        .leaflet-popup-content { margin: 10px; font-family: 'Rajdhani', sans-serif; }
        
        .popup-title { font-family: 'Orbitron'; font-size: 14px; color: var(--neon-blue); margin-bottom: 5px; font-weight: bold; letter-spacing: 1px; }
        .popup-desc { font-size: 12px; color: #ccc; margin-bottom: 10px; }
        .popup-btn { 
            display: block; background: linear-gradient(90deg, #00c6ff, #0072ff); 
            color: #fff; text-decoration: none; padding: 6px 12px; border-radius: 20px; 
            font-size: 10px; font-weight: bold; font-family: 'Orbitron';
        }

        /* LIST OVERLAY (GLASS STYLE) */
        .list-overlay {
            position: absolute; bottom: 0; left: 0; right: 0; z-index: 999;
            background: var(--glass-bg);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-top: 2px solid var(--neon-blue);
            border-top-left-radius: 24px; border-top-right-radius: 24px;
            display: flex; flex-direction: column;
            box-shadow: 0 -10px 50px rgba(0, 243, 255, 0.1);
            height: 45vh; transition: 0.3s;
        }
        
        .list-header { padding: 15px 20px; text-align: center; flex-shrink: 0; }
        .drag-handle { width: 40px; height: 4px; background: rgba(0, 243, 255, 0.5); border-radius: 5px; margin: 0 auto 10px; box-shadow: 0 0 10px var(--neon-blue); }
        .list-title { font-family: 'Orbitron'; font-weight: 800; font-size: 14px; color: #fff; letter-spacing: 2px; margin: 0; text-shadow: 0 0 10px var(--neon-blue); }
        .gps-status { font-size: 10px; color: var(--neon-blue); margin-top: 5px; font-weight: bold; }

        .scroll-area { overflow-y: auto; padding: 0 20px 20px; flex: 1; }

        /* ITEM LIST (GLOSSY) */
        .list-item {
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(0, 243, 255, 0.2); 
            border-radius: 12px; padding: 15px; margin-bottom: 10px; 
            cursor: pointer; display: flex; justify-content: space-between; align-items: center;
            transition: 0.2s;
        }
        .list-item:active { background: rgba(0, 243, 255, 0.1); border-color: var(--neon-blue); }
        
        .item-left { display: flex; flex-direction: column; gap: 4px; }
        .item-name { font-weight: 700; font-size: 14px; color: #fff; font-family: 'Orbitron'; letter-spacing: 0.5px; }
        .item-info { font-size: 10px; color: #aaa; display: flex; align-items: center; gap: 5px; }
        .badge { background: rgba(0, 243, 255, 0.1); padding: 2px 6px; border-radius: 4px; font-size: 9px; color: var(--neon-blue); border: 1px solid rgba(0, 243, 255, 0.2); }
        
        .item-right { text-align: right; }
        .item-dist { font-family: 'Rajdhani'; font-weight: 800; font-size: 18px; color: var(--neon-blue); text-shadow: 0 0 5px rgba(0, 243, 255, 0.5); }
        .btn-go { 
            background: transparent; color: #fff; border: 1px solid #fff; padding: 4px 10px; 
            border-radius: 4px; font-weight: bold; font-size: 9px; margin-top: 4px; font-family: 'Orbitron';
        }

        /* LOADING */
        #loading { 
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); 
            color: var(--neon-blue); font-family: 'Orbitron'; font-size: 12px; letter-spacing: 2px;
            z-index: 2000; pointer-events: none; text-shadow: 0 0 10px var(--neon-blue);
            animation: pulse 1s infinite;
        }
        @keyframes pulse { 0%{opacity:1} 50%{opacity:0.5} 100%{opacity:1} }
    </style>
</head>
<body>

    <div class="header">
        <!-- TOMBOL BACK SAJA (PETIR KANAN DIHAPUS) -->
        <a href="index.html" class="btn-back">⬅</a>
    </div>

    <div id="map"></div>
    <div id="loading">MEMUAT PETA...</div>

    <div class="list-overlay">
        <div class="list-header">
            <div class="drag-handle"></div>
            <h3 class="list-title">LOKASI CHARGING</h3>
            <div id="gpsStat" class="gps-status">Mencari satelit...</div>
        </div>
        
        <div class="scroll-area">
            <div id="listContainer"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const SHEET_URL = "https://docs.google.com/spreadsheets/d/1EJOTMMfGpBMFPqR0LzbMbh7tZUcTCZld4x387OO9aJM/export?format=csv";
        // Menggunakan Token Jawg Matrix (Dark Blue Theme)
        const MAP_TOKEN = "l1PdBwk1arfZcY7wECff2jE2Ts7qpJyMqGGqHK8cjCxcLb6m0FPHm1sExB5NvLyA";
        
        let map = L.map('map', {zoomControl: false}).setView([-6.200000, 106.816666], 11);
        let userMarker = null;
        let locations = [];
        let markers = [];

        L.tileLayer(`https://tile.jawg.io/jawg-matrix/{z}/{x}/{y}{r}.png?access-token=${MAP_TOKEN}`, {
            attribution: '', maxZoom: 18
        }).addTo(map);

        // Icon Normal
        const normalIcon = L.divIcon({
            className: 'custom-pin',
            html: `⚡`, // Icon Petir Emoji
            iconSize: [30, 30], iconAnchor: [15, 15]
        });

        // Icon Terdekat (Akan ditambah class 'nearest' via JS)
        const nearestIcon = L.divIcon({
            className: 'custom-pin nearest',
            html: `⚡`,
            iconSize: [40, 40], iconAnchor: [20, 20]
        });

        async function loadData() {
            try {
                const response = await fetch(SHEET_URL);
                const text = await response.text();
                const rows = text.split('\n').slice(1);

                locations = rows.map((row, index) => {
                    const cols = row.split(',');
                    if (cols.length < 6) return null;
                    return {
                        id: index,
                        name: cols[0].replace(/"/g, ''),
                        type: cols[2] || 'Fast Charging',
                        lat: parseFloat(cols[4]),
                        lng: parseFloat(cols[5]),
                        link: cols[6],
                        nozzle: cols[7] || '-',
                        dist: 9999
                    };
                }).filter(item => item && !isNaN(item.lat));

                // Render marker awal (normal)
                locations.forEach(loc => {
                    const gLink = loc.link && loc.link.includes('http') ? loc.link : `https://www.google.com/maps/dir/?api=1&destination=${loc.lat},${loc.lng}&travelmode=two_wheeler`;
                    
                    const m = L.marker([loc.lat, loc.lng], {icon: normalIcon})
                        .addTo(map)
                        .bindPopup(`
                            <div class="popup-title">${loc.name}</div>
                            <div class="popup-desc">${loc.nozzle} • ${loc.type}</div>
                            <a href="${gLink}" target="_blank" class="popup-btn">NAVIGASI GO</a>
                        `);
                    markers.push({ id: loc.id, marker: m });
                });

                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(successGPS, errorGPS);
                } else {
                    renderList();
                }

            } catch (err) { document.getElementById('loading').innerText = "Gagal memuat data."; }
        }

        function successGPS(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            
            if (userMarker) map.removeLayer(userMarker);
            userMarker = L.circleMarker([lat, lng], {
                color: '#fff', fillColor: '#2979ff', fillOpacity: 1, radius: 8, weight: 3
            }).addTo(map);
            
            map.setView([lat, lng], 12);
            document.getElementById('gpsStat').innerText = "GPS Aktif • Mengurutkan terdekat...";

            // Hitung Jarak
            locations.forEach(loc => {
                loc.dist = getDistance(lat, lng, loc.lat, loc.lng);
            });

            // Urutkan
            locations.sort((a, b) => a.dist - b.dist);

            // Update Marker Terdekat (Bikin Berkedip)
            if(locations.length > 0) {
                const nearestId = locations[0].id;
                markers.forEach(mObj => {
                    if(mObj.id === nearestId) {
                        mObj.marker.setIcon(nearestIcon); // Ganti jadi icon besar & kedip
                        mObj.marker.setZIndexOffset(1000); // Taruh paling atas
                    } else {
                        mObj.marker.setIcon(normalIcon); // Reset lainnya
                    }
                });
            }

            renderList();
        }

        function errorGPS() {
            document.getElementById('gpsStat').innerText = "GPS Mati • Urutan default";
            renderList();
        }

        function renderList() {
            document.getElementById('loading').style.display = 'none';
            const container = document.getElementById('listContainer');
            container.innerHTML = "";

            locations.forEach(loc => {
                const item = document.createElement('div');
                item.className = 'list-item';
                item.onclick = () => { 
                    map.flyTo([loc.lat, loc.lng], 16);
                    // Buka popup otomatis saat list diklik
                    const mObj = markers.find(m => m.id === loc.id);
                    if(mObj) mObj.marker.openPopup();
                };
                
                const gLink = loc.link && loc.link.includes('http') ? loc.link : `https://www.google.com/maps/dir/?api=1&destination=${loc.lat},${loc.lng}&travelmode=two_wheeler`;

                item.innerHTML = `
                    <div class="item-left">
                        <div class="item-name">${loc.name}</div>
                        <div class="item-info">
                            <span class="badge">${loc.nozzle}</span>
                            <span style="color:#aaa">${loc.type}</span>
                        </div>
                    </div>
                    <div class="item-right">
                        <div class="item-dist">${loc.dist.toFixed(1)} KM</div>
                        <button class="btn-go" onclick="window.open('${gLink}', '_blank')">GO</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function getDistance(lat1,lon1,lat2,lon2) {
            var R = 6371; 
            var dLat = (lat2-lat1) * (Math.PI/180);  
            var dLon = (lon2-lon1) * (Math.PI/180); 
            var a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1*(Math.PI/180)) * Math.cos(lat2*(Math.PI/180)) * Math.sin(dLon/2) * Math.sin(dLon/2); 
            var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
            return R * c; 
        }

        loadData();
    </script>
</body>
</html>
