<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BANTUAN SOS</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-blue: #00f3ff;
            --danger: #ff3b3b;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --border: rgba(0, 243, 255, 0.3);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 20px;
            font-family: 'Rajdhani', sans-serif; color: #fff;
            height: 100vh; overflow: hidden;
            background-color: #0b101a;
            background-image: url('1763947427555.jpg'); 
            background-size: cover; background-position: center; 
            background-attachment: fixed; position: relative;
            display: flex; flex-direction: column;
        }
        
        body::before { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.85); z-index: -1; }

        /* HEADER */
        .header {
            display: flex; align-items: center; gap: 20px;
            margin-bottom: 30px; padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
        .btn-back {
            text-decoration: none; font-size: 24px; color: var(--danger);
            border: 1px solid var(--danger); width: 45px; height: 45px; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            background: rgba(255, 59, 59, 0.1); backdrop-filter: blur(5px);
            box-shadow: 0 0 10px rgba(255, 59, 59, 0.2);
        }
        h1 { 
            font-family: 'Orbitron'; font-size: 20px; margin: 0; color: #fff;
            text-shadow: 0 0 10px var(--danger); letter-spacing: 2px;
        }

        /* CONTAINER TOMBOL */
        .sos-container { 
            display: flex; flex-direction: column; gap: 15px; 
            width: 100%; max-width: 400px; margin: 0 auto; 
        }

        /* TOMBOL GLOSSY */
        .btn-sos {
            background: var(--glass-bg); 
            padding: 20px; border-radius: 15px; 
            display: flex; align-items: center; gap: 20px; 
            text-decoration: none; color: #fff; cursor: pointer;
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            transition: 0.2s; position: relative; overflow: hidden;
        }
        
        .btn-sos:active { transform: scale(0.96); background: rgba(0, 243, 255, 0.1); }

        /* WARNA TOMBOL KHUSUS */
        .btn-sos.yellow { border-left: 4px solid #ffd700; box-shadow: 0 0 20px rgba(255, 215, 0, 0.1); }
        .btn-sos.red { border-left: 4px solid var(--danger); box-shadow: 0 0 20px rgba(255, 59, 59, 0.15); }
        .btn-sos.green { border-left: 4px solid #00e676; box-shadow: 0 0 20px rgba(0, 230, 118, 0.1); }

        /* TEXT */
        .icon { font-size: 28px; width: 40px; text-align: center; }
        .text h3 { margin: 0; font-family: 'Orbitron'; font-size: 15px; letter-spacing: 1px; color: #fff; }
        .text p { margin: 3px 0 0; font-size: 11px; color: var(--neon-blue); font-weight: bold; }

        .footer { margin-top: auto; text-align: center; padding-bottom: 20px; }
        .footer a { color: var(--neon-blue); text-decoration: none; font-size: 12px; font-family: 'Orbitron'; }

    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="btn-back">⬅</a>
        <h1>LAYANAN DARURAT</h1>
    </div>

    <div class="sos-container">
        
        <a href="https://wa.me/6287722285445?text=Halo%20Admin,%20saya%20butuh%20bantuan%20TOWING/MOGOK" class="btn-sos yellow">
            <div class="icon">🚑</div>
            <div class="text">
                <h3>MAKA HELP</h3>
                <p>Bantuan Mogok / Towing</p>
            </div>
        </a>

        <a href="https://wa.me/628123456789?text=URGENT!%20Laporan%20KECELAKAAN" class="btn-sos red">
            <div class="icon">🚨</div>
            <div class="text">
                <h3>URC EMERGENCY</h3>
                <p>Laporan Kecelakaan (Fast Response)</p>
            </div>
        </a>

        <a href="https://wa.me/6285117468556?text=Halo%20Admin,%20info%20TAGIHAN" class="btn-sos green">
            <div class="icon">💳</div>
            <div class="text">
                <h3>ADMINISTRASI</h3>
                <p>Info Tagihan & Xendit</p>
            </div>
        </a>

    </div>

    <div class="footer">
        <a href="index.html">KEMBALI KE MENU UTAMA</a>
    </div>

</body>
</html>
