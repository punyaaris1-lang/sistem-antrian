<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BANTUAN SOS</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* GLOBAL VARS (DARK THEME - SAMA KAYA HOME) */
        :root {
            --bg-dark: #0b101a;
            --text: #ffffff;
            --cyan: #00bcd4;
            --soft-red: #ff3b3b;
            --neon-yellow: #ccff00;
            --card-bg: rgba(255,255,255,0.1);
            --border: rgba(255, 255, 255, 0.2);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 20px;
            font-family: 'Rajdhani', sans-serif; 
            color: var(--text); 
            height: 100vh; overflow: hidden;
            background-color: #000;
            /* BACKGROUND SAMA DENGAN HOME */
            background-image: url('1763947427555.jpg'); 
            background-size: cover; background-position: center; 
            background-attachment: fixed; position: relative;
            display: flex; flex-direction: column;
        }
        
        /* Overlay Gelap */
        body::before { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.8); z-index: -1; }

        /* HEADER */
        .header {
            display: flex; align-items: center; gap: 20px;
            margin-bottom: 40px; padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
        .btn-back {
            text-decoration: none; font-size: 24px; color: var(--soft-red);
            border: 1px solid var(--soft-red); width: 45px; height: 45px; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.3); backdrop-filter: blur(5px);
        }
        h1 { 
            font-family: 'Orbitron'; font-size: 22px; margin: 0; color: #fff;
            text-shadow: 0 0 10px var(--soft-red); letter-spacing: 2px;
        }

        /* CONTAINER TOMBOL */
        .sos-container { 
            display: flex; flex-direction: column; gap: 20px; 
            width: 100%; max-width: 400px; margin: 0 auto; 
        }

        /* TOMBOL GLOSSY (MIRIP HOME TAPI ADA AKSEN WARNA) */
        .btn-sos {
            background: rgba(255, 255, 255, 0.08); 
            padding: 25px; border-radius: 20px; 
            display: flex; align-items: center; gap: 20px; 
            text-decoration: none; color: #fff; cursor: pointer;
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            transition: 0.2s; position: relative; overflow: hidden;
        }
        
        .btn-sos:active { transform: scale(0.96); background: rgba(255,255,255,0.2); }

        /* AKSEN WARNA */
        .btn-sos.yellow { border-left: 5px solid orange; box-shadow: 0 0 15px rgba(255, 165, 0, 0.1); }
        .btn-sos.red { border-left: 5px solid var(--soft-red); box-shadow: 0 0 15px rgba(255, 59, 59, 0.1); }
        .btn-sos.green { border-left: 5px solid #25D366; box-shadow: 0 0 15px rgba(37, 211, 102, 0.1); }

        /* TEXT */
        .icon { font-size: 32px; width: 50px; text-align: center; }
        .text h3 { margin: 0; font-family: 'Orbitron'; font-size: 16px; letter-spacing: 1px; }
        .text p { margin: 5px 0 0; font-size: 12px; color: #aaa; font-weight: bold; }

        /* FOOTER */
        .footer { margin-top: auto; text-align: center; padding-bottom: 20px; }
        .footer a { color: #666; text-decoration: none; font-size: 12px; font-family: 'Orbitron'; }

    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="btn-back">⬅</a>
        <h1>MAKA CS/ DARURAT (SOS)</h1>
    </div>

    <div class="sos-container">
        
        <a href="https://wa.me/6287722285445?text=Halo%20Admin,%20saya%20butuh%20bantuan%20TOWING/MOGOK" class="btn-sos yellow">
            <div class="icon">🚑</div>
            <div class="text">
                <h3>MAKA SOS</h3>
                <p>Customer Care Maka Motor</p>
            </div>
        </a>

        <a href="https://wa.me/628123456789?text=URGENT!%20Laporan%20KECELAKAAN" class="btn-sos red">
            <div class="icon">🚨</div>
            <div class="text">
                <h3>URC KECELAKAAN</h3>
                <p>Tim Reaksi Cepat</p>
            </div>
        </a>

        <a href="https://wa.me/6285117468556?text=Halo%20Admin,%20info%20TAGIHAN" class="btn-sos green">
            <div class="icon">💳</div>
            <div class="text">
                <h3>ADMIN TAGIHAN</h3>
                <p>Informasi pembayaran/Xendit</p>
            </div>
        </a>

    </div>

    <div class="footer">
        <a href="index.html">KEMBALI KE MENU UTAMA</a>
    </div>

</body>
</html>
